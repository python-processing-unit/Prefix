name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build interpreter and extensions
        run: .\build.ps1

      - name: Run tests
        run: .\tests\test.ps1

  build-and-test-ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          sudo snap install powershell --classic

      - name: Build interpreter and extensions
        shell: pwsh
        run: ./build.ps1

      - name: Run tests
        shell: pwsh
        run: ./tests/test.ps1
