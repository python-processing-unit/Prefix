The statement `WHILE(condition){ ... }` MUST evaluate `condition` before each iteration and execute its body only while that condition remains truthy. When the condition becomes false, control MUST continue with the statement following the loop.

The counted-loop form `FOR(counter, target){ ... }` MUST evaluate `target` exactly once at loop entry, require it to be an `INT`, initialize `counter` to `1`, and execute the body once for each value through `target`, inclusive. The parallel counted-loop form `PARFOR(counter, target){ ... }` MUST evaluate `target` once, require an `INT`, execute iterations `1..target` concurrently, wait for all iterations to finish, and then either continue normally or re-raise any collected iteration failures as described in [3.5](#35-loops).

Loop counters introduced by `FOR` and `PARFOR` MUST be loop-local. Other declarations created in loop bodies MUST remain bound in the enclosing environment, subject to the merge and race semantics defined for `PARFOR`.

#### 9.2.6 Function-definition and return statements

Named function definitions MUST use the `FUNC` statement form with an explicit return type, function name, typed parameter list, and block body. Parameters MAY declare default expressions, coerced parameters MUST be marked with `~`, and all parameter-binding and default-evaluation behavior MUST follow the rules defined in [4.6](#46-functions) and [5.3](#53-function-symbols-and-call-binding).

The statement `RETURN(expression)` MUST terminate the innermost enclosing function immediately and produce the supplied value as that function's result. The returned value MUST satisfy the function's declared return type, and using `RETURN` outside a function MUST raise a runtime error.

The statement `POP(SYMBOL: name)` MUST be valid only inside a function body. It MUST retrieve the current value bound to `name`, delete that binding from the environment, and then return the retrieved value as though `RETURN(name)` had executed immediately before the deletion. Using `POP` outside a function, or applying it to an unreadable binding, MUST raise a runtime error.

#### 9.2.7 Asynchronous and thread statements

The statement form `ASYNC{ ... }` MUST start execution of its block in a background task that runs asynchronously with respect to the caller while sharing the same lexical environment. When used as a statement, any resulting `THR` handle MUST be ignored.

The statement form `THR(symbol){ ... }` MUST create a background task and bind its handle to `symbol` with static type `THR` in the current lexical environment. Runtime failures originating in either asynchronous statement form MUST be reported through the runtime's asynchronous error-reporting mechanisms and MUST NOT synchronously abort another execution context.

#### 9.2.8 Loop-control and jump statements

The statement `BREAK(n)` MUST exit the innermost `n` enclosing loops, where `n` evaluates to a strictly positive `INT`. The statement `CONTINUE()` MUST skip the remainder of the current iteration of the innermost enclosing loop and proceed according to the next-iteration rules of that loop. Using either statement outside an applicable loop context MUST raise a runtime error.

The statement `GOTOPOINT(n)` MUST register a jump target identified by runtime value `n`, and `GOTO(n)` MUST transfer control to a previously registered matching target within the permitted visibility scope. Invalid target values, unregistered targets, or jumps that otherwise violate the control-flow rules defined in [3.7](#37-loop-control-and-jumps) MUST raise runtime errors.

## 10. Standard library

The standard library is a set of packages and modules bundled with the interpreter that provide a set of common utilities.

Bundled standard-library modules MUST live under `stdlib/`. Module and package search paths used by `IMPORT` and `IMPORT_PATH` MUST consult `stdlib/` immediately before `lib/`, so bundled modules are preferred over legacy or user-installed library copies.

Bundled extensions shipped with the interpreter MUST live under `stdext/`. Extension search paths MUST consult `stdext/` immediately before `ext/`, so bundled extensions are preferred over user-installed copies with the same name.

At present, the standard library is not defined by the specification, and any reasonable set of standard utilities is acceptable for a conforming implementation. Backwards-incompatible changes to the standard library MUST NOT increment the major version number of the specification, unless the incompatible change is altering a behaviour defined in this specification (NOTE: *At present* none of the stdlib is documented, and the stdlib should be considered unstable.).

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const md = document.getElementById('md').textContent;
      const rendered = marked.parse(md);
      const container = document.getElementById('content');
      container.innerHTML = rendered;

      // Ensure predictable heading IDs so TOC fragment links work.
      // Slug function: lowercase, remove punctuation except digits/letters/spaces/-,
      // collapse spaces to hyphens.
      function slugify(text) {
        return text.trim().toLowerCase()
          .replace(/<[^>]+>/g, '')
          .replace(/[^a-z0-9\s-]/g, '')
          .replace(/\s+/g, '-');
      }

      const headings = container.querySelectorAll('h1,h2,h3,h4,h5,h6');
      headings.forEach(h => {
        if (!h.id || h.id.trim() === '') {
          h.id = slugify(h.textContent || h.innerText || '');
        }
      });

      function ensureTocStyle() {
        if (document.getElementById('generated-toc-style')) return;
        const style = document.createElement('style');
        style.id = 'generated-toc-style';
        style.textContent = '\n' +
          '.generated-toc { padding-left: 1.2rem; }\n' +
          '.generated-toc > li { margin: 0.6rem 0; }\n' +
          '.generated-toc li ul { margin-top: 0.25rem; margin-bottom: 0.25rem; }\n';
        document.head.appendChild(style);
      }

      function findTocHeading(root) {
        return Array.from(root.querySelectorAll('h2')).find(h =>
          (h.textContent || '').trim().toLowerCase() === 'table of contents'
        );
      }

      function buildTocList(root, tocHeading) {
        const tocLevels = new Set([2, 3, 4]);
        const items = Array.from(root.querySelectorAll('h2,h3,h4')).filter(h => h !== tocHeading);
        if (items.length === 0) return null;

        const tocRoot = document.createElement('ul');
        tocRoot.className = 'generated-toc';
        const listStack = [tocRoot];
        let currentLevel = 2;

        items.forEach(h => {
          const level = Number(h.tagName.slice(1));
          if (!tocLevels.has(level)) return;

          while (currentLevel < level) {
            const parentList = listStack[listStack.length - 1];
            let parentLi = parentList.lastElementChild;
            if (!parentLi || parentLi.tagName.toLowerCase() !== 'li') {
              parentLi = document.createElement('li');
              parentLi.textContent = '';
              parentList.appendChild(parentLi);
            }
            const nested = document.createElement('ul');
            parentLi.appendChild(nested);
            listStack.push(nested);
            currentLevel += 1;
          }

          while (currentLevel > level) {
            listStack.pop();
            currentLevel -= 1;
          }

          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = (h.textContent || '').trim();
          li.appendChild(a);
          listStack[listStack.length - 1].appendChild(li);
        });

        return tocRoot;
      }

      function replaceTocBlock(root) {
        const tocHeading = findTocHeading(root);
        if (!tocHeading) return;

        let stop = tocHeading.nextElementSibling;
        while (stop && stop.tagName.toLowerCase() !== 'hr') {
          stop = stop.nextElementSibling;
        }

        let node = tocHeading.nextSibling;
        while (node && node !== stop) {
          const next = node.nextSibling;
          node.remove();
          node = next;
        }

        ensureTocStyle();
        const tocList = buildTocList(root, tocHeading);
        if (!tocList) return;

        if (stop) {
          root.insertBefore(tocList, stop);
        } else {
          root.appendChild(tocList);
        }
      }

      replaceTocBlock(container);
    });
  </script>
