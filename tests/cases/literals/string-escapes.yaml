passing:
  - name: string-escapes-hex
    language: Prefix
    source: |
        assert(eq("\x6a", "j"))
        assert(eq("\u00e9", "\U000000E9"))
        assert(eq("\U0000006a", "j"))
        
        assert(eq("\x4142", "A42"))
        assert(eq("\u004142", "A42"))
        assert(eq("\U0000004142", "A42"))
  - name: string-escapes
    language: Prefix
    source: |
        assert(eq("\\", "\x5C"))
        assert(eq("\"", "\x22"))
        assert(eq("'", "\x27"))
        assert(eq("\a", "\x07"))
        assert(eq("\b", "\x08"))
        assert(eq("\f", "\x0C"))
        assert(eq("\n", "\x0A"))
        assert(eq("\r", "\x0D"))
        assert(eq("\t", "\x09"))
        assert(eq("\v", "\x0B"))
        assert(eq("\e", "\x1B"))
        assert(eq("A", "\x41"))
        assert(eq("A", "\u0041"))
        assert(eq("A", "\U00000041"))
        assert(eq("\u263A", "\U0000263A"))
        assert(eq("\u00E9", "\U000000E9"))
failing:
  - name: string-invalid-U-escape-uppercase
    language: Prefix
    source: |
        str bad = "\U0000G000"
        
  - name: string-invalid-U-short-escape
    language: Prefix
    source: 'str bad = "\U0000123"'
  - name: string-invalid-escape
    language: Prefix
    source: |
        str bad = "oops\q"
        
  - name: string-invalid-u-escape
    language: Prefix
    source: |
        str bad = "\u12G4"
        
  - name: string-invalid-u-short
    language: Prefix
    source: 'str bad = "\u123"'
  - name: string-invalid-x-escape
    language: Prefix
    source: |
        str bad = "\xGG"
        
  - name: string-invalid-x-short
    language: Prefix
    source: 'str bad = "\x4"'
