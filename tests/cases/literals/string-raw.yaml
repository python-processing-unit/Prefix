passing:
  - name: string-raw-mode-toggle
    language: Prefix
    source: |
        ASSERT(EQ("\R\q", '\\q'))
        ASSERT(EQ("\R\\\R", '\\\\'))
        ASSERT(EQ("\R\n\R\t", '\\n\t'))
  - name: string-raw-mode
    language: Prefix
    source: |
        ASSERT(EQ("\R\n\t\x41\u0042\U00000043", '\\n\\t\\x41\\u0042\\U00000043'))
        ASSERT(EQ("A\R\n\RB", 'A\\nB'))
        ASSERT(EQ("\R\n", '\\n'))
