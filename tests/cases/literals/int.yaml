passing:
  - name: int-literals-extended
    language: Prefix
    source: |
        int a = 0d123
        int b = -0d42
        int c = 0x1A3
        int d = 0b1010
        int e = 0o755
        int g = 0r16FF
        int h = -0r16FF
        
        ASSERT(EQ(a, 0d123))
        ASSERT(EQ(b, -0d42))
        ASSERT(EQ(c, 0x1A3))
        ASSERT(EQ(d, 0b1010))
        ASSERT(EQ(e, 0o755))
        ASSERT(EQ(g, 0xFF))
        ASSERT(EQ(h, -0xFF))
        
  - name: int
    language: Prefix
    source: |
        int b = 0b1
        int o = 0o7
        int d = 0d9
        int h = 0xF
        int t = 0tV
        int c = 0cz
        int s = 0s_
        int r = 0r15E
        
  - name: int-decimal-no-prefix
    language: Prefix
    source: |
        int a = 123
        int b = 0
        int c = 42
        int d = 007
        
        ASSERT(EQ(a, 0d123))
        ASSERT(EQ(b, 0d0))
        ASSERT(EQ(c, 0d42))
        ASSERT(EQ(d, 0d7))
        
  - name: int-decimal-base-annotation
    language: Prefix
    source: |
        int{10} a = 0d42
        int{2} b = 0b101
        
        ASSERT(EQ(a, 0d42))
        ASSERT(EQ(b, 0b101))
        
