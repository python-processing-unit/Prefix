passing:
  - name: string-bool-context
    language: Prefix
    source: |
        if(""){
            assert(false)
        } else {
            assert(true)
        }
        
        if(''){
            assert(false)
        } else {
            assert(true)
        }
        
        if("x"){
            assert(true)
        } else {
            assert(false)
        }
        
        if('x'){
            assert(true)
        } else {
            assert(false)
        }
  - name: string-literals
    language: Prefix
    source: |
        str empty_single = ''
        str empty_double = ""
        str single = 'alpha'
        str double = "beta"
        str mixed_single = 'double "quote"'
        str mixed_double = "single 'quote'"
        
        assert(eq(empty_single, empty_double))
        assert(eq(single, "alpha"))
        assert(eq(double, 'beta'))
        assert(eq(mixed_single, "double \"quote\""))
        assert(eq(mixed_double, 'single \'quote\''))
        
failing:
  - name: string-mismatched-quote
    language: Prefix
    source: |
        str bad = "oops'
        
  - name: string-unterminated-double
    language: Prefix
    source: |
        str bad = "oops
        
  - name: string-unterminated-single
    language: Prefix
    source: |
        str bad = 'oops
        
