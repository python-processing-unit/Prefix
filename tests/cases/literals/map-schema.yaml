passing:
  - name: map-schema-assign-typed
    language: Prefix
    source: |
        ! assign with typed ident + schema
        assign(map{<"count" = 0d0>} cnt, <"count" = 0d99>)
        assert(ismap(cnt))
        assert(eq(cnt<"count">, 0d99))
  - name: map-schema-basic
    language: Prefix
    source: |
        ! map{<"x" = 0d1>} with matching value
        map{<"x" = 0d1>} schema_var
        schema_var = <"x" = 0d42>
        assert(validate(schema_var, <"x" = 0d1>))
  - name: map-schema-empty-key
    language: Prefix
    source: |
        ! map with a schema having no keys
        map{<>} schema_var
        schema_var = <"anything" = 0d1>
        assert(ismap(schema_var))
  - name: map-schema-func-param
    language: Prefix
    source: |
        ! map schema in function parameter
        func map test(map{<"x" = 0d1>} m) {
            return(m)
        }
        map candidate = <"x" = 0d5>
        map result = test(candidate)
        assert(eq(result<"x">, 0d5))
  - name: map-schema-func-return
    language: Prefix
    source: |
        ! map schema return type
        func map{<"ok" = true>} make_ok() {
            return(<"ok" = true>)
        }
        map result = make_ok()
        assert(result<"ok">)
  - name: map-schema-match-builtin
    language: Prefix
    source: |
        ! validate() builtin with named map using "validate" metadata subkey
        ! The named map schema's "validate" subkey is ignored by env validation
        ! But validate() recognizes it for typing/shape/recurse control
        map{<"val" = 0d1, "y" = 0d2, "validate" = <"typing" = 0d1>>} var
        var = <"val" = 0d42, "y" = 0d99>
        
        ! validate with typing=1 should succeed (all value types match)
        assert(validate(var, <"validate" = <"typing" = 0d1>, "val" = 0d99, "y" = 0d88>))
        
        ! validate with typing=1 should fail (value types mismatch)
        refute(validate(var, <"validate" = <"typing" = 0d1>, "val" = "str", "y" = 0d88>))
        
        ! Named map variable without "validate" subkey, validate with typing=1
        map{<"a" = 0d1, "b" = "hi">} var2
        var2 = <"a" = 0d7, "b" = "world">
        assert(validate(var2, <"validate" = <"typing" = 0d1>, "a" = 0d9, "b" = "x">))
        refute(validate(var2, <"validate" = <"typing" = 0d1>, "a" = "wrong", "b" = "x">))
        
        ! Named map with explicit validate recurse
        map{<"outer" = <"inner" = 0d1>>} var3
        var3 = <"outer" = <"inner" = 0d42>>
        assert(validate(var3, <"validate" = <"recurse" = 0d1, "typing" = 0d1>, "outer" = <"inner" = 0d1>>))
        refute(validate(var3, <"validate" = <"recurse" = 0d1, "typing" = 0d1>, "outer" = <"inner" = "str">>))
        
        ! Named map with validate shape check
        map{<"t" = [0d1, 0d2]>} var4
        var4 = <"t" = [0d5, 0d6]>
        assert(validate(var4, <"validate" = <"shape" = 0d1>, "t" = [0d0, 0d0]>))
        refute(validate(var4, <"validate" = <"shape" = 0d1>, "t" = [0d0]>))
        
        ! Named map variable that has "match" as a regular key (not metadata)
        map{<"match" = "regular", "x" = 0d1>} var5
        var5 = <"match" = "regular", "x" = 0d99>
        assert(validate(var5, <"match" = "regular", "x" = 0d1>))
        
  - name: map-schema-match-invalid-metadata
    language: Prefix
    source: |
        ! validate() with "validate" subkey containing invalid metadata: unknown subkey
        ! This should return false because "badkey" is unknown in match metadata
        refute(validate(<"x" = 0d1>, <"validate" = <"badkey" = 0d1>>))
        
  - name: map-schema-match-key-allowed
    language: Prefix
    source: |
        ! Named map schema with "validate" subkey is allowed (value_map_matches ignores it)
        map{<"x" = 0d1, "validate" = <"typing" = 0d1>>} has_match
        has_match = <"x" = 0d99>
        assert(ismap(has_match))
        assert(eq(has_match<"x">, 0d99))
        
        ! Also verify with "shape" metadata subkey
        map{<"a" = "hello", "validate" = <"shape" = 0d1, "typing" = 0d1>>} has_shape
        has_shape = <"a" = "world">
        assert(eq(has_shape<"a">, "world"))
        
        ! Verify with "recurse" metadata subkey  
        map{<"b" = 0d1, "validate" = <"recurse" = 0d1, "typing" = 0d0>>} has_recurse
        has_recurse = <"b" = 0d42>
        assert(eq(has_recurse<"b">, 0d42))
        
        ! Verify empty "validate" metadata
        map{<"c" = 0d1, "validate" = <>>} has_empty_match
        has_empty_match = <"c" = 0d7>
        assert(eq(has_empty_match<"c">, 0d7))
        
        ! Verify "validate" key in nested schema
        map{<"nested" = <"validate" = <"typing" = 0d1>, "val" = 0d1>>} has_nested_match
        has_nested_match = <"nested" = <"val" = 0d5>>
        assert(eq(has_nested_match<"nested", "val">, 0d5))
        
  - name: map-schema-runtime-expr
    language: Prefix
    source: |
        ! Schema expression that evaluates to a map at declaration time
        map proto = <"a" = 0d1, "b" = 0d2>
        map{proto} shaped
        shaped = <"a" = 0d10, "b" = 0d20>
        assert(validate(shaped, proto))
  - name: map-schema-signature
    language: Prefix
    source: |
        ! signature of named map variable
        map{<"x" = 0d1>} var = <"x" = 0d42>
        assert(eq(signature(var), "map{<\"x\" = 0d1>} var"))
        
        ! signature of plain map variable (no schema)
        map plain = <"y" = 0d1>
        assert(eq(signature(plain), "map plain"))
        
        ! signature of empty-schema map variable
        map{<>} empty_s = <"anything" = 0d1>
        assert(eq(signature(empty_s), "map{<>} empty_s"))
        
        ! signature of function with map return schema
        func map{<"ok" = true>} fn_ret_s() {
            return(<"ok" = true>)
        }
        assert(eq(signature(fn_ret_s), "map{<\"ok\" = true>} fn_ret_s()"))
        
        ! signature of function with map param schema
        func map process(map{<"a" = 0d1>} input) {
            return(input)
        }
        assert(eq(signature(process), "map process(map{<\"a\" = 0d1>} input)"))
        
        ! signature of function with both return and param schemas
        func map{<"result" = 0d1>} full_s(map{<"key" = "val">} m) {
            return(<"result" = 0d1>)
        }
        assert(eq(signature(full_s), "map{<\"result\" = 0d1>} full_s(map{<\"key\" = \"val\">} m)"))
        
        ! signature of function with coerced param and schema
        func map full_coerce(~map{<"in" = 0d1>} m) {
            return(m)
        }
        assert(eq(signature(full_coerce), "map full_coerce(~map{<\"in\" = 0d1>} m)"))
        
failing:
  - name: map-schema-arg-mismatch
    language: Prefix
    source: |
        func map test(map{<"req" = 0d1>} m) {
            return(m)
        }
        test(<"nope" = 0d1>)
  - name: map-schema-empty-braces
    language: Prefix
    source: 'map{} empty'
  - name: map-schema-match-key-required
    language: Prefix
    source: |
        ! Named map schema with "match" key as a regular literal (not metadata map)
        ! When "match"'s value is a str (not a map), it's treated as a required key
        map{<"x" = 0d1, "match" = "literal">} has_literal_match
        ! This should pass: "match" = "literal" is a regular required key
        has_literal_match = <"x" = 0d42, "match" = "literal">
        assert(eq(has_literal_match<"x">, 0d42))
        assert(eq(has_literal_match<"match">, "literal"))
        
        ! Assignment missing the "match" literal key should fail
        map{<"y" = 0d1, "match" = "needed">} needs_match
        ! This should fail because "match" key is missing
        needs_match = <"y" = 0d99>
        
  - name: map-schema-mismatch
    language: Prefix
    source: |
        map{<"x" = 0d1>} var
        var = <"y" = 0d2>
  - name: map-schema-not-map-func-param
    language: Prefix
    source: |
        func map func_with_bad_param(map{0d1} p) { return(p); }
        func_with_bad_param(<>)
        
  - name: map-schema-not-map-func-return
    language: Prefix
    source: |
        func map{0d1} bad_func() { return(<>); }
        bad_func()
        
  - name: map-schema-not-map-lambda-param
    language: Prefix
    source: |
        map g = func map (map{0d1} p) { return(p); }
        g(<>)
        
  - name: map-schema-not-map-lambda-return
    language: Prefix
    source: |
        map f = func map{0d1} () { return(<>); }
        f()
        
  - name: map-schema-not-map
    language: Prefix
    source: 'map{0d1} bad'
  - name: map-schema-return-mismatch
    language: Prefix
    source: |
        func map{<"x" = 0d1>} bad_return() { return(<"y" = 0d2>); }
        bad_return()
        
