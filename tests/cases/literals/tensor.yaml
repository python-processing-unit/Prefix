passing:
  - name: tns-indexing
    language: Prefix
    source: |
        tensor vec = [0d1, 0d2, 0d3]
        tensor matrix = [[0d1, 0d2], [0d3, 0d4]]
        tensor cube = [[[0d1, 0d2], [0d3, 0d4]], [[0d5, 0d6], [0d7, 0d8]]]
        
        assert(eq(vec[0d1], 0d1))
        assert(eq(vec[0d3], 0d3))
        assert(eq(vec[-0d1], 0d3))
        assert(eq(vec[-0d3], 0d1))
        
        assert(eq(matrix[0d1, 0d2], 0d2))
        assert(eq(matrix[-0d1, -0d1], 0d4))
        assert(eq(matrix[0d2], [0d3, 0d4]))
        assert(eq(cube[0d2, 0d1], [0d5, 0d6]))
        assert(eq(cube[0d2, 0d2, 0d1], 0d7))
        assert(eq(cube[0d1], [[0d1, 0d2], [0d3, 0d4]]))
        assert(eq(cube[0d1, #], [[0d1, 0d2], [0d3, 0d4]]))
        
        assert(eq(vec[0d1:0d2], [0d1, 0d2]))
        assert(eq(vec[0d2:0d2], 0d2))
        assert(eq(vec[0d1:-0d1], [0d1, 0d2, 0d3]))
        assert(eq(vec[0d0:0d4], [0d1, 0d2, 0d3]))
        
        assert(eq(matrix[# , #], matrix))
        assert(eq(matrix[# , 0d1], [0d1, 0d3]))
        assert(eq(matrix[0d1, #], [0d1, 0d2]))
        assert(eq(matrix[0d1:0d2, 0d1:0d2], matrix))
        assert(eq(matrix[0d1:-0d1, 0d1], [0d1, 0d3]))
        assert(eq(cube[# , 0d2, 0d1], [0d3, 0d7]))
        
        int errors_caught = 0d0
        
        try {
            vec[0d4]
        } catch(err) {
            assert(eq(err, 'Index out of range'))
             +(@errors_caught, 0d1)
        }
        
        try {
            vec[true]
        } catch(err) {
            assert(eq(err, 'Index expression must evaluate to int'))
             +(@errors_caught, 0d1)
        }
        
        try {
            vec[true:0d1]
        } catch(err) {
            assert(eq(err, 'Range bounds must be int'))
             +(@errors_caught, 0d1)
        }
        
        try {
            0d1[0d1]
        } catch(err) {
            assert(eq(err, "Square-bracket indexing '[...]' is only allowed on tensor values"))
             +(@errors_caught, 0d1)
        }
        
        assert(eq(errors_caught, 0d4))
        
  - name: tns-literals-ifs
    language: Prefix
    source: |
        tensor zero_row = [0d0, 0d0]
        tensor row = [0d1, 0d2]
        
        if([false, 0d0, 0d0.0, "", zero_row]){
            assert(false)
        } else {
            assert(true)
        }
        
        if([false, 0d0, row]){
            assert(true)
        } else {
            assert(false)
        }
        
  - name: tns-literals-matrices
    language: Prefix
    source: |
        tensor matrix = [[0d1, 0d2], [0d3, 0d4]]
        tensor cube = [[[0d1], [0d2]], [[0d3], [0d4]]]
        
        assert(eq(matrix, [[0d1, 0d2], [0d3, 0d4]]))
        assert(eq(matrix[0d1, 0d2], 0d2))
        assert(eq(matrix[0d2], [0d3, 0d4]))
        assert(eq(cube[0d2, 0d1, 0d1], 0d3))
        
  - name: tns-literals-mixed
    language: Prefix
    source: |
        func int ID(int x){
            return(x)
        }
        
        map sample_map = <"n" = 0d5>
        tensor zero_row = [0d0, 0d0]
        tensor row = [0d1, 0d2]
        thread(worker){}
        
        tensor mixed = [true, 0d2, 0d3.5, "four", sample_map, ID, worker, row]
        
        assert(eq(mixed[0d1], true))
        assert(eq(mixed[0d2], 0d2))
        assert(eq(mixed[0d3], 0d3.5))
        assert(eq(mixed[0d4], "four"))
        assert(eq(mixed[0d5]<"n">, 0d5))
        assert(eq(mixed[0d6](0d9), 0d9))
        assert(eq(mixed[0d7], worker))
        assert(eq(mixed[0d8], row))
        
        assert(eq([row], [row]))
        assert(neq([row], [[0d1, 0d2]]))
        
