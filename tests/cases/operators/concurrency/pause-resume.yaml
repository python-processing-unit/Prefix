passing:
  - name: pause-async-deferred-arg
    language: Prefix
    source: |
        bool released = false
        
        thread paused = PAUSE(async{
            while(NOT(released)){}
        }, seconds = 0d0.05)
        
        ASSERT(EQ(TYPE(paused), "thread"))
        ASSERT(bool(paused))
        ASSERT(PAUSED(paused))
        
        released = true
        
        AWAIT(paused)
        
        REFUTE(bool(paused))
        REFUTE(PAUSED(paused))
        
  - name: pause-async-handle-autoresume
    language: Prefix
    source: |
        bool released = false
        
        thread worker = async{
            while(NOT(released)){}
        }
        
        thread paused = PAUSE(worker, seconds = 0d0.05)
        
        ASSERT(EQ(TYPE(paused), "thread"))
        ASSERT(EQ(paused, worker))
        ASSERT(bool(worker))
        ASSERT(PAUSED(worker))
        
        released = true
        
        AWAIT(worker)
        
        REFUTE(bool(worker))
        REFUTE(PAUSED(worker))
  - name: pause-explicit-negative-duration
    language: Prefix
    source: |
        bool released = false
        
        thread(worker){
            while(NOT(released)){}
        }
        
        thread paused = PAUSE(worker, seconds = -0d1.0)
        
        ASSERT(EQ(paused, worker))
        ASSERT(PAUSED(worker))
        
        released = true
        
        ASSERT(PAUSED(worker))
        
        AWAIT(RESUME(worker))
        
        REFUTE(bool(worker))
        REFUTE(PAUSED(worker))
  - name: pause-second-positional
    language: Prefix
    source: |
        thread(worker){}
        PAUSE(worker, 0d0.0)
        
  - name: pause-thread-handle
    language: Prefix
    source: |
        bool released = false
        
        thread(worker){
            while(NOT(released)){}
        }
        
        ASSERT(bool(worker))
        
        thread paused = PAUSE(worker)
        
        ASSERT(EQ(TYPE(paused), "thread"))
        ASSERT(EQ(paused, worker))
        ASSERT(bool(worker))
        ASSERT(PAUSED(worker))
        
        released = true
        
        ASSERT(PAUSED(worker))
        
        AWAIT(RESUME(worker))
        
        REFUTE(bool(worker))
        REFUTE(PAUSED(worker))
failing:
  - name: pause-already-paused
    language: Prefix
    source: |
        thread(worker){
            while(true){}
        }
        
        PAUSE(worker)
        PAUSE(worker)
        STOP(worker)
  - name: pause-arity-three
    language: Prefix
    source: |
        thread(worker){}
        PAUSE(worker, 0d0.0, 0d0.0)
  - name: pause-arity-zero
    language: Prefix
    source: PAUSE()
  - name: pause-second-bool
    language: Prefix
    source: |
        thread(worker){}
        PAUSE(worker, seconds = true)
  - name: pause-second-func
