passing:
  - name: pause-async-deferred-arg
    language: Prefix
    source: |
        bool released = false
        
        thread paused = pause(async{
            while(not(released)){}
        }, seconds = 0d0.05)
        
        assert(eq(type(paused), "thread"))
        assert(bool(paused))
        assert(paused(paused))
        
        released = true
        
        await(paused)
        
        refute(bool(paused))
        refute(paused(paused))
        
  - name: pause-async-handle-autoresume
    language: Prefix
    source: |
        bool released = false
        
        thread worker = async{
            while(not(released)){}
        }
        
        thread paused = pause(worker, seconds = 0d0.05)
        
        assert(eq(type(paused), "thread"))
        assert(eq(paused, worker))
        assert(bool(worker))
        assert(paused(worker))
        
        released = true
        
        await(worker)
        
        refute(bool(worker))
        refute(paused(worker))
  - name: pause-explicit-negative-duration
    language: Prefix
    source: |
        bool released = false
        
        thread(worker){
            while(not(released)){}
        }
        
        thread paused = pause(worker, seconds = -0d1.0)
        
        assert(eq(paused, worker))
        assert(paused(worker))
        
        released = true
        
        assert(paused(worker))
        
        await(resume(worker))
        
        refute(bool(worker))
        refute(paused(worker))
  - name: pause-second-positional
    language: Prefix
    source: |
        thread(worker){}
        pause(worker, 0d0.0)
        
  - name: pause-thread-handle
    language: Prefix
    source: |
        bool released = false
        
        thread(worker){
            while(not(released)){}
        }
        
        assert(bool(worker))
        
        thread paused = pause(worker)
        
        assert(eq(type(paused), "thread"))
        assert(eq(paused, worker))
        assert(bool(worker))
        assert(paused(worker))
        
        released = true
        
        assert(paused(worker))
        
        await(resume(worker))
        
        refute(bool(worker))
        refute(paused(worker))
