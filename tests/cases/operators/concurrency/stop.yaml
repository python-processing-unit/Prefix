passing:
  - name: stop-async-deferred-arg
    language: Prefix
    source: |
        bool reached_end = false
        
        thread stopped = stop(async{
            for(i, 0d100000){}
            reached_end = true
        })
        
        assert(eq(type(stopped), "thread"))
        refute(bool(stopped))
        assert(eq(reached_end, false))
        
  - name: stop-async-handle
    language: Prefix
    source: |
        bool reached_end = false
        
        thread worker = async{
            for(i, 0d100000){}
            reached_end = true
        }
        
        assert(bool(worker))
        
        thread stopped = stop(worker)
        
        assert(eq(type(stopped), "thread"))
        assert(eq(stopped, worker))
        refute(bool(worker))
        refute(bool(stopped))
        assert(eq(reached_end, false))
  - name: stop-thread-handle
    language: Prefix
    source: |
        bool reached_end = false
        
        thread(worker){
            for(i, 0d1000000){
            }
            reached_end = true
        }
        
        assert(bool(worker))
        
        thread stopped = stop(worker)
        
        assert(eq(type(stopped), "thread"))
        assert(eq(stopped, worker))
        refute(bool(worker))
        refute(bool(stopped))
        assert(eq(reached_end, false))
failing:
  - name: stop-arity-two
    language: Prefix
    source: |
        thread(worker){}
        
        stop(worker, worker)
  - name: stop-arity-zero
    language: Prefix
    source: stop()
  - name: stop-type-bool
    language: Prefix
    source: stop(true)
  - name: stop-type-flt
    language: Prefix
    source: stop(0d1.0)
  - name: stop-type-func
    language: Prefix
    source: 'stop(LAMBDA bool: (){})'
  - name: stop-type-int
    language: Prefix
    source: stop(0d1)
  - name: stop-type-map
    language: Prefix
    source: stop(<>)
  - name: stop-type-str
    language: Prefix
    source: stop("thread")
  - name: stop-type-tns
    language: Prefix
    source: stop([0d1])
