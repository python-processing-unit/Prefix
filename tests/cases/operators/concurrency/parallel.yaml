passing:
  - name: parallel-tensor-func-values
    language: Prefix
    source: |
        tensor seen = [false, false]
        
        func first = LAMBDA bool (){
            for(i, 0d500){}
            seen[0d1] = true
        }
        
        func second = LAMBDA bool (){
            for(i, 0d500){}
            seen[0d2] = true
        }
        
        tensor workers = [first, second]
        
        assert(eq(parallel(workers), false))
        assert(eq(seen, [true, true]))
  - name: parallel-tensor-literal
    language: Prefix
    source: |
        tensor seen = [false, false]
        
        func bool first(){
            for(i, 0d500){}
            seen[0d1] = true
        }
        
        func bool second(){
            for(i, 0d500){}
            seen[0d2] = true
        }
        
        assert(eq(parallel([first, second]), false))
        assert(eq(seen, [true, true]))
  - name: parallel-variadic
    language: Prefix
    source: |
        tensor seen = [false, false, false]
        
        func bool first(){
            for(i, 0d500){
            }
            seen[0d1] = true
        }
        
        func bool second(){
            for(i, 0d500){
            }
            seen[0d2] = true
        }
        
        func bool third(){
            for(i, 0d500){
            }
            seen[0d3] = true
        }
        
        assert(eq(parallel(first, second, third), false))
        assert(eq(seen, [true, true, true]))
failing:
  - name: parallel-arity-zero
    language: Prefix
    source: parallel()
  - name: parallel-non-func-arg
    language: Prefix
    source: parallel(true)
  - name: parallel-tensor-non-func
    language: Prefix
    source: |
        func bool worker(){}
        
        parallel([worker, 0d1])
  - name: parallel-worker-failure
    language: Prefix
    source: |
        func bool explode(){
            throw("boom")
        }
        
        parallel(explode)
  - name: parallel-worker-no-args
    language: Prefix
    source: |
        func bool requires_arg(int value){
            return(true)
        }
        
        parallel(requires_arg)
