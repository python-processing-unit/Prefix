passing:
  - name: restart-basic
    language: Prefix
    source: |
        bool finished = false
        
        thread worker = async{
            for(i, 0d1000){}
            finished = true
        }
        
        ! Wait for worker to finish
        await(worker)
        assert(eq(finished, true))
        
        ! Restart the finished thread
        thread r = restart(worker)
        assert(eq(type(r), "thread"))
        assert(eq(r, worker))
        assert(bool(r))
        
        ! After restart, the thread should run again and set finished
        await(r)
        assert(eq(finished, true))
        
failing:
  - name: restart-arity-two
    language: Prefix
    source: 'restart(async{}, async{})'
  - name: restart-arity-zero
    language: Prefix
    source: restart()
  - name: restart-bool
    language: Prefix
    source: restart(true)
  - name: restart-flt
    language: Prefix
    source: restart(0d1.0)
  - name: restart-func
    language: Prefix
    source: 'restart(LAMBDA bool: (){})'
  - name: restart-int
    language: Prefix
    source: restart(0d1)
  - name: restart-map
    language: Prefix
    source: restart(<>)
  - name: restart-running
    language: Prefix
    source: |
        thread worker = async{
            for(i, 0d100000){}
        }
        
        restart(worker)
        
  - name: restart-str
    language: Prefix
    source: restart("thread")
  - name: restart-tns
    language: Prefix
    source: restart([0d1])
