passing:
  - name: await-expression-handle
    language: Prefix
    source: |
        thread worker = async{}
        thread awaited = AWAIT(worker)
        
        ASSERT(EQ(TYPE(awaited), "thread"))
        ASSERT(EQ(awaited, worker))
        REFUTE(bool(awaited))
  - name: await-finished-thread
    language: Prefix
    source: |
        thread(worker){}
        
        AWAIT(worker)
        
        ASSERT(EQ(AWAIT(worker), worker))
        REFUTE(bool(worker))
  - name: await-shared-mutation
    language: Prefix
    source: |
        int shared = 0d0
        
        thread(worker){
            for(i, 0d256){
            }
            shared = 0d1
        }
        
        thread awaited = AWAIT(worker)
        
        ASSERT(EQ(awaited, worker))
        ASSERT(EQ(shared, 0d1))
        REFUTE(bool(worker))
failing:
  - name: await-arity-two
    language: Prefix
    source: |
        thread(worker){}
        AWAIT(worker, worker)
  - name: await-arity-zero
    language: Prefix
    source: AWAIT()
  - name: await-type-bool
    language: Prefix
    source: AWAIT(TRUE)
  - name: await-type-flt
    language: Prefix
    source: AWAIT(0d1.0)
  - name: await-type-func
    language: Prefix
    source: 'AWAIT(LAMBDA bool: (){})'
  - name: await-type-int
    language: Prefix
    source: AWAIT(0d1)
  - name: await-type-map
    language: Prefix
    source: AWAIT(<>)
  - name: await-type-str
    language: Prefix
    source: AWAIT("thread")
  - name: await-type-tns
    language: Prefix
    source: AWAIT([0d1])
