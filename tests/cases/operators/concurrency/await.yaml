passing:
  - name: await-expression-handle
    language: Prefix
    source: |
        thread worker = async{}
        thread awaited = await(worker)
        
        assert(eq(type(awaited), "thread"))
        assert(eq(awaited, worker))
        refute(bool(awaited))
  - name: await-finished-thread
    language: Prefix
    source: |
        thread(worker){}
        
        await(worker)
        
        assert(eq(await(worker), worker))
        refute(bool(worker))
  - name: await-shared-mutation
    language: Prefix
    source: |
        int shared = 0d0
        
        thread(worker){
            for(i, 0d256){
            }
            shared = 0d1
        }
        
        thread awaited = await(worker)
        
        assert(eq(awaited, worker))
        assert(eq(shared, 0d1))
        refute(bool(worker))
failing:
  - name: await-arity-two
    language: Prefix
    source: |
        thread(worker){}
        await(worker, worker)
  - name: await-arity-zero
    language: Prefix
    source: await()
  - name: await-type-bool
    language: Prefix
    source: await(true)
  - name: await-type-flt
    language: Prefix
    source: await(0d1.0)
  - name: await-type-func
    language: Prefix
    source: 'await(LAMBDA bool: (){})'
  - name: await-type-int
    language: Prefix
    source: await(0d1)
  - name: await-type-map
    language: Prefix
    source: await(<>)
  - name: await-type-str
    language: Prefix
    source: await("thread")
  - name: await-type-tns
    language: Prefix
    source: await([0d1])
