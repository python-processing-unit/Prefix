passing:
  - name: round
    language: Prefix
    source: |
        ! round coverage based on the specification
        
        float r_half = 0b0.101
        assert(eq(round(r_half), 0b0.0))
        assert(eq(round(r_half, mode = "floor", ndigits = 0b10), 0b0.10))
        assert(eq(round(r_half, ndigits = 0b10), 0b0.10))
        assert(eq(round(r_half, mode = "ceiling", ndigits = 0b10), 0b0.11))
        assert(eq(round(r_half, mode = "ceil", ndigits = 0b10), 0b0.11))
        assert(eq(round(r_half, mode = "zero", ndigits = 0b10), 0b0.10))
        assert(eq(round(r_half, mode = "logical", ndigits = 0b10), 0b0.11))
        assert(eq(round(r_half, mode = "half-up", ndigits = 0b10), 0b0.11))
        assert(eq(round(0b0.101, 0b10), 0b0.10))
        
        float rn_half = -0b0.101
        assert(eq(round(rn_half, ndigits = 0b10), -0b0.11))
        assert(eq(round(rn_half, mode = "zero", ndigits = 0b10), -0b0.10))
        assert(eq(round(rn_half, mode = "logical", ndigits = 0b10), -0b0.11))
        
        float three = 0b11.0
        assert(eq(round(three, ndigits = -0b1), 0b10.0))
        assert(eq(round(three, mode = "logical", ndigits = -0b1), 0b100.0))
        assert(eq(round(three, -0b1), 0b10.0))
        
        float neg_three = -0b11.0
        assert(eq(round(neg_three, ndigits = -0b1), -0b100.0))
        assert(eq(round(neg_three, mode = "zero", ndigits = -0b1), -0b10.0))
        assert(eq(round(neg_three, mode = "logical", ndigits = -0b1), -0b100.0))
failing:
  - name: round-invalid-mode
    language: Prefix
    source: 'round(0b0.101, mode = "nearest", ndigits = 0b10)'
  - name: round-ndigits-not-int
