passing:
  - name: bytes
    language: Prefix
    source: |
        assert(eq(type(bytes(0d0)), "tensor"))
        assert(eq(bytes(0d0), [0d0]))
        
        ! Default endian is "big"
        assert(eq(bytes(0x1234), bytes(0x1234, endian = "big")))
        
        ! Least-significant-byte placement checks (robust regardless of leading zero bytes)
        assert(eq(mod(0x123456, 0d256), bytes(0x123456, endian = "big")[-0d1]))
        assert(eq(mod(0x123456, 0d256), bytes(0x123456, endian = "little")[0d1]))
        
        ! All elements must be bytes (0..0xFF)
        assert(gte(min(bytes(0x123456, endian = "big")), 0d0))
        assert(lte(max(bytes(0x123456, endian = "big")), 0d255))
        assert(gte(min(bytes(0x123456, endian = "little")), 0d0))
        assert(lte(max(bytes(0x123456, endian = "little")), 0d255))
        
        ! Elements must be int
        assert(eq(type(bytes(0x1234)[0d1]), "int"))
        
