passing:
  - name: copy-bool
    language: Prefix
    source: 'assert(eq(copy(true), true))'
  - name: copy-flt
    language: Prefix
    source: 'assert(eq(copy(0d1.5), 0d1.5))'
  - name: copy-from-pointer
    language: Prefix
    source: |
        map source = <"plain" = 0d2, "nested" = <"value" = 0d3>>
        map copied = copy(@source)
        
        copied<"plain"> = 0d9
        assert(eq(source<"plain">, 0d2))
        
        copied<"nested", "value"> = 0d8
        assert(eq(source<"nested", "value">, 0d8))
  - name: copy-func
    language: Prefix
    source: |
        func int identity(int value){
            return(value)
        }
        
        func func_copy = copy(identity)
        
        assert(eq(func_copy, identity))
        assert(eq(func_copy(0d7), 0d7))
  - name: copy-int
    language: Prefix
    source: 'assert(eq(copy(0xA), 0xA))'
  - name: copy-map
    language: Prefix
    source: |
        map map_value = <"n" = 0d3>
        
        assert(eq(copy(map_value), map_value))
  - name: copy-str
    language: Prefix
    source: 'assert(eq(copy("prefix"), "prefix"))'
  - name: copy-thr
    language: Prefix
    source: |
        thread(worker){}
        
        thread thread_copy = copy(worker)
        
        assert(eq(thread_copy, worker))
  - name: copy-tns
    language: Prefix
    source: |
        tensor tensor = [0d1, 0d2]
        
        assert(eq(copy(tensor), tensor))
  - name: deepcopy-bool
    language: Prefix
    source: 'assert(eq(deep_copy(true), true))'
  - name: deepcopy-flt
    language: Prefix
    source: 'assert(eq(deep_copy(0d1.5), 0d1.5))'
  - name: deepcopy-from-pointer
    language: Prefix
    source: |
        map source = <"plain" = 0d2, "nested" = <"value" = 0d3>>
        map copied = deep_copy(@source)
        
        copied<"plain"> = 0d9
        copied<"nested", "value"> = 0d8
        
        assert(eq(source<"plain">, 0d2))
        assert(eq(source<"nested", "value">, 0d3))
  - name: deepcopy-func
    language: Prefix
    source: |
        func int identity(int value){
            return(value)
        }
        
        func func_copy = deep_copy(identity)
        
        assert(eq(func_copy, identity))
        assert(eq(func_copy(0d7), 0d7))
  - name: deepcopy-int
    language: Prefix
    source: 'assert(eq(deep_copy(0xA), 0xA))'
  - name: deepcopy-map
    language: Prefix
    source: |
        map map_value = <"n" = 0d3>
        
        assert(eq(deep_copy(map_value), map_value))
  - name: deepcopy-str
    language: Prefix
    source: 'assert(eq(deep_copy("prefix"), "prefix"))'
  - name: deepcopy-thr
    language: Prefix
    source: |
        thread(worker){}
        
        thread thread_copy = deep_copy(worker)
        
        assert(eq(thread_copy, worker))
  - name: deepcopy-tns
    language: Prefix
    source: |
        tensor tensor = [0d1, 0d2]
        
        assert(eq(deep_copy(tensor), tensor))
failing:
  - name: copy-arity-two
    language: Prefix
    source: 'copy(0d1, 0d2)'
  - name: copy-arity-zero
    language: Prefix
    source: copy()
  - name: deepcopy-arity-two
    language: Prefix
    source: 'deep_copy(0d1, 0d2)'
  - name: deepcopy-arity-zero
    language: Prefix
    source: deep_copy()
