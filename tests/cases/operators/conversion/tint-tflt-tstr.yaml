passing:
  - name: tflt
    language: Prefix
    source: |
        TNS source = [[TRUE, FALSE, 0d7, -0b11, 0d1.75, -0d1.75], ["0d2.5", "-0d3.25", "0d0.5", "INF", "-INF", "NaN"]]
        TNS converted = TFLT(source)
        ASSERT(EQ(TYPE(converted), "TNS"))
        ASSERT(EQ(converted[0d1], [0d1.0, 0d0.0, 0d7.0, -0d3.0, 0d1.75, -0d1.75]))
        ASSERT(EQ(converted[0d2, 0d1], 0d2.5))
        ASSERT(EQ(converted[0d2, 0d2], -0d3.25))
        ASSERT(EQ(converted[0d2, 0d3], 0d0.5))
        ASSERT(EQ(converted[0d2, 0d4], INF))
        ASSERT(EQ(converted[0d2, 0d5], -INF))
        ASSERT(NEQ(converted[0d2, 0d6], converted[0d2, 0d6]))
  - name: tint
    language: Prefix
    source: |
        TNS source = [[TRUE, FALSE, 0d7, -0b11, 0d1.75, -0d1.75], ["0x1A", "-0d9", "", "prefix", "0b101", "0d0"]]
        TNS converted = TINT(source)
        ASSERT(EQ(TYPE(converted), "TNS"))
        ASSERT(EQ(converted, [[0d1, 0d0, 0d7, -0d3, 0d1, -0d1], [0d26, -0d9, 0d0, 0d1, 0d5, 0d0]]))
  - name: tstr
    language: Prefix
    source: |
        TNS source = [[TRUE, FALSE, 0b101, -0d7, 0d1.5, -0d1.5], ["prefix", "", INF, -INF, NaN, 0x1A]]
        TNS converted = TSTR(source)
        ASSERT(EQ(TYPE(converted), "TNS"))
        ASSERT(EQ(converted, [["TRUE", "FALSE", "0b101", "-0d7", "0d1.5", "-0d1.5"], ["prefix", "", "INF", "-INF", "NaN", "0x1A"]]))
failing:
  - name: tconvert-pointer-writeback
    language: Prefix
    source: |
        // These tests expect builtins like TINT/TFLT/TSTR to write back to pointer operands.
        TNS t1 = [0d1.5, 0d2.9]
        TINT(@t1)
        ASSERT(EQ(t1, [0d1, 0d2]))
        
        TNS t2 = [0d1, 0d2]
        TFLT(@t2)
        ASSERT(EQ(t2, [0d1.0, 0d2.0]))
        
        TNS t3 = [0d1, 0d2]
        TSTR(@t3)
        ASSERT(EQ(t3, ["0d1", "0d2"]))
        
  - name: tflt-bad-str
    language: Prefix
    source: 'TFLT([0d1, "prefix"])'
  - name: tflt-map
    language: Prefix
    source: |
        MAP bad = <>
        TFLT([0d1, bad])
  - name: tint-map
    language: Prefix
    source: |
        MAP bad = <>
        TINT([0d1, bad])
  - name: tstr-map
    language: Prefix
    source: |
        MAP bad = <>
        TSTR([TRUE, bad])
