passing:
  - name: base-flt
    language: Prefix
    source: |
        float flt_decimal = 0d1.5
        float flt_binary = 0b1.1
        
        assert(eq(BASE(flt_decimal), 0d10))
        assert(eq(BASE(flt_binary), 0d2))
        assert(eq(switch_base(flt_binary, BASE(flt_decimal)), flt_decimal))
        assert(eq(BASE(switch_base(flt_decimal, 0d64)), 0d64))
        
  - name: base-int
    language: Prefix
    source: |
        int int_binary = 0b101010
        int int_hex = 0x2A
        
        assert(eq(BASE(int_binary), 0d2))
        assert(eq(BASE(int_hex), 0d16))
        assert(eq(switch_base(int_binary, BASE(int_hex)), int_hex))
        assert(eq(BASE(switch_base(int_hex, 0d64)), 0d64))
        
  - name: convert-flt
    language: Prefix
    source: |
        float flt_value = 0d1.5
        
        assert(eq(switch_base(flt_value, 0b10), 0b1.1))
        assert(eq(BASE(switch_base(flt_value, 0b10)), 0d2))
        assert(eq(switch_base(flt_value, 0x10), 0x1.8))
        assert(eq(BASE(switch_base(flt_value, 0x10)), 0d16))
        assert(eq(BASE(switch_base(flt_value, 0d64)), 0d64))
        
  - name: convert-int
    language: Prefix
    source: |
        int int_value = 0d42
        
        assert(eq(switch_base(int_value, 0x10), 0x2A))
        assert(eq(BASE(switch_base(int_value, 0x10)), 0d16))
        assert(eq(switch_base(int_value, 0d2), 0b101010))
        assert(eq(BASE(switch_base(int_value, 0d2)), 0d2))
        assert(eq(BASE(switch_base(int_value, 0d64)), 0d64))
        
failing:
