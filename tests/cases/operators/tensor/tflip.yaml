passing:
  - name: tflip-rank1
    language: Prefix
    source: |
        tensor v = [0d1, 0d2, 0d3, 0d4]
        
        assert(eq(type(flip_dim(v, 0d1)), "tensor"))
        assert(eq(flip_dim(v, 0d1), [0d4, 0d3, 0d2, 0d1]))
        assert(eq(v, [0d1, 0d2, 0d3, 0d4]))
        
  - name: tflip-rank2-dim1
    language: Prefix
    source: |
        tensor m = [[0d1, 0d2, 0d3], [0d4, 0d5, 0d6]]
        tensor flipped = flip_dim(m, 0d1)
        
        assert(eq(flipped, [[0d4, 0d5, 0d6], [0d1, 0d2, 0d3]]))
        assert(eq(shape(flipped), [0d2, 0d3]))
        
  - name: tflip-rank2-dim2
    language: Prefix
    source: |
        tensor m = [[0d1, 0d2, 0d3], [0d4, 0d5, 0d6]]
        
        assert(eq(flip_dim(m, 0d2), [[0d3, 0d2, 0d1], [0d6, 0d5, 0d4]]))
        
  - name: tflip-rank3-dim3
    language: Prefix
    source: |
        tensor cube = [[[0d1, 0d2], [0d3, 0d4]], [[0d5, 0d6], [0d7, 0d8]]]
        
        assert(eq(flip_dim(cube, 0d3), [[[0d2, 0d1], [0d4, 0d3]], [[0d6, 0d5], [0d8, 0d7]]]))
        
failing:
