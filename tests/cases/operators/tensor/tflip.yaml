passing:
  - name: tflip-rank1
    language: Prefix
    source: |
        tensor v = [0d1, 0d2, 0d3, 0d4]
        
        ASSERT(EQ(TYPE(TFLIP(v, 0d1)), "tensor"))
        ASSERT(EQ(TFLIP(v, 0d1), [0d4, 0d3, 0d2, 0d1]))
        ASSERT(EQ(v, [0d1, 0d2, 0d3, 0d4]))
        
  - name: tflip-rank2-dim1
    language: Prefix
    source: |
        tensor m = [[0d1, 0d2, 0d3], [0d4, 0d5, 0d6]]
        tensor flipped = TFLIP(m, 0d1)
        
        ASSERT(EQ(flipped, [[0d4, 0d5, 0d6], [0d1, 0d2, 0d3]]))
        ASSERT(EQ(SHAPE(flipped), [0d2, 0d3]))
        
  - name: tflip-rank2-dim2
    language: Prefix
    source: |
        tensor m = [[0d1, 0d2, 0d3], [0d4, 0d5, 0d6]]
        
        ASSERT(EQ(TFLIP(m, 0d2), [[0d3, 0d2, 0d1], [0d6, 0d5, 0d4]]))
        
  - name: tflip-rank3-dim3
    language: Prefix
    source: |
        tensor cube = [[[0d1, 0d2], [0d3, 0d4]], [[0d5, 0d6], [0d7, 0d8]]]
        
        ASSERT(EQ(TFLIP(cube, 0d3), [[[0d2, 0d1], [0d4, 0d3]], [[0d6, 0d5], [0d8, 0d7]]]))
        
