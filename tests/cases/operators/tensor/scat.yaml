passing:
  - name: scat-1d-basic
    language: Prefix
    source: |
        tensor src = [0d9, 0d8]
        tensor dst = [0d1, 0d2, 0d3, 0d4]
        tensor out = scatter(src, dst, [[0d2, 0d3]])
        
        assert(eq(type(out), "tensor"))
        assert(eq(out, [0d1, 0d9, 0d8, 0d4]))
        assert(eq(dst, [0d1, 0d2, 0d3, 0d4]))
        
  - name: scat-2d-rect
    language: Prefix
    source: |
        tensor src = [[0d7, 0d8], [0d9, 0d10]]
        tensor dst = [[0d1, 0d2, 0d3], [0d4, 0d5, 0d6], [0d11, 0d12, 0d13]]
        tensor out = scatter(src, dst, [[0d2, 0d3], [0d1, 0d2]])
        
        assert(eq(out, [[0d1, 0d2, 0d3], [0d7, 0d8, 0d6], [0d9, 0d10, 0d13]]))
        assert(eq(shape(out), [0d3, 0d3]))
        
  - name: scat-3d-rect
    language: Prefix
    source: |
        tensor src = [[[0d99, 0d98]], [[0d97, 0d96]]]
        tensor dst = [[[0d1, 0d2], [0d3, 0d4]], [[0d5, 0d6], [0d7, 0d8]]]
        tensor out = scatter(src, dst, [[0d1, 0d2], [0d2, 0d2], [0d1, 0d2]])
        
        assert(eq(out, [[[0d1, 0d2], [0d99, 0d98]], [[0d5, 0d6], [0d97, 0d96]]]))
        
  - name: scat-inclusive-singleton
    language: Prefix
    source: |
        tensor out = scatter([0d55], [0d10, 0d20, 0d30], [[0d3, 0d3]])
        
        assert(eq(out, [0d10, 0d20, 0d55]))
        
failing:
  - name: scat-arity-four
    language: Prefix
    source: |
        scatter([0d1], [0d2], [[0d1, 0d1]], [0d3])
        
  - name: scat-arity-two
    language: Prefix
    source: |
        scatter([0d1], [0d2])
        
  - name: scat-arity-zero
    language: Prefix
    source: |
        scatter()
        
  - name: scat-first-non-tns
    language: Prefix
    source: |
        scatter(0d1, [0d1, 0d2], [[0d1, 0d1]])
        
  - name: scat-ind-dim-count-mismatch
    language: Prefix
    source: |
        scatter([[0d9]], [[0d1, 0d2], [0d3, 0d4]], [[0d1, 0d1]])
        
  - name: scat-ind-pair-malformed
    language: Prefix
    source: |
        scatter([0d9], [0d1, 0d2], [[0d1]])
        
  - name: scat-out-of-range-high
    language: Prefix
    source: |
        scatter([0d9], [0d1, 0d2, 0d3], [[0d3, 0d4]])
        
  - name: scat-out-of-range-low
    language: Prefix
    source: |
        scatter([0d9], [0d1, 0d2, 0d3], [[0d0, 0d1]])
        
  - name: scat-pointer-writeback
    language: Prefix
    source: |
        // scatter should write back to destination pointer operands.
        tensor dst1 = [0d1, 0d2, 0d3]
        tensor src1 = [0d9]
        tensor ind1 = [[0d2, 0d2]]
        scatter(@dst1, src1, ind1)
        assert(eq(dst1, [0d1, 0d9, 0d3]))
        
  - name: scat-second-non-tns
    language: Prefix
    source: |
        scatter([0d1], 0d2, [[0d1, 0d1]])
        
  - name: scat-shape-mismatch
    language: Prefix
    source: |
        scatter([0d9], [0d1, 0d2, 0d3], [[0d1, 0d2]])
        
  - name: scat-third-non-tns
    language: Prefix
    source: |
        scatter([0d1], [0d1, 0d2], 0d1)
        
