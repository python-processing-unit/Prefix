passing:
  - name: madd-basic
    language: Prefix
    source: |
        tensor out = M+([0d1, 0d2, 0d3], [0d4, 0d5, 0d6])
        
        ASSERT(EQ(TYPE(out), "tensor"))
        ASSERT(EQ(out, [0d5, 0d7, 0d9]))
        
  - name: madd-rank2-shape
    language: Prefix
    source: |
        tensor a = [[0d1, 0d2], [0d3, 0d4]]
        tensor b = [[0d10, 0d20], [0d30, 0d40]]
        tensor out = M+(a, b)
        
        ASSERT(EQ(out, [[0d11, 0d22], [0d33, 0d44]]))
        ASSERT(EQ(SHAPE(out), [0d2, 0d2]))
        
  - name: mdiv-basic
    language: Prefix
    source: |
        ASSERT(EQ(M/([0d8, 0d6, 0d4], [0d2, 0d3, 0d2]), [0d4, 0d2, 0d2]))
        
  - name: mdiv-rank2
    language: Prefix
    source: |
        tensor out = M/([[0d9, 0d8], [0d6, 0d4]], [[0d3, 0d2], [0d3, 0d2]])
        
        ASSERT(EQ(out, [[0d3, 0d4], [0d2, 0d2]]))
        ASSERT(EQ(SHAPE(out), [0d2, 0d2]))
        
  - name: mmul-basic
    language: Prefix
    source: |
        ASSERT(EQ(M*([0d1, 0d2, 0d3], [0d4, 0d5, 0d6]), [0d4, 0d10, 0d18]))
        
  - name: mmul-rank2-shape
    language: Prefix
    source: |
        tensor a = [[0d1, 0d2], [0d3, 0d4]]
        tensor b = [[0d5, 0d6], [0d7, 0d8]]
        tensor out = M*(a, b)
        
        ASSERT(EQ(out, [[0d5, 0d12], [0d21, 0d32]]))
        ASSERT(EQ(SHAPE(out), [0d2, 0d2]))
        
  - name: msub-basic
    language: Prefix
    source: |
        tensor out = M-([0d9, 0d7, 0d5], [0d4, 0d5, 0d6])
        
        ASSERT(EQ(TYPE(out), "tensor"))
        ASSERT(EQ(out, [0d5, 0d2, -0d1]))
