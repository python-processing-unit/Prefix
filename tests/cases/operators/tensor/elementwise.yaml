  - name: mops-pointer-writeback
    language: Prefix
    source: |
        // m* family (matrix/tensor ops) should write back to pointer operands.
        tensor A1 = [0d1, 0d2]
        tensor B1 = [0d3, 0d4]
        m+(@A1, B1)
        assert(eq(A1, [0d4, 0d6]))
        
        tensor A2 = [0d1, 0d2]
        tensor B2 = [0d3, 0d4]
        m+(A2, @B2)
        assert(eq(B2, [0d4, 0d6]))
        
        // MSUM / MPROD behavior: elementwise -> writeback
        tensor C1 = [0d2, 0d3]
        MSUM(@C1)
        assert(eq(C1, [0d5]))
        
