  - name: tensor-elemwise-pointer-writeback
    language: Prefix
    source: |
        // Elementwise tensor ops should write back to pointer operands when provided.
        tensor a1 = [0d1, 0d2]
        tensor b1 = [0d3, 0d4]
        T+(@a1, b1)
        ASSERT(EQ(a1, [0d4, 0d6]))
        
        tensor a2 = [0d1, 0d2]
        tensor b2 = [0d3, 0d4]
        T+(a2, @b2)
        ASSERT(EQ(b2, [0d4, 0d6]))
        
        // similar for T*
        tensor c1 = [0d2, 0d3]
        tensor d1 = [0d4, 0d5]
        T*(@c1, d1)
        ASSERT(EQ(c1, [0d8, 0d15]))
        
