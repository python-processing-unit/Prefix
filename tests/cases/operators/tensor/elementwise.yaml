    language: Prefix
    source: 'ASSERT(EQ(M-([0d5.5, 0d3.0], [0d1.0, 0d0.5]), [0d4.5, 0d2.5]))'
  - name: msub-rank2-shape
    language: Prefix
    source: |
        tensor a = [[0d9, 0d8], [0d7, 0d6]]
        tensor b = [[0d1, 0d2], [0d3, 0d4]]
        tensor out = M-(a, b)
        
        ASSERT(EQ(out, [[0d8, 0d6], [0d4, 0d2]]))
        ASSERT(EQ(SHAPE(out), [0d2, 0d2]))
