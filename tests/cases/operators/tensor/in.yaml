passing:
  - name: in-basic-false
    language: Prefix
    source: |
        refute(in(0d9, [0d1, 0d2, 0d3]))
        
  - name: in-basic-true
    language: Prefix
    source: |
        assert(in(0d2, [0d1, 0d2, 0d3]))
        
  - name: in-rank2
    language: Prefix
    source: |
        tensor grid = [[0d1, 0d2], [0d3, 0d4]]
        
        assert(in(0d4, grid))
        refute(in(0d9, grid))
        
  - name: in-return-type
    language: Prefix
    source: |
        assert(eq(type(in(0d1, [0d1])), "bool"))
        
  - name: in-strings-bools
    language: Prefix
    source: |
        assert(in("beta", ["alpha", "beta", "gamma"]))
        assert(in(false, [true, false]))
        
failing:
  - name: in-arity-one
    language: Prefix
    source: |
        in(0d1)
        
  - name: in-arity-three
    language: Prefix
    source: |
        in(0d1, [0d1], 0d2)
        
  - name: in-arity-zero
    language: Prefix
    source: |
        in()
        
  - name: in-second-non-tns-int
    language: Prefix
    source: |
        in(0d1, 0d2)
        
  - name: in-second-non-tns-str
    language: Prefix
    source: |
        in(0d1, "not-a-tensor")
        
