passing:
  - name: conv-extended-basic
    language: Prefix
    source: |
        tensor x = [[[0d1], [0d2], [0d3]], [[0d4], [0d5], [0d6]]]
        tensor kernel = [[[[0d1, 0d2]]]]
        tensor out = convolve(x, kernel, stride_w = 0d1)
        
        assert(eq(shape(out), [0d2, 0d3, 0d2]))
        assert(eq(out, [[[0d1, 0d2], [0d2, 0d4], [0d3, 0d6]], [[0d4, 0d8], [0d5, 0d10], [0d6, 0d12]]]))
  - name: conv-extended-bias
    language: Prefix
    source: |
        tensor x = [[[0d3]]]
        tensor kernel = [[[[0d2, 0d3]]]]
        tensor out = convolve(x, kernel, bias = [0d10, 0d20])
        
        assert(eq(shape(out), [0d1, 0d1, 0d2]))
        assert(eq(out, [[[0d16, 0d29]]]))
  - name: conv-extended-flt-output-type
    language: Prefix
    source: |
        tensor x = [[[0d2.0]]]
        tensor kernel = [[[[0d1.5]]]]
        tensor out = convolve(x, kernel, stride_w = 0d1)
        
        assert(eq(out, [[[0d3.0]]]))
        assert(eq(type(out[0d1, 0d1, 0d1]), "float"))
  - name: conv-legacy-1d-clamp
    language: Prefix
    source: |
        tensor x = [0d1, 0d2, 0d3]
        tensor k = [0d1, 0d1, 0d1]
        tensor out = convolve(x, k)
        
        assert(eq(type(out), "tensor"))
        assert(eq(shape(out), [0d3]))
        assert(eq(out, [0d4, 0d6, 0d8]))
  - name: conv-legacy-flt-output-type
    language: Prefix
    source: |
        tensor out = convolve([0d2.0], [0d1.0])
        
        assert(eq(out, [0d2.0]))
        assert(eq(type(out[0d1]), "float"))
  - name: conv-legacy-int-output-type
    language: Prefix
    source: |
        tensor out = convolve([0d7], [0d1])
        
        assert(eq(out, [0d7]))
        assert(eq(type(out[0d1]), "int"))
  - name: conv-legacy-rank2-shape
    language: Prefix
    source: |
        tensor x = [[0d1, 0d2], [0d3, 0d4]]
        tensor k = [[0d0, 0d0, 0d0], [0d0, 0d1, 0d0], [0d0, 0d0, 0d0]]
        tensor out = convolve(x, k)
        
        assert(eq(shape(out), [0d2, 0d2]))
        assert(eq(out, x))
