  - name: conv-first-non-tns
    language: Prefix
    source: 'convolve(0d1, [0d1])'
  - name: conv-legacy-even-kernel
    language: Prefix
    source: 'convolve([0d1, 0d2, 0d3], [0d1, 0d1])'
  - name: conv-legacy-rank-mismatch
    language: Prefix
    source: 'convolve([0d1, 0d2], [[0d1, 0d1, 0d1]])'
  - name: conv-pointer-writeback
    language: Prefix
    source: |
        // convolve should write back to pointer operands when passed.
        tensor x1 = [0d1, 0d2, 0d3]
        tensor k1 = [0d1, 0d0, 0d1]
        convolve(@x1, k1)
        assert(eq(x1, [0d3, 0d4, 0d5]))
        
        tensor x2 = [0d1, 0d2, 0d3]
        tensor k2 = [0d1, 0d0, 0d1]
        convolve(x2, @k2)
        assert(eq(k2, [0d3, 0d4, 0d5]))
        
        tensor x3 = [0d1, 0d2, 0d3]
        tensor k3 = [0d1, 0d0, 0d1]
        convolve(@x3, @k3)
        assert(eq(x3, [0d3, 0d4, 0d5]))
        assert(eq(k3, [0d3, 0d4, 0d5]))
        
  - name: conv-second-non-tns
    language: Prefix
    source: 'convolve([0d1], 0d1)'
