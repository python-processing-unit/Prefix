passing:
  - name: mprod-single
    language: Prefix
    source: |
        tensor x = [[0d2, 0d3], [0d4, 0d5]]
        
        assert(eq(MPROD(x), x))
        
  - name: mprod-three
    language: Prefix
    source: |
        assert(eq(MPROD([0d2, 0d3], [0d4, 0d5], [0d6, 0d7]), [0d48, 0d105]))
        
  - name: mprod-two
    language: Prefix
    source: |
        assert(eq(MPROD([0d2, 0d3], [0d4, 0d5]), [0d8, 0d15]))
        
  - name: msum-single
    language: Prefix
    source: |
        tensor x = [[0d1, 0d2], [0d3, 0d4]]
        
        assert(eq(MSUM(x), x))
        
  - name: msum-three
    language: Prefix
    source: |
        assert(eq(MSUM([0d1, 0d2], [0d3, 0d4], [0d5, 0d6]), [0d9, 0d12]))
        
  - name: msum-two
    language: Prefix
    source: |
        assert(eq(MSUM([0d1, 0d2], [0d3, 0d4]), [0d4, 0d6]))
        
failing:
  - name: mprod-arity-zero
    language: Prefix
    source: |
        MPROD()
        
  - name: mprod-non-numeric
    language: Prefix
    source: |
        MPROD(["a"], ["b"])
        
  - name: mprod-non-tns-arg
    language: Prefix
    source: |
        MPROD([0d1], 0d2)
        
