passing:
  - name: append-any-element
    language: Prefix
    source: |
        map m = <"k" = 0d1>
        tensor nested = [0d5, 0d6]
        
        ASSERT(EQ(APPEND(m, [0d1]), [0d1, m]))
        ASSERT(EQ(APPEND(nested, [0d1]), [0d1, nested]))
        
  - name: append-basic
    language: Prefix
    source: |
        tensor base = [0d1, 0d2]
        tensor out = APPEND(0d3, base)
        
        ASSERT(EQ(TYPE(out), "tensor"))
        ASSERT(EQ(out, [0d1, 0d2, 0d3]))
        
  - name: append-end-order
    language: Prefix
    source: |
        ASSERT(EQ(APPEND("z", ["a", "b"]), ["a", "b", "z"]))
        ASSERT(EQ(APPEND(0d9, [0d7]), [0d7, 0d9]))
        
  - name: append-pointer-writeback
    language: Prefix
    source: |
        tensor t1 = [0d1, 0d2]
        APPEND(0d3, @t1)
        ASSERT(EQ(t1, [0d1, 0d2, 0d3]))
        
        tensor t2 = ["a", "b"]
        APPEND("c", @t2)
        ASSERT(EQ(t2, ["a", "b", "c"]))
        
  - name: append-source-unchanged
    language: Prefix
    source: |
        tensor src = [0d10, 0d20]
        tensor out = APPEND(0d30, src)
        
        ASSERT(EQ(src, [0d10, 0d20]))
        ASSERT(EQ(out, [0d10, 0d20, 0d30]))
        
failing:
  - name: append-arity-one
    language: Prefix
    source: |
        APPEND(0d1)
        
  - name: append-arity-three
    language: Prefix
    source: |
        APPEND(0d1, [0d2], 0d3)
        
  - name: append-arity-zero
    language: Prefix
    source: |
        APPEND()
        
  - name: append-second-non-tns
    language: Prefix
    source: |
        APPEND(0d1, 0d2)
        
  - name: append-second-not-1d
    language: Prefix
    source: |
        APPEND(0d9, [[0d1], [0d2]])
        
