passing:
  - name: shape-rank-1
    language: Prefix
    source: |
        tensor v = [0d10, 0d20, 0d30, 0d40]
        
        assert(eq(type(shape(v)), "tensor"))
        assert(eq(shape(v), [0d4]))
        
  - name: shape-rank-2
    language: Prefix
    source: |
        tensor m = [[0d1, 0d2, 0d3], [0d4, 0d5, 0d6]]
        
        assert(eq(shape(m), [0d2, 0d3]))
        
  - name: shape-rank-3
    language: Prefix
    source: |
        tensor cube = [[[0d1, 0d2]], [[0d3, 0d4]], [[0d5, 0d6]]]
        
        assert(eq(shape(cube), [0d3, 0d1, 0d2]))
        
  - name: shape-result-is-1d
    language: Prefix
    source: |
        tensor t = [[[0d1], [0d2], [0d3]], [[0d4], [0d5], [0d6]]]
        tensor dims = shape(t)
        
        assert(eq(type(dims), "tensor"))
        assert(eq(len_dim(dims, 0d1), 0d3))
        assert(eq(dims[0d1], 0d2))
        assert(eq(dims[0d2], 0d3))
        assert(eq(dims[0d3], 0d1))
        
  - name: tlen
    language: Prefix
    source: |
        tensor tensor = [[[0d1, 0d2, 0d3]], [[0d4, 0d5, 0d6]]]
        
        assert(eq(len_dim(tensor, 0b1), 0d2))
        assert(eq(len_dim(tensor, 0b10), 0d1))
        assert(eq(len_dim(tensor, 0b11), 0d3))
        assert(eq(BASE(len_dim(tensor, 0b11)), 0d2))
