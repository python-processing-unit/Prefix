passing:
  - name: fill-basic
    language: Prefix
    source: |
        tensor src = [0d1, 0d2, 0d3]
        
        assert(eq(type(fill(src, 0d9)), "tensor"))
        assert(eq(fill(src, 0d9), [0d9, 0d9, 0d9]))
  - name: fill-bool-elements
    language: Prefix
    source: |
        tensor flags = [true, false, true]
        
        assert(eq(fill(flags, false), [false, false, false]))
  - name: fill-rank2-shape
    language: Prefix
    source: |
        tensor src = [[0d1, 0d2], [0d3, 0d4]]
        tensor out = fill(src, 0d0)
        
        assert(eq(out, [[0d0, 0d0], [0d0, 0d0]]))
        assert(eq(shape(out), [0d2, 0d2]))
  - name: fill-source-unchanged
    language: Prefix
    source: |
        tensor src = [0d10, 0d20]
        tensor out = fill(src, 0d99)
        
        assert(eq(src, [0d10, 0d20]))
        assert(eq(out, [0d99, 0d99]))
  - name: fill-string-elements
    language: Prefix
    source: |
        tensor words = ["alpha", "beta", "gamma"]
        
        assert(eq(fill(words, "z"), ["z", "z", "z"]))
failing:
  - name: fill-arity-one
    language: Prefix
    source: 'fill([0d1, 0d2])'
  - name: fill-arity-three
    language: Prefix
    source: 'fill([0d1], 0d2, 0d3)'
  - name: fill-arity-zero
    language: Prefix
    source: fill()
  - name: fill-first-non-tns
    language: Prefix
    source: 'fill(0d1, 0d2)'
  - name: fill-tflip-pointer-writeback
    language: Prefix
    source: |
        // fill / flip_dim writeback expectations
        tensor dst1 = [0d0, 0d0, 0d0]
        fill(@dst1, 0d7)
        assert(eq(dst1, [0d7, 0d7, 0d7]))
        
        tensor a1 = [[0d1, 0d2], [0d3, 0d4]]
        flip_dim(@a1)
        assert(eq(a1, [[0d1, 0d3], [0d2, 0d4]]))
        
  - name: fill-value-type-mismatch-int-tensor
    language: Prefix
    source: 'fill([0d1, 0d2, 0d3], "x")'
  - name: fill-value-type-mismatch-str-tensor
    language: Prefix
    source: 'fill(["a", "b"], 0d1)'
