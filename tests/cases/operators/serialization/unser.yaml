  - name: unser-func-closure
    language: Prefix
    source: |
        str loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        str json = join( ^
            '\R{"t":"func","id":"f1","name":"read_alias","return":"int","params":[],"def":{"name":"read_alias","return":"int","params":[],"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"alias"}}]},"closure":{"t":"ENV","id":"e1","def":{"values":{"seed":{"t":"int","v":"0d9"},"alias":{"t":"PTR","name":"seed","env":{"t":"ENV","id":"e1","ref":true},"value_type":"int"}},"declared":{"seed":"int","alias":"int"},"frozen":[],"permafrozen":[],"parent":null}}}}' ^
        )
        
        func reader = unserialize(json)
        assert(eq(type(reader), "func"))
        assert(eq(reader(), 0d9))
  - name: unser-func-params
    language: Prefix
    source: |
        str loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        str step_default = join( ^
            '\R{"n":"Literal","loc":', ^
            loc, ^
            '\R,"value":2,"base":10,"literal_type":"int"}' ^
        )
        
        str params = join( ^
            '\R[{"name":"value","type":"int","coerced":true,"default":null},{"name":"step","type":"int","coerced":false,"default":', ^
            step_default, ^
            '\R}]' ^
        )
        
        str json = join( ^
            '\R{"t":"func","id":"f1","name":"add_default","return":"int","params":', ^
            params, ^
            '\R,"def":{"name":"add_default","return":"int","params":', ^
            params, ^
            '\R,"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"CallExpression","loc":', ^
            loc, ^
            '\R,"callee":{"n":"Identifier","loc":', ^
            loc, ^
                '\R,"name":"+"},"args":[{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"value"}},{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"step"}}]}}]},"closure":null}}' ^
        )
        
        func add_default = unserialize(json)
        assert(eq(add_default("0d3"), 0d5))
        assert(eq(add_default("0d3", step = 0d4), 0d7))
  - name: unser-func-ref
    language: Prefix
    source: |
        str loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        str full = join( ^
            '\R{"t":"func","id":"f1","name":"five","return":"int","params":[],"def":{"name":"five","return":"int","params":[],"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"Literal","loc":', ^
            loc, ^
            '\R,"value":5,"base":10,"literal_type":"int"}}]},"closure":null}}' ^
        )
        
        str json = join( ^
            '\R{"t":"map","v":[{"k":{"t":"str","v":"first"},"v":', ^
            full, ^
            '\R},{"k":{"t":"str","v":"second"},"v":{"t":"func","id":"f1","ref":true}}]}' ^
        )
        
        map funcs = unserialize(json)
        assert(eq(funcs<"first">, funcs<"second">))
        assert(eq(funcs<"first">(), 0d5))
        assert(eq(funcs<"second">(), 0d5))
  - name: unser-func
    language: Prefix
    source: |
        str loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        str json = join( ^
            '\R{"t":"func","id":"f1","name":"double","return":"int","params":[{"name":"value","type":"int","coerced":false,"default":null}],"def":{"name":"double","return":"int","params":[{"name":"value","type":"int","coerced":false,"default":null}],"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"CallExpression","loc":', ^
            loc, ^
            '\R,"callee":{"n":"Identifier","loc":', ^
            loc, ^
                '\R,"name":"+"},"args":[{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"value"}},{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"value"}}]}}]},"closure":null}}' ^
        )
        
        func double = unserialize(json)
        assert(eq(type(double), "func"))
        assert(eq(double(0d3), 0d6))
  - name: unser-map
    language: Prefix
    source: |
        map value = unserialize('\R{"t":"map","v":[{"k":{"t":"str","v":"alpha"},"v":{"t":"int","v":"0d1"}},{"k":{"t":"int","v":"0d2"},"v":{"t":"str","v":"two"}},{"k":{"t":"float","v":"0d3.5"},"v":{"t":"map","v":[{"k":{"t":"str","v":"nested"},"v":{"t":"bool","v":true}}]}}]}')
        
        assert(eq(value<"alpha">, 0d1))
        assert(eq(value<0d2>, "two"))
        assert(eq(value<0d3.5, "nested">, true))
        assert(eq(keys(value), ["alpha", 0d2, 0d3.5]))
  - name: unser-scalars
    language: Prefix
    source: |
        assert(eq(unserialize('\R{"t":"bool","v":true}'), true))
        
        str spaced_false = join("\n  ", '\R{"t":"bool","v":false}', "\r\t")
        assert(eq(unserialize(spaced_false), false))
        
        assert(eq(unserialize('\R{"t":"int","v":"-0xA"}'), -0xA))
        assert(eq(unserialize('\R{"t":"float","v":"0d3.5"}'), 0d3.5))
        assert(eq(str(unserialize('\R{"t":"float","v":"NaN"}')), "NaN"))
        assert(eq(unserialize('\R{"t":"str","v":"Prefix\n"}'), "Prefix\n"))
        assert(eq(unserialize('\R{"t":"str","v":"\u00E9"}'), "\u00E9"))
  - name: unser-tensor
    language: Prefix
    source: |
        tensor tensor = unserialize('\R{"t":"tensor","shape":[2,2],"v":[{"t":"int","v":"0d1"},{"t":"int","v":"0d2"},{"t":"int","v":"0d3"},{"t":"int","v":"0d4"}]}')
        
        assert(eq(tensor, [[0d1, 0d2], [0d3, 0d4]]))
        assert(eq(shape(tensor), [0d2, 0d2]))
        
        tensor mixed = unserialize('\R{"t":"tensor","shape":[3],"v":[{"t":"bool","v":true},{"t":"str","v":"two"},{"t":"float","v":"0d3.5"}]}')
        assert(eq(mixed, [true, "two", 0d3.5]))
  - name: unser-thr-ref
    language: Prefix
    source: |
        str thread_json = '\R{"t":"thread","id":"t1","state":"finished","paused":false,"finished":true,"stop":false,"env":null,"block":null}'
        
        str json = join( ^
            '\R{"t":"map","v":[{"k":{"t":"str","v":"first"},"v":', ^
            thread_json, ^
            '\R},{"k":{"t":"str","v":"second"},"v":', ^
            thread_json, ^
            '\R}]}' ^
        )
        
        map threads = unserialize(json)
        assert(eq(threads<"first">, threads<"second">))
        refute(bool(threads<"first">))
  - name: unser-thr
    language: Prefix
    source: |
        thread finished = unserialize('\R{"t":"thread","id":"t1","state":"finished","paused":false,"finished":true,"stop":false,"env":null,"block":null}')
        
        assert(eq(type(finished), "thread"))
        refute(bool(finished))
        assert(eq(await(finished), finished))
        
        thread paused = unserialize('\R{"t":"thread","id":"t2","state":"paused","paused":true,"finished":false,"stop":false,"env":null,"block":null}')
        assert(paused(paused))
        assert(bool(paused))
