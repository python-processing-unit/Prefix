  - name: unser-errors-structure
    language: Prefix
    source: |
        int errors = 0d0
        
        try{
            unserialize('\R{"t":"tensor","shape":[0],"v":[]}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"tensor","shape":[2,2],"v":[{"t":"int","v":"0d1"},{"t":"int","v":"0d2"},{"t":"int","v":"0d3"}]}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"map","v":[{"k":{"t":"tensor","shape":[1],"v":[{"t":"int","v":"0d1"}]},"v":{"t":"int","v":"0d2"}}]}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"map","v":[{"k":{"t":"str","v":"x"}}]}')
        } catch(err){
            +(@errors, 0d1)
        }
        
