passing:
  - name: unser-errors-json
    language: Prefix
    source: |
        int errors = 0d0
        
        try{
            unserialize("{")
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"v":true}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"bool"}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"NOPE","v":0}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        assert(eq(errors, 0d4))
