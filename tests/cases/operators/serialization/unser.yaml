        try{
            unserialize('\R{"t":"int","v":"12"}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"float","v":"0d1"}')
        } catch(err){
            +(@errors, 0d1)
        }
        
        try{
            unserialize('\R{"t":"float","v":"-NaN"}')
        } catch(err){
            +(@errors, 0d1)
        }
        
