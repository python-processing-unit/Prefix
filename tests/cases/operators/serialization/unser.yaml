    source: unserialize()
  - name: unser-type-bool
    language: Prefix
    source: unserialize(true)
  - name: unser-type-flt
    language: Prefix
    source: unserialize(0d1.0)
  - name: unser-type-func
    language: Prefix
    source: |
        func int identity(int value){
            return(value)
        }
        
        unserialize(identity)
  - name: unser-type-int
    language: Prefix
    source: unserialize(0d1)
  - name: unser-type-map
    language: Prefix
    source: 'unserialize(<"n" = 0d1>)'
  - name: unser-type-thr
    language: Prefix
    source: |
        thread(worker){}
        
        unserialize(worker)
  - name: unser-type-tns
    language: Prefix
    source: unserialize([0d1])
