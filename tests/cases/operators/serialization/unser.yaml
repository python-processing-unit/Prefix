passing:
  - name: unser-errors-json
    language: Prefix
    source: |
        INT errors = 0d0
        
        TRY{
            UNSER("{")
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"v":true}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"BOOL"}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"NOPE","v":0}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        ASSERT(EQ(errors, 0d4))
  - name: unser-errors-numeric
    language: Prefix
    source: |
        INT errors = 0d0
        
        TRY{
            UNSER('\R{"t":"INT","v":"12"}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"FLT","v":"0d1"}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"FLT","v":"-NaN"}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        ASSERT(EQ(errors, 0d3))
  - name: unser-errors-structure
    language: Prefix
    source: |
        INT errors = 0d0
        
        TRY{
            UNSER('\R{"t":"TNS","shape":[0],"v":[]}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"TNS","shape":[2,2],"v":[{"t":"INT","v":"0d1"},{"t":"INT","v":"0d2"},{"t":"INT","v":"0d3"}]}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"MAP","v":[{"k":{"t":"TNS","shape":[1],"v":[{"t":"INT","v":"0d1"}]},"v":{"t":"INT","v":"0d2"}}]}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        TRY{
            UNSER('\R{"t":"MAP","v":[{"k":{"t":"STR","v":"x"}}]}')
        } CATCH(err){
            +(@errors, 0d1)
        }
        
        ASSERT(EQ(errors, 0d4))
  - name: unser-func-closure
    language: Prefix
    source: |
        STR loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        STR json = JOIN( ^
            '\R{"t":"FUNC","id":"f1","name":"read_alias","return":"INT","params":[],"def":{"name":"read_alias","return":"INT","params":[],"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"alias"}}]},"closure":{"t":"ENV","id":"e1","def":{"values":{"seed":{"t":"INT","v":"0d9"},"alias":{"t":"PTR","name":"seed","env":{"t":"ENV","id":"e1","ref":true},"value_type":"INT"}},"declared":{"seed":"INT","alias":"INT"},"frozen":[],"permafrozen":[],"parent":null}}}}' ^
        )
        
        FUNC reader = UNSER(json)
        ASSERT(EQ(TYPE(reader), "FUNC"))
        ASSERT(EQ(reader(), 0d9))
  - name: unser-func-params
    language: Prefix
    source: |
        STR loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        STR step_default = JOIN( ^
            '\R{"n":"Literal","loc":', ^
            loc, ^
            '\R,"value":2,"base":10,"literal_type":"INT"}' ^
        )
        
        STR params = JOIN( ^
            '\R[{"name":"value","type":"INT","coerced":true,"default":null},{"name":"step","type":"INT","coerced":false,"default":', ^
            step_default, ^
            '\R}]' ^
        )
        
        STR json = JOIN( ^
            '\R{"t":"FUNC","id":"f1","name":"add_default","return":"INT","params":', ^
            params, ^
            '\R,"def":{"name":"add_default","return":"INT","params":', ^
            params, ^
            '\R,"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"CallExpression","loc":', ^
            loc, ^
            '\R,"callee":{"n":"Identifier","loc":', ^
            loc, ^
                '\R,"name":"+"},"args":[{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"value"}},{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"step"}}]}}]},"closure":null}}' ^
        )
        
        FUNC add_default = UNSER(json)
        ASSERT(EQ(add_default("0d3"), 0d5))
        ASSERT(EQ(add_default("0d3", step = 0d4), 0d7))
  - name: unser-func-ref
    language: Prefix
    source: |
        STR loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        STR full = JOIN( ^
            '\R{"t":"FUNC","id":"f1","name":"five","return":"INT","params":[],"def":{"name":"five","return":"INT","params":[],"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"Literal","loc":', ^
            loc, ^
            '\R,"value":5,"base":10,"literal_type":"INT"}}]},"closure":null}}' ^
        )
        
        STR json = JOIN( ^
            '\R{"t":"MAP","v":[{"k":{"t":"STR","v":"first"},"v":', ^
            full, ^
            '\R},{"k":{"t":"STR","v":"second"},"v":{"t":"FUNC","id":"f1","ref":true}}]}' ^
        )
        
        MAP funcs = UNSER(json)
        ASSERT(EQ(funcs<"first">, funcs<"second">))
        ASSERT(EQ(funcs<"first">(), 0d5))
        ASSERT(EQ(funcs<"second">(), 0d5))
  - name: unser-func
    language: Prefix
    source: |
        STR loc = '\R{"file":"<unknown>","line":1,"column":1,"statement":""}'
        
        STR json = JOIN( ^
            '\R{"t":"FUNC","id":"f1","name":"double","return":"INT","params":[{"name":"value","type":"INT","coerced":false,"default":null}],"def":{"name":"double","return":"INT","params":[{"name":"value","type":"INT","coerced":false,"default":null}],"body":{"n":"Block","loc":', ^
            loc, ^
            '\R,"statements":[{"n":"ReturnStatement","loc":', ^
            loc, ^
            '\R,"expression":{"n":"CallExpression","loc":', ^
            loc, ^
            '\R,"callee":{"n":"Identifier","loc":', ^
            loc, ^
                '\R,"name":"+"},"args":[{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"value"}},{"n":"CallArgument","name":null,"expression":{"n":"Identifier","loc":', ^
            loc, ^
            '\R,"name":"value"}}]}}]},"closure":null}}' ^
        )
        
        FUNC double = UNSER(json)
        ASSERT(EQ(TYPE(double), "FUNC"))
        ASSERT(EQ(double(0d3), 0d6))
  - name: unser-map
    language: Prefix
    source: |
        MAP value = UNSER('\R{"t":"MAP","v":[{"k":{"t":"STR","v":"alpha"},"v":{"t":"INT","v":"0d1"}},{"k":{"t":"INT","v":"0d2"},"v":{"t":"STR","v":"two"}},{"k":{"t":"FLT","v":"0d3.5"},"v":{"t":"MAP","v":[{"k":{"t":"STR","v":"nested"},"v":{"t":"BOOL","v":true}}]}}]}')
        
        ASSERT(EQ(value<"alpha">, 0d1))
        ASSERT(EQ(value<0d2>, "two"))
        ASSERT(EQ(value<0d3.5, "nested">, TRUE))
        ASSERT(EQ(KEYS(value), ["alpha", 0d2, 0d3.5]))
  - name: unser-scalars
    language: Prefix
    source: |
        ASSERT(EQ(UNSER('\R{"t":"BOOL","v":true}'), TRUE))
        
        STR spaced_false = JOIN("\n  ", '\R{"t":"BOOL","v":false}', "\r\t")
        ASSERT(EQ(UNSER(spaced_false), FALSE))
        
        ASSERT(EQ(UNSER('\R{"t":"INT","v":"-0xA"}'), -0xA))
        ASSERT(EQ(UNSER('\R{"t":"FLT","v":"0d3.5"}'), 0d3.5))
        ASSERT(EQ(STR(UNSER('\R{"t":"FLT","v":"NaN"}')), "NaN"))
        ASSERT(EQ(UNSER('\R{"t":"STR","v":"Prefix\n"}'), "Prefix\n"))
        ASSERT(EQ(UNSER('\R{"t":"STR","v":"\u00E9"}'), "\u00E9"))
  - name: unser-tensor
    language: Prefix
    source: |
        TNS tensor = UNSER('\R{"t":"TNS","shape":[2,2],"v":[{"t":"INT","v":"0d1"},{"t":"INT","v":"0d2"},{"t":"INT","v":"0d3"},{"t":"INT","v":"0d4"}]}')
        
        ASSERT(EQ(tensor, [[0d1, 0d2], [0d3, 0d4]]))
        ASSERT(EQ(SHAPE(tensor), [0d2, 0d2]))
        
        TNS mixed = UNSER('\R{"t":"TNS","shape":[3],"v":[{"t":"BOOL","v":true},{"t":"STR","v":"two"},{"t":"FLT","v":"0d3.5"}]}')
        ASSERT(EQ(mixed, [TRUE, "two", 0d3.5]))
  - name: unser-thr-ref
    language: Prefix
    source: |
        STR thread_json = '\R{"t":"THR","id":"t1","state":"finished","paused":false,"finished":true,"stop":false,"env":null,"block":null}'
        
        STR json = JOIN( ^
            '\R{"t":"MAP","v":[{"k":{"t":"STR","v":"first"},"v":', ^
            thread_json, ^
            '\R},{"k":{"t":"STR","v":"second"},"v":', ^
            thread_json, ^
            '\R}]}' ^
        )
        
        MAP threads = UNSER(json)
        ASSERT(EQ(threads<"first">, threads<"second">))
        REFUTE(BOOL(threads<"first">))
  - name: unser-thr
    language: Prefix
    source: |
        THR finished = UNSER('\R{"t":"THR","id":"t1","state":"finished","paused":false,"finished":true,"stop":false,"env":null,"block":null}')
        
        ASSERT(EQ(TYPE(finished), "THR"))
        REFUTE(BOOL(finished))
        ASSERT(EQ(AWAIT(finished), finished))
        
        THR paused = UNSER('\R{"t":"THR","id":"t2","state":"paused","paused":true,"finished":false,"stop":false,"env":null,"block":null}')
        ASSERT(PAUSED(paused))
        ASSERT(BOOL(paused))
failing:
  - name: unser-arity-two
    language: Prefix
    source: 'UNSER("{}", "{}")'
  - name: unser-arity-zero
    language: Prefix
    source: UNSER()
  - name: unser-type-bool
    language: Prefix
    source: UNSER(TRUE)
  - name: unser-type-flt
    language: Prefix
    source: UNSER(0d1.0)
  - name: unser-type-func
    language: Prefix
    source: |
        FUNC INT identity(INT value){
            RETURN(value)
        }
        
        UNSER(identity)
  - name: unser-type-int
    language: Prefix
    source: UNSER(0d1)
  - name: unser-type-map
    language: Prefix
    source: 'UNSER(<"n" = 0d1>)'
  - name: unser-type-thr
    language: Prefix
    source: |
        THR(worker){}
        
        UNSER(worker)
  - name: unser-type-tns
    language: Prefix
    source: UNSER([0d1])
