passing:
  - name: ser-func-ref
    language: Prefix
    source: |
        FUNC BOOL contains(STR haystack, STR needle){
            RETURN(GT(TLEN(SPLIT(haystack, needle), 0d1), 0d1))
        }
        
        FUNC INT occurrences(STR haystack, STR needle){
            RETURN(-(TLEN(SPLIT(haystack, needle), 0d1), 0d1))
        }
        
        FUNC INT identity(INT value){
            RETURN(value)
        }
        
        MAP shared = <"first" = identity, "second" = identity>
        STR json = SER(shared)
        
        ASSERT(contains(json, '\R"t":"FUNC"'))
        ASSERT(contains(json, '\R"name":"identity"'))
        ASSERT(GT(occurrences(json, '\R"def":{'), 0d0))
        ASSERT(contains(json, '\R"ref":true'))
        
        MAP roundtrip = UNSER(SER(shared))
        ASSERT(EQ(roundtrip<"first">(0d4), 0d4))
        ASSERT(EQ(roundtrip<"second">(0d5), 0d5))
  - name: ser-func
    language: Prefix
    source: |
        FUNC BOOL contains(STR haystack, STR needle){
            RETURN(GT(TLEN(SPLIT(haystack, needle), 0d1), 0d1))
        }
        
        INT seed = 0d9
        INT alias = @seed
        
        FUNC INT add_seed(~INT count, INT step = 0d1){
            RETURN(+(alias, +(count, step)))
        }
        
        STR json = SER(add_seed)
        
        ASSERT(contains(json, '\R"t":"FUNC"'))
        ASSERT(contains(json, '\R"name":"add_seed"'))
        ASSERT(contains(json, '\R"return":"INT"'))
        ASSERT(contains(json, '\R"coerced":true'))
        ASSERT(contains(json, '\R"default":{"n":"Literal"'))
        ASSERT(contains(json, '\R"closure":{"t":"ENV"'))
        ASSERT(contains(json, '\R"t":"PTR"'))
        ASSERT(contains(json, '\R"name":"seed"'))
        ASSERT(contains(json, '\R"value_type":"INT"'))
        ASSERT(contains(json, '\R"n":"ReturnStatement"'))
        ASSERT(contains(json, '\R"n":"CallExpression"'))
  - name: ser-map
    language: Prefix
    source: |
        MAP ordered = <"alpha" = 0d1, 0d2 = "two", 0d3.5 = TRUE>
        
        ASSERT(EQ(SER(ordered), '\R{"t":"MAP","v":[{"k":{"t":"STR","v":"alpha"},"v":{"t":"INT","v":"0d1"}},{"k":{"t":"INT","v":"0d2"},"v":{"t":"STR","v":"two"}},{"k":{"t":"FLT","v":"0d3.5"},"v":{"t":"BOOL","v":true}}]}'))
        
        MAP nested = <"outer" = <"inner" = [0d1, 0d2]>>
        ASSERT(EQ(UNSER(SER(nested)), nested))
        ASSERT(EQ(KEYS(UNSER(SER(ordered))), ["alpha", 0d2, 0d3.5]))
  - name: ser-scalars
    language: Prefix
    source: |
        ASSERT(EQ(SER(TRUE), '{"t":"BOOL","v":true}'))
        ASSERT(EQ(SER(FALSE), '{"t":"BOOL","v":false}'))
        
        ASSERT(EQ(SER(0d42), '{"t":"INT","v":"0d42"}'))
        ASSERT(EQ(SER(-0xA), '{"t":"INT","v":"-0xA"}'))
        
        ASSERT(EQ(SER(0d3.5), '{"t":"FLT","v":"0d3.5"}'))
        ASSERT(EQ(SER(-INF), '{"t":"FLT","v":"-INF"}'))
        ASSERT(EQ(SER(NaN), '{"t":"FLT","v":"NaN"}'))
        
        ASSERT(EQ(UNSER(SER(0x2A)), 0x2A))
        ASSERT(EQ(STR(UNSER(SER(NaN))), "NaN"))
  - name: ser-strings
    language: Prefix
    source: |
        ASSERT(EQ(SER("Prefix"), '{"t":"STR","v":"Prefix"}'))
        
        STR escaped = "\"\\\b\f\n\r\t"
        ASSERT(EQ(SER(escaped), '\R{"t":"STR","v":"\"\\\b\f\n\r\t"}'))
        
        ASSERT(EQ(SER("\x01"), '\R{"t":"STR","v":"\u0001"}'))
        
        STR unicode_json = SER("\u00E9")
        ASSERT(OR(EQ(unicode_json, '\R{"t":"STR","v":"\u00E9"}'), EQ(unicode_json, '\R{"t":"STR","v":"\u00e9"}')))
        ASSERT(EQ(UNSER(unicode_json), "\u00E9"))
  - name: ser-tensor
    language: Prefix
    source: |
        ASSERT(EQ(SER([0d1, 0d2]), '\R{"t":"TNS","shape":[2],"v":[{"t":"INT","v":"0d1"},{"t":"INT","v":"0d2"}]}'))
        
        TNS square = [[0d1, 0d2], [0d3, 0d4]]
        ASSERT(EQ(SER(square), '\R{"t":"TNS","shape":[2,2],"v":[{"t":"INT","v":"0d1"},{"t":"INT","v":"0d2"},{"t":"INT","v":"0d3"},{"t":"INT","v":"0d4"}]}'))
        ASSERT(EQ(UNSER(SER(square)), square))
  - name: ser-thr
    language: Prefix
    source: |
        FUNC BOOL contains(STR haystack, STR needle){
            RETURN(GT(TLEN(SPLIT(haystack, needle), 0d1), 0d1))
        }
        
        FUNC INT occurrences(STR haystack, STR needle){
            RETURN(-(TLEN(SPLIT(haystack, needle), 0d1), 0d1))
        }
        
        THR(worker){}
        AWAIT(worker)
        
        STR json = SER(worker)
        
        ASSERT(contains(json, '\R"t":"THR"'))
        ASSERT(contains(json, '\R"id":"t1"'))
        ASSERT(contains(json, '\R"state":"finished"'))
        ASSERT(contains(json, '\R"paused":false'))
        ASSERT(contains(json, '\R"finished":true'))
        ASSERT(contains(json, '\R"stop":false'))
        ASSERT(contains(json, '\R"env":'))
        ASSERT(contains(json, '\R"block":{"n":"Block"'))
        
        MAP shared = <"first" = worker, "second" = worker>
        STR shared_json = SER(shared)
        ASSERT(EQ(occurrences(shared_json, '\R"id":"t1"'), 0d2))
