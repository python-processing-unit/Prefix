passing:
  - name: throw-concat-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            throw("left=", 0d42, ",right=", -0b10)
        } catch(err) {
            caught = true
            print(err) ! debug
            assert(eq(err, "left=0d42,right=-0b10"))
        }
        
        assert(caught)
  - name: throw-control-transfer
    language: Prefix
    source: |
        int step = 0d0
        
        try{
            step = 0d1
            throw('stop')
            step = +(step, 0d1)
        } catch {
            step = +(step, 0d10)
        }
        
        assert(eq(step, 0d11))
  - name: throw-default-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            throw()
        } catch(err) {
            caught = true
            assert(eq(err, 'Exception thrown'))
        }
        
        assert(caught)
  - name: throw-empty-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            throw('')
        } catch(err) {
            caught = true
            assert(eq(err, 'Exception thrown'))
            assert(eq(slen(err), 0d16))
        }
        
        assert(caught)
  - name: throw-string-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            throw('prefix')
        } catch(err) {
            caught = true
            assert(eq(err, 'prefix'))
        }
        
        assert(caught)
failing:
  - name: throw-uncaught-default
    language: Prefix
    source: throw()
  - name: throw-uncaught-message
    language: Prefix
    source: 'throw(''prefix'', 0d42)'
