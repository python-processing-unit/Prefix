passing:
  - name: throw-concat-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            THROW("left=", 0d42, ",right=", -0b10)
        } catch(err) {
            caught = true
            PRINT(err) ! debug
            ASSERT(EQ(err, "left=0d42,right=-0b10"))
        }
        
        ASSERT(caught)
  - name: throw-control-transfer
    language: Prefix
    source: |
        int step = 0d0
        
        try{
            step = 0d1
            THROW('stop')
            step = +(step, 0d1)
        } catch {
            step = +(step, 0d10)
        }
        
        ASSERT(EQ(step, 0d11))
  - name: throw-default-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            THROW()
        } catch(err) {
            caught = true
            ASSERT(EQ(err, 'Exception thrown'))
        }
        
        ASSERT(caught)
  - name: throw-empty-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            THROW('')
        } catch(err) {
            caught = true
            ASSERT(EQ(err, 'Exception thrown'))
            ASSERT(EQ(SLEN(err), 0d16))
        }
        
        ASSERT(caught)
  - name: throw-string-message
    language: Prefix
    source: |
        bool caught = false
        
        try{
            THROW('prefix')
        } catch(err) {
            caught = true
            ASSERT(EQ(err, 'prefix'))
        }
        
        ASSERT(caught)
failing:
  - name: throw-uncaught-default
    language: Prefix
    source: THROW()
  - name: throw-uncaught-message
    language: Prefix
    source: 'THROW(''prefix'', 0d42)'
