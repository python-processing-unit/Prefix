passing:
  - name: assert
    language: Prefix
    source: |
        assert(true)
        
  - name: refute
    language: Prefix
    source: |
        refute(false)
        refute(0d0)
        refute(0d0.0)
        refute("")
        
failing:
  - name: assert-false
    language: Prefix
    source: |
        assert(false)
        
  - name: refute-true
    language: Prefix
    source: |
        refute(true)
        
