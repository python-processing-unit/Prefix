passing:
  - name: assert
    language: Prefix
    source: |
        ASSERT(true)
        
  - name: refute
    language: Prefix
    source: |
        REFUTE(false)
        REFUTE(0d0)
        REFUTE(0d0.0)
        REFUTE("")
        
failing:
  - name: assert-false
    language: Prefix
    source: |
        ASSERT(false)
        
  - name: refute-true
    language: Prefix
    source: |
        REFUTE(true)
        
