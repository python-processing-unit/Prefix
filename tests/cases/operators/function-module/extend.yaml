  - name: extend-cli-multiple
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $coreExtension = Get-PrefixHelperExtensionPath 'extend_core'
        $packageExtension = Get-PrefixHelperExtensionPath 'extend_package\init'
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        assert(eq(TST_EXT_GLOBAL(), "core-global"))
        assert(eq(TST_EXT_PACKAGE_INIT(), "package-init"))
        '@
        
          $result = Invoke-PrefixWithArguments -Arguments @($coreExtension, $packageExtension, $programPath)
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if ($result.Stdout.Length -ne 0) {
            $stdout = Format-VisibleText $result.Stdout
            throw "Expected no stdout output, got: $stdout"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: extend-cli-prex-rejected
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $prexPath = Join-Path (Split-Path -Parent $helperPath) 'extend_prex_only.prex'
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        assert(true)
        '@
        
          $result = Invoke-PrefixWithArguments -Arguments @($prexPath, $programPath)
          if ($result.ExitCode -eq 0) {
            $stdout = Format-VisibleText $result.Stdout
            $stderr = Format-VisibleText $result.Stderr
            throw "Expected the interpreter to reject a .prex CLI extension input`nSTDOUT: $stdout`nSTDERR: $stderr"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: extend-cli-repl-handler
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $hooksExtension = Get-PrefixHelperExtensionPath 'extend_hooks'
        
        try {
          $replLogPath = Join-Path $tempDir 'repl.log'
        
          $result = Invoke-PrefixWithArguments -Arguments @($hooksExtension) -InputText ".exit`n" -EnvironmentVariables @{
            PREFIX_TEST_REPL_LOG = $replLogPath
          }
        
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if (-not (Test-Path $replLogPath)) {
            throw 'Expected the replacement REPL handler to create its marker file'
          }
        
          $marker = Get-Content -Path $replLogPath -Raw
          if ($marker -ne 'repl-handler') {
            throw "Unexpected REPL marker text: $marker"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: extend-event-handlers
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $hooksExtension = Get-PrefixHelperExtensionPath 'extend_hooks'
        
        try {
          $eventLogPath = Join-Path $tempDir 'events.log'
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        func int ping(){
            return(0d1)
        }
        
        assert(eq(TST_HOOKS_READY(), "hooks-ready"))
        assert(eq(ping(), 0d1))
        '@
        
          $result = Invoke-PrefixWithArguments -Arguments @($hooksExtension, $programPath) -EnvironmentVariables @{
            PREFIX_TEST_EVENT_LOG = $eventLogPath
          }
        
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if (-not (Test-Path $eventLogPath)) {
            throw 'Expected the event-hook extension to create its log file'
          }
        
          $events = Get-Content -Path $eventLogPath | Where-Object { $_.Length -gt 0 }
          foreach ($expectedEvent in @('program_start', 'before_statement', 'after_statement', 'before_call', 'after_call', 'program_end')) {
            if ($events -notcontains $expectedEvent) {
              throw "Expected event '$expectedEvent' to appear in the hook log. Got: $($events -join ', ')"
            }
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: extend-event-on-error
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $hooksExtension = Get-PrefixHelperExtensionPath 'extend_hooks'
        
        try {
          $eventLogPath = Join-Path $tempDir 'events.log'
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        throw("boom")
        '@
        
          $result = Invoke-PrefixWithArguments -Arguments @($hooksExtension, $programPath) -EnvironmentVariables @{
            PREFIX_TEST_EVENT_LOG = $eventLogPath
          }
        
          if ($result.ExitCode -eq 0) {
            throw 'Expected the program to fail so the on_error hook can run'
          }
        
          if (-not (Test-Path $eventLogPath)) {
            throw 'Expected the event-hook extension to create its log file'
          }
        
          $events = Get-Content -Path $eventLogPath | Where-Object { $_.Length -gt 0 }
          if ($events -notcontains 'on_error') {
            throw "Expected event 'on_error' to appear in the hook log. Got: $($events -join ', ')"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: extend-explicit-suffix-rejected
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $suffix = Get-PrefixExtensionSuffix
        $coreExtension = Get-PrefixHelperExtensionPath 'extend_core'
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $stagedExtension = Join-Path $tempDir ("extend_core{0}" -f $suffix)
          $extensionSpecifier = "extend_core{0}" -f $suffix
        
          Copy-Item -Path $coreExtension -Destination $stagedExtension -Force
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        bool loaded = extend("$extensionSpecifier")
        refute(loaded)
        "@
        
          $result = Invoke-PrefixWithArguments -Arguments @($programPath)
          if ($result.ExitCode -eq 0) {
            $stdout = Format-VisibleText $result.Stdout
            $stderr = Format-VisibleText $result.Stderr
            throw "Expected extend to reject a suffix-qualified specifier`nSTDOUT: $stdout`nSTDERR: $stderr"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
