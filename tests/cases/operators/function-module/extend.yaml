passing:
  - name: extend-alias-qualified-namespace
    language: Prefix
    source: |
        import("path")
        
        str tests_dir = path.directory_name(path.directory_name(path.script_dir))
        str helper_path = join(tests_dir, "/helpers/extend_core_once.pre")
        
        refute(import_path(helper_path, "first"))
        refute(import_path(helper_path, "second"))
        assert(eq(first.extend_core.TST_EXT_RESTRICTED(), "core-restricted"))
        assert(eq(second.extend_core.TST_EXT_RESTRICTED(), "core-restricted"))
        assert(eq(TST_EXT_INIT_COUNT(), 0d1))
