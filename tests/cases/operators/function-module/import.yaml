passing:
  - name: import-alias-qualified-namespace
    language: Prefix
    source: |
        IMPORT("path", "helper")
        
        ASSERT(EQ(TYPE(helper.TEMPFILE("import-alias-qualified-namespace.txt")), "STR"))
  - name: import-alias-type-str
    language: Prefix
    source: |
        IMPORT("path", "helper")
        
  - name: import-cached-alias
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $moduleName = 'prefiximport' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        
        try {
          $markerPath = Join-Path $tempDir 'marker.txt'
          $markerLiteral = $markerPath.Replace('\', '/')
          $programPath = Join-Path $tempDir 'program.pre'
          $modulePath = Join-Path $tempDir "$moduleName.pre"
        
          Set-Content -Path $modulePath -Encoding Ascii -Value @"
        STR marker = "$markerLiteral"
        
        IF(EXISTFILE(marker)){
            WRITEFILE("reloaded", marker)
        } ELSE {
            WRITEFILE("loaded", marker)
        }
        
        FUNC STR marker_text(){
            RETURN(READFILE(marker))
        }
        "@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        IMPORT("$moduleName")
        IMPORT("$moduleName", "again")
        
        ASSERT(EQ($moduleName.marker_text(), "loaded"))
        ASSERT(EQ(again.marker_text(), "loaded"))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $outputText = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: import-isolated-top-level
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $moduleName = 'prefiximport' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $modulePath = Join-Path $tempDir "$moduleName.pre"
        
          Set-Content -Path $modulePath -Encoding Ascii -Value @'
        INT shared = 0d7
        
        FUNC INT read_shared(){
            RETURN(shared)
        }
        '@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        INT shared = 0d11
        
        IMPORT("$moduleName", "helper")
        
        ASSERT(EQ(helper.read_shared(), 0d7))
        ASSERT(EQ(shared, 0d11))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $outputText = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: import-local-before-stdlib
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $prefixDir = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $PSScriptRoot))
        $tempDir = New-PrefixTempDir
        $moduleName = 'prefiximport' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        $stdlibPath = Join-Path $prefixDir "lib\std\$moduleName.pre"
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $localModulePath = Join-Path $tempDir "$moduleName.pre"
        
          Set-Content -Path $localModulePath -Encoding Ascii -Value @'
        FUNC STR identify(){
            RETURN("local")
        }
        '@
        
          Set-Content -Path $stdlibPath -Encoding Ascii -Value @'
        FUNC STR identify(){
            RETURN("stdlib")
        }
        '@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        IMPORT("$moduleName")
        
        ASSERT(EQ($moduleName.identify(), "local"))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $outputText = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $stdlibPath -Force -ErrorAction SilentlyContinue
        }
  - name: import-no-companion-prex
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $moduleName = 'prefiximport' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $modulePath = Join-Path $tempDir "$moduleName.pre"
          $pointerPath = Join-Path $tempDir "$moduleName.prex"
        
          Set-Content -Path $modulePath -Encoding Ascii -Value @'
        FUNC STR identify(){
            RETURN("source")
        }
        '@
        
          Set-Content -Path $pointerPath -Encoding Ascii -Value 'this companion pointer file must be ignored by IMPORT'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        IMPORT("$moduleName")
        
        ASSERT(EQ($moduleName.identify(), "source"))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $outputText = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: import-package-init
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $packageName = 'prefixpkg' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $packageDir = Join-Path $tempDir $packageName
          $initPath = Join-Path $packageDir 'init.pre'
        
          New-Item -ItemType Directory -Path $packageDir | Out-Null
        
          Set-Content -Path $initPath -Encoding Ascii -Value @'
        FUNC STR identify(){
            RETURN("package")
        }
        '@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        IMPORT("$packageName")
        
        ASSERT(EQ($packageName.identify(), "package"))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $outputText = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: import-package-missing-init-errors
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $packageName = 'prefixpkg' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $modulePath = Join-Path $tempDir "$packageName.pre"
          $packageDir = Join-Path $tempDir $packageName
        
          New-Item -ItemType Directory -Path $packageDir | Out-Null
        
          Set-Content -Path $modulePath -Encoding Ascii -Value @'
        FUNC STR identify(){
            RETURN("module")
        }
        '@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        IMPORT("$packageName")
        "@
        
          $result = Invoke-PrefixProgramWithInput -ProgramPath $programPath -InputText ''
          if ($result.ExitCode -eq 0) {
            $outputText = "STDOUT: $(Format-VisibleText $result.Stdout)`nSTDERR: $(Format-VisibleText $result.Stderr)"
            throw "Expected IMPORT($packageName) to fail when the package directory has no init.pre`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
