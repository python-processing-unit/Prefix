        IMPORT("path")
        
failing:
  - name: import-alias-type-bool
    language: Prefix
    source: 'IMPORT("path", TRUE)'
  - name: import-alias-type-flt
    language: Prefix
    source: 'IMPORT("path", 0d1.0)'
  - name: import-alias-type-func
    language: Prefix
    source: 'IMPORT("path", LAMBDA BOOL: (){})'
  - name: import-alias-type-int
    language: Prefix
    source: 'IMPORT("path", 0d1)'
  - name: import-alias-type-map
    language: Prefix
    source: 'IMPORT("path", <>)'
  - name: import-alias-type-thr
    language: Prefix
    source: 'IMPORT("path", ASYNC{})'
  - name: import-alias-type-tns
    language: Prefix
    source: 'IMPORT("path", [0d1])'
  - name: import-arity-three
    language: Prefix
    source: 'IMPORT("path", "helper", extra)'
  - name: import-arity-zero
    language: Prefix
    source: IMPORT()
  - name: import-missing-module
    language: Prefix
    source: IMPORT("prefiximportmissingmoduletest")
  - name: import-type-bool
    language: Prefix
    source: IMPORT(TRUE)
  - name: import-type-flt
    language: Prefix
    source: IMPORT(0d1.0)
  - name: import-type-func
    language: Prefix
    source: 'IMPORT(LAMBDA BOOL: (){})'
  - name: import-type-int
    language: Prefix
    source: IMPORT(0d1)
  - name: import-type-map
    language: Prefix
    source: IMPORT(<>)
  - name: import-type-thr
    language: Prefix
    source: IMPORT(ASYNC{})
  - name: import-type-tns
    language: Prefix
    source: IMPORT([0d1])
