passing:
  - name: run-empty-source
    language: Prefix
    source: |
        int marker = 0d1
        run("")
        assert(eq(marker, 0d1))
  - name: run-parse-error
    language: Prefix
    source: |
        int step = 0d0
        bool caught = false
        
        try{
            run("step = 0d1; if(true){")
            assert(false)
        } catch {
            caught = true
        }
        
        assert(caught)
        assert(eq(step, 0d0))
  - name: run-runtime-error
    language: Prefix
    source: |
        int step = 0d0
        bool caught = false
        
        try{
            run("step = 0d1; assert(false); step = 0d2")
            assert(false)
        } catch {
            caught = true
        }
        
        assert(caught)
        assert(eq(step, 0d1))
  - name: run-top-level-env
    language: Prefix
    source: |
        int counter = 0d2
        
        run("assert(eq(counter, 0d2)); counter = +(counter, 0d3)")
        assert(eq(counter, 0d5))
        
        run("int created = -(counter, 0d1)")
        assert(eq(created, 0d4))
failing:
  - name: run-arity-two
    language: Prefix
    source: 'run("", "")'
  - name: run-arity-zero
    language: Prefix
    source: run()
  - name: run-non-str
    language: Prefix
    source: run(0d1)
