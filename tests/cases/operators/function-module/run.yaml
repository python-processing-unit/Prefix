passing:
  - name: run-empty-source
    language: Prefix
    source: |
        int marker = 0d1
        RUN("")
        ASSERT(EQ(marker, 0d1))
  - name: run-parse-error
    language: Prefix
    source: |
        int step = 0d0
        bool caught = FALSE
        
        try{
            RUN("step = 0d1; if(TRUE){")
            ASSERT(FALSE)
        } catch {
            caught = TRUE
        }
        
        ASSERT(caught)
        ASSERT(EQ(step, 0d0))
  - name: run-runtime-error
    language: Prefix
    source: |
        int step = 0d0
        bool caught = FALSE
        
        try{
            RUN("step = 0d1; ASSERT(FALSE); step = 0d2")
            ASSERT(FALSE)
        } catch {
            caught = TRUE
        }
        
        ASSERT(caught)
        ASSERT(EQ(step, 0d1))
  - name: run-top-level-env
    language: Prefix
    source: |
        int counter = 0d2
        
        RUN("ASSERT(EQ(counter, 0d2)); counter = +(counter, 0d3)")
        ASSERT(EQ(counter, 0d5))
        
        RUN("int created = -(counter, 0d1)")
        ASSERT(EQ(created, 0d4))
failing:
  - name: run-arity-two
    language: Prefix
    source: 'RUN("", "")'
  - name: run-arity-zero
    language: Prefix
    source: RUN()
  - name: run-non-str
    language: Prefix
    source: RUN(0d1)
