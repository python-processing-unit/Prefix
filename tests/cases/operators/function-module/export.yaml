passing:
  - name: export-alias-shared-module
    language: Prefix
    source: |
        import("path")
        
        str tests_dir = path.directory_name(path.directory_name(path.script_dir))
        str helper_path = join(tests_dir, "/helpers/export_target.pre")
        
        import_path(helper_path)
        import_path(helper_path, "again")
        
        int via_name = 0d7
        refute(export("via_name", "export_target"))
        assert(eq(again.via_name, 0d7))
        
        int via_alias = 0d8
        refute(export("via_alias", "again"))
        assert(eq(export_target.via_alias, 0d8))
  - name: export-copy-map
    language: Prefix
    source: |
        import("path")
        
        str tests_dir = path.directory_name(path.directory_name(path.script_dir))
        str helper_path = join(tests_dir, "/helpers/export_target.pre")
        
        refute(import_path(helper_path, "helper"))
        
        map box = <"value" = 0d5>
        refute(export("box", "helper"))
        
        box<"value"> = 0d6
        
        assert(eq(helper.read_box_value(), 0d5))
        refute(helper.set_box_value(0d7))
        assert(eq(box<"value">, 0d6))
        assert(eq(helper.read_box_value(), 0d7))
  - name: export-copy-tensor
    language: Prefix
    source: |
        import("path")
        
        str tests_dir = path.directory_name(path.directory_name(path.script_dir))
        str helper_path = join(tests_dir, "/helpers/export_target.pre")
        
        refute(import_path(helper_path, "helper"))
        
        tensor tensor = [0d5, 0d6]
        refute(export("tensor", "helper"))
        
        tensor[0d1] = 0d8
        
        assert(eq(helper.read_tensor_first(), 0d5))
        refute(helper.set_tensor_first(0d9))
        assert(eq(tensor[0d1], 0d8))
        assert(eq(helper.read_tensor_first(), 0d9))
  - name: export-qualified-call
    language: Prefix
    source: |
        import("path", "helper")
        
        func str describe(){
            return("exported")
        }
        
        refute(export("describe", "helper"))
        assert(eq(helper.describe(), "exported"))
  - name: export-return-false
    language: Prefix
    source: |
        import("path")
        
        str tests_dir = path.directory_name(path.directory_name(path.script_dir))
        str helper_path = join(tests_dir, "/helpers/export_target.pre")
        
        refute(import_path(helper_path, "helper"))
        
        int value = 0d42
        bool result = export("value", "helper")
        
        assert(eq(type(result), "bool"))
        refute(result)
        assert(eq(helper.value, 0d42))
