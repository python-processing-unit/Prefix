        func int read_module_var(){
            return(module_var)
        }
        '@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        int caller_var = 0d11
        
        include("$moduleName")
        
        assert(eq(read_module_var(), 0d7))
        assert(eq(module_var, 0d7))
        assert(eq(caller_var, 0d11))
        "@
        
