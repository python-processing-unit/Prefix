            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
        
  - name: include-local-before-stdlib
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $prefixDir = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $PSScriptRoot))
        $tempDir = New-PrefixTempDir
        $moduleName = 'prefixinclude' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        $stdlibPath = Join-Path $prefixDir "lib\std\$moduleName.pre"
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $localModulePath = Join-Path $tempDir "$moduleName.pre"
        
          Set-Content -Path $localModulePath -Encoding Ascii -Value @'
        func str identify(){
            return("local")
        }
        '@
        
          Set-Content -Path $stdlibPath -Encoding Ascii -Value @'
        func str identify(){
            return("stdlib")
        }
        '@
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        include("$moduleName")
        
        assert(eq(identify(), "local"))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $outputText = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            throw "Prefix exited with code $LASTEXITCODE`n$outputText"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $stdlibPath -Force -ErrorAction SilentlyContinue
        }
        
  - name: include-no-companion-prex
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        $moduleName = 'prefixinclude' + ([IO.Path]::GetRandomFileName().Replace('.', ''))
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
          $modulePath = Join-Path $tempDir "$moduleName.pre"
          $pointerPath = Join-Path $tempDir "$moduleName.prex"
        
          Set-Content -Path $modulePath -Encoding Ascii -Value @'
        func str identify(){
            return("source")
        }
        '@
        
          Set-Content -Path $pointerPath -Encoding Ascii -Value 'this companion pointer file must be ignored by include'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @"
        include("$moduleName")
        
        assert(eq(identify(), "source"))
        "@
        
          $output = & (Get-PrefixExePath) $programPath 2>&1
