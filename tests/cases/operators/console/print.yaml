passing:
  - name: print-coerce-scalars
    language: Prefix
    source: |
        ASSERT(NOT(PRINT(TRUE)))
        ASSERT(NOT(PRINT(0d42)))
        ASSERT(NOT(PRINT(0d1.5)))
  - name: print-output-concat-newline
    language: PowerShell
    source: |
        $prefixDir = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $PSScriptRoot))
        $exeName = if ($IsLinux -or $IsMacOS) { 'prefix' } else { 'prefix.exe' }
        $exePath = Join-Path $prefixDir $exeName
        
        if (-not (Test-Path $exePath)) {
          throw "Interpreter executable not found at: $exePath"
        }
        
        $tempDir = Join-Path ([IO.Path]::GetTempPath()) ([IO.Path]::GetRandomFileName())
        New-Item -ItemType Directory -Path $tempDir | Out-Null
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        PRINT("left=", TRUE, ",right=", 0d42, ",flt=", INF)
        '@
        
          $startInfo = New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName = $exePath
          $startInfo.Arguments = ('"{0}"' -f $programPath)
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
        
          $process = [System.Diagnostics.Process]::Start($startInfo)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $exitCode = $process.ExitCode
          $process.Dispose()
        
          if ($exitCode -ne 0) {
            throw "Prefix exited with code $exitCode`nSTDOUT:`n$stdout`nSTDERR:`n$stderr"
          }
        
          if ($stderr.Length -ne 0) {
            throw "Expected no stderr output, got:`n$stderr"
          }
        
          if (-not [regex]::IsMatch($stdout, '\Aleft=TRUE,right=0d42,flt=INF(?:\r\n|\n)\z')) {
            $escapedStdout = $stdout.Replace("`r", '\r').Replace("`n", '\n')
            throw "Unexpected stdout: $escapedStdout"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
  - name: print-return-type
    language: Prefix
    source: 'ASSERT(EQ(PRINT("value"), FALSE))'
failing:
  - name: print-arity-zero
    language: Prefix
    source: PRINT()
  - name: print-first-func
    language: Prefix
    source: 'PRINT(LAMBDA bool: (){})'
  - name: print-first-map
    language: Prefix
    source: 'PRINT(<"key" = 0d1>)'
  - name: print-first-thr
    language: Prefix
    source: PRINT(ASYNC{})
  - name: print-first-tns
    language: Prefix
    source: PRINT([0d1])
