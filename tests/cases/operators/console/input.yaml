passing:
  - name: input-empty-line
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        str line = input()
        assert(isstr(line))
        assert(eq(line, ""))
        '@
        
          $result = Invoke-PrefixProgramWithInput -ProgramPath $programPath -InputText "`r`ntrailing`r`n"
        
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if ($result.Stdout.Length -ne 0) {
            $stdout = Format-VisibleText $result.Stdout
            throw "Expected no stdout output, got: $stdout"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
        
  - name: input-prompt-output
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        str line = input("PROMPT>")
        assert(eq(line, "alpha"))
        print("DONE=", line)
        '@
        
          $result = Invoke-PrefixProgramWithInput -ProgramPath $programPath -InputText "alpha`r`n"
        
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if (-not [regex]::IsMatch($result.Stdout, '\APROMPT>DONE=alpha(?:\r\n|\n)\z')) {
            $stdout = Format-VisibleText $result.Stdout
            throw "Unexpected stdout: $stdout"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
        
  - name: input-return-type
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        str line = input()
        assert(isstr(line))
        assert(eq(line, "Alpha beta 42"))
        '@
        
          $result = Invoke-PrefixProgramWithInput -ProgramPath $programPath -InputText "Alpha beta 42`r`nignored`r`n"
        
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if ($result.Stdout.Length -ne 0) {
            $stdout = Format-VisibleText $result.Stdout
            throw "Expected no stdout output, got: $stdout"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
        
  - name: input-sequential-lines
    language: PowerShell
    source: |
        $helperPath = Join-Path (Split-Path -Parent (Split-Path -Parent $PSScriptRoot)) 'helpers\prefix-input.ps1'
        . $helperPath
        
        $tempDir = New-PrefixTempDir
        
        try {
          $programPath = Join-Path $tempDir 'program.pre'
        
          Set-Content -Path $programPath -Encoding Ascii -Value @'
        assert(eq(input(), "alpha"))
        assert(eq(input(), "beta"))
        '@
        
          $result = Invoke-PrefixProgramWithInput -ProgramPath $programPath -InputText "alpha`r`nbeta`r`ngamma`r`n"
        
          Assert-PrefixSuccess $result
          Assert-NoErrorOutput $result
        
          if ($result.Stdout.Length -ne 0) {
            $stdout = Format-VisibleText $result.Stdout
            throw "Expected no stdout output, got: $stdout"
          }
        }
        finally {
          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
        }
        
