passing:
  - name: freeze
    language: Prefix
    source: |
        BOOL frozen_value = TRUE
        
        REFUTE(FREEZE("frozen_value"))
        ASSERT(FROZEN("frozen_value"))
        REFUTE(PERMAFROZEN("frozen_value"))
        
        BOOL freeze_undefined_failed = FALSE
        TRY{
            FREEZE("not_declared")
        } CATCH {
            freeze_undefined_failed = TRUE
        }
        ASSERT(freeze_undefined_failed)
        
        BOOL reassignment_failed = FALSE
        TRY{
            frozen_value = FALSE
        } CATCH {
            reassignment_failed = TRUE
        }
        ASSERT(reassignment_failed)
        ASSERT(EQ(frozen_value, TRUE))
        
        BOOL deletion_failed = FALSE
        TRY{
            DEL("frozen_value")
        } CATCH {
            deletion_failed = TRUE
        }
        ASSERT(deletion_failed)
        ASSERT(EXIST("frozen_value"))
        
        REFUTE(THAW("frozen_value"))
        REFUTE(FROZEN("frozen_value"))
        frozen_value = FALSE
        ASSERT(EQ(frozen_value, FALSE))
        
  - name: frozen
    language: Prefix
    source: |
        BOOL normal_value = TRUE
        REFUTE(FROZEN("normal_value"))
        
        REFUTE(FREEZE("normal_value"))
        ASSERT(FROZEN("normal_value"))
        REFUTE(THAW("normal_value"))
        REFUTE(FROZEN("normal_value"))
        
        REFUTE(PERMAFREEZE("normal_value"))
        ASSERT(FROZEN("normal_value"))
        ASSERT(PERMAFROZEN("normal_value"))
        
  - name: permafreeze
    language: Prefix
    source: |
        BOOL locked_value = TRUE
        
        REFUTE(PERMAFREEZE("locked_value"))
        ASSERT(FROZEN("locked_value"))
        ASSERT(PERMAFROZEN("locked_value"))
        
        BOOL permafreeze_undefined_failed = FALSE
        TRY{
            PERMAFREEZE("not_declared")
        } CATCH {
            permafreeze_undefined_failed = TRUE
        }
        ASSERT(permafreeze_undefined_failed)
        
        BOOL reassignment_failed = FALSE
        TRY{
            locked_value = FALSE
        } CATCH {
            reassignment_failed = TRUE
        }
        ASSERT(reassignment_failed)
        ASSERT(EQ(locked_value, TRUE))
        
        BOOL deletion_failed = FALSE
        TRY{
            DEL("locked_value")
        } CATCH {
            deletion_failed = TRUE
        }
        ASSERT(deletion_failed)
        ASSERT(EXIST("locked_value"))
        
        BOOL thaw_failed = FALSE
        TRY{
            THAW("locked_value")
        } CATCH {
            thaw_failed = TRUE
        }
        ASSERT(thaw_failed)
        ASSERT(PERMAFROZEN("locked_value"))
        
  - name: permafrozen
    language: Prefix
    source: |
        BOOL normal_value = TRUE
        REFUTE(PERMAFROZEN("normal_value"))
        
        REFUTE(PERMAFREEZE("normal_value"))
        ASSERT(PERMAFROZEN("normal_value"))
        ASSERT(FROZEN("normal_value"))
        
  - name: thaw
    language: Prefix
    source: |
        BOOL thaw_value = TRUE
        
        REFUTE(THAW("thaw_value"))
        ASSERT(thaw_value)
        
        REFUTE(FREEZE("thaw_value"))
        ASSERT(FROZEN("thaw_value"))
        REFUTE(THAW("thaw_value"))
        REFUTE(FROZEN("thaw_value"))
        
        thaw_value = FALSE
        ASSERT(EQ(thaw_value, FALSE))
        
        BOOL thaw_undefined_failed = FALSE
        TRY{
            THAW("not_declared")
        } CATCH {
            thaw_undefined_failed = TRUE
        }
        ASSERT(thaw_undefined_failed)
        
failing:
  - name: alias-cycle
    language: Prefix
    source: |
        MAP x = <"v" = 0d1>
        MAP a = @x
        
        MAP x = @a
        
  - name: alias-to-frozen
    language: Prefix
    source: |
        INT t = 0d1
        FREEZE("t")
        
        INT p = @t
        
