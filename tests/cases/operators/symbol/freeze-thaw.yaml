passing:
  - name: freeze
    language: Prefix
    source: |
        bool frozen_value = true
        
        refute(lock("frozen_value"))
        assert(locked("frozen_value"))
        refute(frozen("frozen_value"))
        
        bool freeze_undefined_failed = false
        try{
            lock("not_declared")
        } catch {
            freeze_undefined_failed = true
        }
        assert(freeze_undefined_failed)
        
        bool reassignment_failed = false
        try{
            frozen_value = false
        } catch {
            reassignment_failed = true
        }
        assert(reassignment_failed)
        assert(eq(frozen_value, true))
        
        bool deletion_failed = false
        try{
            del("frozen_value")
        } catch {
            deletion_failed = true
        }
        assert(deletion_failed)
        assert(exist("frozen_value"))
        
        refute(unlock("frozen_value"))
        refute(locked("frozen_value"))
        frozen_value = false
        assert(eq(frozen_value, false))
        
  - name: frozen
    language: Prefix
    source: |
        bool normal_value = true
        refute(locked("normal_value"))
        
        refute(lock("normal_value"))
        assert(locked("normal_value"))
        refute(unlock("normal_value"))
        refute(locked("normal_value"))
        
        refute(freeze("normal_value"))
        assert(locked("normal_value"))
        assert(frozen("normal_value"))
        
  - name: permafreeze
    language: Prefix
    source: |
        bool locked_value = true
        
        refute(freeze("locked_value"))
        assert(locked("locked_value"))
        assert(frozen("locked_value"))
        
        bool permafreeze_undefined_failed = false
        try{
            freeze("not_declared")
        } catch {
            permafreeze_undefined_failed = true
        }
        assert(permafreeze_undefined_failed)
        
        bool reassignment_failed = false
        try{
            locked_value = false
        } catch {
            reassignment_failed = true
        }
        assert(reassignment_failed)
        assert(eq(locked_value, true))
        
        bool deletion_failed = false
        try{
            del("locked_value")
        } catch {
            deletion_failed = true
        }
        assert(deletion_failed)
        assert(exist("locked_value"))
        
        bool thaw_failed = false
        try{
            unlock("locked_value")
        } catch {
            thaw_failed = true
        }
        assert(thaw_failed)
        assert(frozen("locked_value"))
        
  - name: permafrozen
    language: Prefix
    source: |
        bool normal_value = true
        refute(frozen("normal_value"))
        
        refute(freeze("normal_value"))
        assert(frozen("normal_value"))
        assert(locked("normal_value"))
        
  - name: thaw
    language: Prefix
    source: |
        bool thaw_value = true
        
        refute(unlock("thaw_value"))
        assert(thaw_value)
        
        refute(lock("thaw_value"))
        assert(locked("thaw_value"))
        refute(unlock("thaw_value"))
        refute(locked("thaw_value"))
        
        thaw_value = false
        assert(eq(thaw_value, false))
        
        bool thaw_undefined_failed = false
        try{
            unlock("not_declared")
        } catch {
            thaw_undefined_failed = true
        }
        assert(thaw_undefined_failed)
        
failing:
  - name: alias-cycle
    language: Prefix
    source: |
        map x = <"v" = 0d1>
        map a = @x
        
        map x = @a
        
  - name: alias-to-frozen
    language: Prefix
    source: |
        int t = 0d1
        lock("t")
        
        int p = @t
        
