passing:
  - name: del-frozen
    language: Prefix
    source: |
        bool frozen_symbol = TRUE
        REFUTE(FREEZE("frozen_symbol"))
        
        bool frozen_delete_failed = FALSE
        try{
            DEL("frozen_symbol")
        } catch {
            frozen_delete_failed = TRUE
        }
        ASSERT(frozen_delete_failed)
        ASSERT(EXIST("frozen_symbol"))
        
        REFUTE(THAW("frozen_symbol"))
        REFUTE(DEL("frozen_symbol"))
        REFUTE(EXIST("frozen_symbol"))
        
        bool permafrozen_symbol = TRUE
        REFUTE(PERMAFREEZE("permafrozen_symbol"))
        
        bool permafrozen_delete_failed = FALSE
        try{
            DEL("permafrozen_symbol")
        } catch {
            permafrozen_delete_failed = TRUE
        }
        ASSERT(permafrozen_delete_failed)
        ASSERT(EXIST("permafrozen_symbol"))
        
  - name: del-map
    language: Prefix
    source: |
        map top = <"keep" = 0d1, "drop" = 0d2>
        REFUTE(DEL('top<"drop">'))
        ASSERT(EQ(top, <"keep" = 0d1>))
        
        bool top_missing = FALSE
        try{
            top<"drop">
        } catch {
            top_missing = TRUE
        }
        ASSERT(top_missing)
        
        map nested = <"outer" = <"keep" = 0d1, "drop" = 0d2>>
        REFUTE(DEL('nested<"outer", "drop">'))
        ASSERT(EQ(nested, <"outer" = <"keep" = 0d1>>))
        
        map missing_intermediate = <"outer" = <"keep" = 0d1>>
        REFUTE(DEL('missing_intermediate<"absent", "drop">'))
        ASSERT(EQ(missing_intermediate, <"outer" = <"keep" = 0d1>>))
        
        map missing_final = <"outer" = <"keep" = 0d1>>
        REFUTE(DEL('missing_final<"outer", "drop">'))
        ASSERT(EQ(missing_final, <"outer" = <"keep" = 0d1>>))
        
  - name: del-symbol
    language: Prefix
    source: |
        bool symbol = TRUE
        ASSERT(EXIST("symbol"))
        REFUTE(DEL("symbol"))
        REFUTE(EXIST("symbol"))
        
        bool deleted_read_failed = FALSE
        try{
        	symbol
        } catch {
        	deleted_read_failed = TRUE
        }
        ASSERT(deleted_read_failed)
        
        int count = 0d1
        REFUTE(DEL("count"))
        count = 0d2
        ASSERT(EQ(count, 0d2))
        ASSERT(EXIST("count"))
        
failing:
  - name: del-already-deleted-symbol
    language: Prefix
    source: |
        bool x = TRUE
        DEL("x")
        DEL("x")
        
  - name: del-map-intermediate-not-map
    language: Prefix
    source: |
        map value = <"branch" = 0d1>
        DEL('value<"branch", "leaf">')
        
  - name: del-map-target-not-map
    language: Prefix
    source: |
        int value = 0d1
        DEL('value<"key">')
        
  - name: del-never-assigned-symbol
    language: Prefix
    source: |
        bool x
        DEL("x")
        
  - name: del-nonexistent-symbol
    language: Prefix
    source: |
        DEL("x")
        
  - name: del-raw-indexed-target
    language: Prefix
    source: |
        map value = <"key" = 0d1>
        DEL(value<"key">)
  - name: del-raw-symbol-argument
    language: Prefix
    source: |
        bool x = TRUE
        DEL(x)
  - name: del-type-mismatch-after-delete
    language: Prefix
    source: |
        int x = 0d1
        DEL("x")
        bool x = TRUE
        
