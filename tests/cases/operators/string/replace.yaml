passing:
  - name: replace-basic
    language: Prefix
    source: |
        assert(eq(type(replace("prefix", "fix", "lude")), "str"))
        assert(eq(replace("prefix", "fix", "lude"), "prelude"))
        
  - name: replace-empty-new
    language: Prefix
    source: |
        assert(eq(replace("one,two,three", ",", ""), "onetwothree"))
        
  - name: replace-every-occurrence
    language: Prefix
    source: |
        assert(eq(replace("abXXcdXXef", "XX", "__"), "ab__cd__ef"))
        assert(eq(replace("fooXXbarXXXXbaz", "XX", "-"), "foo-bar--baz"))
        
  - name: replace-not-found
    language: Prefix
    source: |
        assert(eq(replace("prefix", "zzz", "X"), "prefix"))
        
  - name: replace-substring-exact
    language: Prefix
    source: |
        assert(eq(replace("abc", "ac", "Z"), "abc"))
        assert(eq(replace("a  b  c", "  ", "-"), "a-b-c"))
        
  - name: replace-whole
    language: Prefix
    source: |
        assert(eq(replace("token", "token", "x"), "x"))
        
failing:
  - name: replace-arity-four
    language: Prefix
    source: |
        replace("abc", "a", "b", "c")
        
  - name: replace-arity-one
    language: Prefix
    source: |
        replace("abc")
        
  - name: replace-arity-two
    language: Prefix
    source: |
        replace("abc", "a")
        
  - name: replace-arity-zero
    language: Prefix
    source: |
        replace()
        
  - name: replace-empty
    language: Prefix
    source: |
        replace("abc", "", "x")
        
  - name: replace-first-non-str
    language: Prefix
    source: |
        replace(0d1, "a", "b")
        
  - name: replace-second-non-str
    language: Prefix
    source: |
        replace("abc", 0d1, "b")
        
  - name: replace-third-non-str
    language: Prefix
    source: |
        replace("abc", "a", 0d1)
        
