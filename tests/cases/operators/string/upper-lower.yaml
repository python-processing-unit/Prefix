passing:
  - name: lower
    language: Prefix
    source: |
        assert(eq(type(lowercase("PREFIX")), "str"))
        assert(eq(lowercase("PREFIX"), "prefix"))
        assert(eq(lowercase("Prefix 123!"), "prefix 123!"))
        assert(eq(lowercase(""), ""))
  - name: upper
    language: Prefix
    source: |
        assert(eq(type(uppercase("prefix")), "str"))
        assert(eq(uppercase("prefix"), "PREFIX"))
        assert(eq(uppercase("Prefix 123!"), "PREFIX 123!"))
        assert(eq(uppercase(""), ""))
failing:
  - name: lower-arity-two
    language: Prefix
    source: 'lowercase("a", "b")'
  - name: lower-arity-zero
    language: Prefix
    source: lowercase()
  - name: lower-non-str
    language: Prefix
    source: lowercase(0d1)
  - name: upper-arity-two
    language: Prefix
    source: 'uppercase("a", "b")'
  - name: upper-arity-zero
    language: Prefix
    source: uppercase()
  - name: upper-non-str
    language: Prefix
    source: uppercase(0d1)
