passing:
  - name: strip-basic
    language: Prefix
    source: |
        assert(eq(type(strip("prefix", "fix")), "str"))
        assert(eq(strip("prefix", "fix"), "pre"))
        
  - name: strip-empty-and-whole
    language: Prefix
    source: |
        assert(eq(strip("", "x"), ""))
        assert(eq(strip("whole", "whole"), ""))
        
  - name: strip-every-occurrence
    language: Prefix
    source: |
        assert(eq(strip("banana", "an"), "ba"))
        assert(eq(strip("fooXXbarXXXXbazXX", "XX"), "foobarbaz"))
        
  - name: strip-not-found
    language: Prefix
    source: |
        assert(eq(strip("prefix", "zzz"), "prefix"))
        
  - name: strip-substring-exact
    language: Prefix
    source: |
        assert(eq(strip("abc", "ac"), "abc"))
        assert(eq(strip("a  b  c", "  "), "abc"))
        
failing:
  - name: strip-arity-one
    language: Prefix
    source: |
        strip("abc")
        
  - name: strip-arity-three
    language: Prefix
    source: |
        strip("abc", "a", "b")
        
  - name: strip-arity-zero
    language: Prefix
    source: |
        strip()
        
  - name: strip-empty-remove
    language: Prefix
    source: |
        strip("abc", "")
        
  - name: strip-first-non-str
    language: Prefix
    source: |
        strip(0d1, "a")
        
  - name: strip-second-non-str
    language: Prefix
    source: |
        strip("abc", 0d1)
        
