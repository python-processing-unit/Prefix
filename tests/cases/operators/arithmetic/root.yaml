passing:
  - name: froot-neg
    language: Prefix
    source: |
        ! froot negative example with odd exponent allowed
        float result = froot(-0d8.0, 0d3.0)
        assert(eq(result, -0d2.0))
        
  - name: froot
    language: Prefix
    source: |
        float result_root_normal = froot(0d16.0, 0d2.0)
        assert(eq(result_root_normal, 0d4.0))
        
        ! froot positive example: cube root of 8.0 (merged from froot.pre)
        float result = froot(0d8.0, 0d3.0)
        assert(eq(result, 0d2.0))
        
  - name: iroot
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_root = iroot(0d16, 0d2)
        assert(eq(result_root, 0d4))
        
  - name: root-flt
    language: Prefix
    source: |
        float exact_hex = 0x64.0
        float exact_dec = 0d64.0
        float zero_hex = 0x0.0
        float negative_odd_dec = -0d27.0
        float root_dec = 0d2.0
        float root_hex = 0x3.0
        
        assert(eq(root(exact_hex, root_dec), 0xA.0))
        assert(isfloat(root(exact_hex, root_dec)))
        assert(eq(BASE(root(exact_hex, root_dec)), 0d16))
        
        assert(eq(root(exact_dec, root_hex), 0x4.0))
        assert(eq(BASE(root(exact_dec, root_hex)), 0d16))
        
        assert(eq(root(zero_hex, root_hex), 0x0.0))
        assert(eq(BASE(root(zero_hex, root_hex)), 0d16))
        assert(eq(root(negative_odd_dec, root_hex), -0x3.0))
        assert(eq(BASE(root(negative_odd_dec, root_hex)), 0d16))
        
  - name: root-int
    language: Prefix
    source: |
        int exact_hex = 0x64
        int floor_dec = 0d17
        int zero_hex = 0x0
        int unit_hex = 0x1
        int root_dec = 0d2
        int root_hex = 0x2
        int neg_one_dec = -0d1
        
        assert(eq(root(exact_hex, root_dec), 0xA))
        assert(isint(root(exact_hex, root_dec)))
        assert(eq(BASE(root(exact_hex, root_dec)), 0d16))
        
        assert(eq(root(floor_dec, root_hex), 0x4))
        assert(eq(BASE(root(floor_dec, root_hex)), 0d16))
        
        assert(eq(root(zero_hex, 0d5), 0x0))
        assert(eq(BASE(root(zero_hex, 0d5)), 0d16))
        assert(eq(root(unit_hex, neg_one_dec), 0x1))
        assert(eq(BASE(root(unit_hex, neg_one_dec)), 0d16))
        
