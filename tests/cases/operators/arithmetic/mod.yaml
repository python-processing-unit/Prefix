passing:
  - name: mod-flt
    language: Prefix
    source: |
        float left_oct = 0o7.0
        float right_hex = 0x2.0
        float wide_oct = 0o5.0
        float right_hex_frac = 0x1.8
        
        assert(eq(mod(left_oct, right_hex), 0x1.0))
        assert(eq(BASE(mod(left_oct, right_hex)), 0d16))
        
        assert(eq(mod(wide_oct, right_hex_frac), 0x0.8))
        assert(eq(BASE(mod(wide_oct, right_hex_frac)), 0d16))
  - name: mod-int
    language: Prefix
    source: |
        int left_dec = 0d7
        int right_bin = 0b10
        int wide_hex = 0x10
        
        assert(eq(mod(left_dec, right_bin), 0d1))
        assert(eq(BASE(mod(left_dec, right_bin)), 0d10))
        
        assert(eq(mod(wide_hex, 0d3), 0x1))
        assert(eq(BASE(mod(wide_hex, 0d3)), 0d16))
  - name: mod-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d5
        int b1 = 0d2
        mod(@a1, b1)
        assert(eq(a1, 0d1))
        
        int a2 = 0d5
        int b2 = 0d2
        mod(a2, @b2)
        assert(eq(b2, 0d2))
        
        int a3 = 0d5
        int b3 = 0d2
        mod(@a3, @b3)
        assert(eq(a3, 0d1))
        assert(eq(b3, 0d1))
        
        float f1 = 0d5.5
        float g1 = 0d2.0
        mod(@f1, g1)
        assert(eq(f1, 0d1.5))
        
        float f2 = 0d5.5
        float g2 = 0d2.0
        mod(f2, @g2)
        assert(eq(g2, 0d2.0))
        
        float f3 = 0d5.5
        float g3 = 0d2.0
        mod(@f3, @g3)
        assert(eq(f3, 0d1.5))
        assert(eq(g3, 0d1.5))
        
failing:
  - name: mod-zero-flt
    language: Prefix
    source: 'mod(0o1.0, 0x0.0)'
  - name: mod-zero-int
    language: Prefix
    source: 'mod(0d1, 0d0)'
