passing:
  - name: iadd-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d10
        int b1 = 0d5
        I+(@a1, b1)
        ASSERT(EQ(a1, 0d15))
        
        int a2 = 0d10
        int b2 = 0d5
        I+(a2, @b2)
        ASSERT(EQ(b2, 0d15))
        
        int a3 = 0d10
        int b3 = 0d5
        I+(@a3, @b3)
        ASSERT(EQ(a3, 0d15))
        ASSERT(EQ(b3, 0d15))
        
  - name: iadd
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_add_1 = I+(0d10, 0d5)
        int result_add_2 = I+(0d10.5, 0d5.2) ! Coerces to integers before/after?
        ASSERT(EQ(result_add_1, 0d15))
        
  - name: idiv-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d20
        int b1 = 0d4
        I/(@a1, b1)
        ASSERT(EQ(a1, 0d5))
        
  - name: idiv
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_div = I/(0d20, 0d4)
        ASSERT(EQ(result_div, 0d5))
        
  - name: imul-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d4
        int b1 = 0d3
        I*(@a1, b1)
        ASSERT(EQ(a1, 0d12))
        
        int a2 = 0d4
        int b2 = 0d3
        I*(a2, @b2)
        ASSERT(EQ(b2, 0d12))
        
        int a3 = 0d4
        int b3 = 0d3
        I*(@a3, @b3)
        ASSERT(EQ(a3, 0d12))
        ASSERT(EQ(b3, 0d12))
        
  - name: imul
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_mul = I*(0d4, 0d5)
        ASSERT(EQ(result_mul, 0d20))
        
  - name: ipow
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_pow = IPOW(0d2, 0d3)
        ASSERT(EQ(result_pow, 0d8))
        
  - name: isub-int
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_sub = I-(0d10, 0d2.0)
        ASSERT(EQ(result_sub, 0d8))
        
  - name: isub-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d10
        int b1 = 0d5
        I-(@a1, b1)
        ASSERT(EQ(a1, 0d5))
        
