passing:
  - name: iadd-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d10
        int b1 = 0d5
        i+(@a1, b1)
        assert(eq(a1, 0d15))
        
        int a2 = 0d10
        int b2 = 0d5
        i+(a2, @b2)
        assert(eq(b2, 0d15))
        
        int a3 = 0d10
        int b3 = 0d5
        i+(@a3, @b3)
        assert(eq(a3, 0d15))
        assert(eq(b3, 0d15))
        
  - name: iadd
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_add_1 = i+(0d10, 0d5)
        int result_add_2 = i+(0d10.5, 0d5.2) ! Coerces to integers before/after?
        assert(eq(result_add_1, 0d15))
        
  - name: idiv-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d20
        int b1 = 0d4
        i/(@a1, b1)
        assert(eq(a1, 0d5))
        
  - name: idiv
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_div = i/(0d20, 0d4)
        assert(eq(result_div, 0d5))
        
  - name: imul-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d4
        int b1 = 0d3
        i*(@a1, b1)
        assert(eq(a1, 0d12))
        
        int a2 = 0d4
        int b2 = 0d3
        i*(a2, @b2)
        assert(eq(b2, 0d12))
        
        int a3 = 0d4
        int b3 = 0d3
        i*(@a3, @b3)
        assert(eq(a3, 0d12))
        assert(eq(b3, 0d12))
        
  - name: imul
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_mul = i*(0d4, 0d5)
        assert(eq(result_mul, 0d20))
        
  - name: ipow
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_pow = ipow(0d2, 0d3)
        assert(eq(result_pow, 0d8))
        
  - name: isub-int
    language: Prefix
    source: |
        ! Passing integer arithmetic, checking coercion and correct logic
        int result_sub = i-(0d10, 0d2.0)
        assert(eq(result_sub, 0d8))
        
  - name: isub-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d10
        int b1 = 0d5
        i-(@a1, b1)
        assert(eq(a1, 0d5))
        
