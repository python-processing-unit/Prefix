passing:
  - name: add-pointer-writeback
    language: Prefix
    source: |
        INT a1 = 0d2
        INT b1 = 0d3
        +(@a1, b1)
        ASSERT(EQ(a1, 0d5))
        
        INT a2 = 0d2
        INT b2 = 0d3
        +(a2, @b2)
        ASSERT(EQ(b2, 0d5))
        
        INT a3 = 0d2
        INT b3 = 0d3
        +(@a3, @b3)
        ASSERT(EQ(a3, 0d5))
        ASSERT(EQ(b3, 0d5))
        
        FLT f1 = 0d1.5
        FLT g1 = 0d2.25
        +(@f1, g1)
        ASSERT(EQ(f1, 0d3.75))
        
        FLT f2 = 0d1.5
        FLT g2 = 0d2.25
        +(f2, @g2)
        ASSERT(EQ(g2, 0d3.75))
        
        FLT f3 = 0d1.5
        FLT g3 = 0d2.25
        +(@f3, @g3)
        ASSERT(EQ(f3, 0d3.75))
        ASSERT(EQ(g3, 0d3.75))
        
  - name: div-flt
    language: Prefix
    source: |
        FLT left_oct = 0o1.4
        FLT right_hex = 0x0.8
        FLT left_oct_one = 0o1.0
        
        ASSERT(EQ(/(left_oct, right_hex), 0x3.0))
        ASSERT(EQ(BASE(/(left_oct, right_hex)), 0d16))
        
        ASSERT(EQ(/(left_oct_one, right_hex), 0x2.0))
        ASSERT(EQ(BASE(/(left_oct_one, right_hex)), 0d16))
  - name: div-int
    language: Prefix
    source: |
        INT left_dec = 0d2
        INT wide_hex = 0x10
        
        ASSERT(EQ(/(0d6, left_dec), 0d3))
        ASSERT(EQ(BASE(/(0d6, left_dec)), 0d10))
        
        ASSERT(EQ(/(wide_hex, left_dec), 0d8))
        ASSERT(EQ(BASE(/(wide_hex, left_dec)), 0d16))
  - name: div-pointer-writeback
    language: Prefix
    source: |
        INT a1 = 0d6
        INT b1 = 0d3
        /(@a1, b1)
        ASSERT(EQ(a1, 0d2))
        
        FLT f1 = 0d3.0
        FLT g1 = 0d1.5
        /(@f1, g1)
        ASSERT(EQ(f1, 0d2.0))
        
  - name: mul-flt
    language: Prefix
    source: |
        FLT left_oct = 0o1.4
        FLT right_hex = 0x0.8
        FLT left_oct_one = 0o1.0
        
        ASSERT(EQ(*(left_oct, right_hex), 0x0.C))
        ASSERT(EQ(BASE(*(left_oct, right_hex)), 0d16))
        
        ASSERT(EQ(*(left_oct_one, right_hex), 0x0.8))
        ASSERT(EQ(BASE(*(left_oct_one, right_hex)), 0d16))
  - name: mul-int
    language: Prefix
    source: |
        INT left_dec = 0d2
        INT right_bin = 0b11
        INT wide_hex = 0x10
        
        ASSERT(EQ(*(left_dec, right_bin), 0d6))
        ASSERT(EQ(BASE(*(left_dec, right_bin)), 0d10))
        
        ASSERT(EQ(*(wide_hex, left_dec), 0d32))
        ASSERT(EQ(BASE(*(wide_hex, left_dec)), 0d16))
  - name: mul-pointer-writeback
    language: Prefix
    source: |
        INT a1 = 0d2
        INT b1 = 0d3
        *(@a1, b1)
        ASSERT(EQ(a1, 0d6))
        
        INT a2 = 0d2
        INT b2 = 0d3
        *(a2, @b2)
        ASSERT(EQ(b2, 0d6))
        
        INT a3 = 0d2
        INT b3 = 0d3
        *(@a3, @b3)
        ASSERT(EQ(a3, 0d6))
        ASSERT(EQ(b3, 0d6))
        
        FLT f1 = 0d1.5
        FLT g1 = 0d2.0
        *(@f1, g1)
        ASSERT(EQ(f1, 0d3.0))
        
        FLT f2 = 0d1.5
        FLT g2 = 0d2.0
        *(f2, @g2)
        ASSERT(EQ(g2, 0d3.0))
        
        FLT f3 = 0d1.5
        FLT g3 = 0d2.0
        *(@f3, @g3)
        ASSERT(EQ(f3, 0d3.0))
        ASSERT(EQ(g3, 0d3.0))
        
  - name: sub-flt
    language: Prefix
    source: |
        FLT left_oct = 0o1.4
        FLT right_hex = 0x0.8
        FLT left_oct_one = 0o1.0
        
        ASSERT(EQ(-(left_oct_one, right_hex), 0x0.8))
        ASSERT(EQ(BASE(-(left_oct_one, right_hex)), 0d16))
        
        ASSERT(EQ(-(left_oct, right_hex), 0x1.0))
        ASSERT(EQ(BASE(-(left_oct, right_hex)), 0d16))
  - name: sub-int
    language: Prefix
    source: |
        INT left_dec = 0d2
        INT right_bin = 0b11
        INT wide_hex = 0x10
        
        ASSERT(EQ(-(right_bin, left_dec), 0d1))
        ASSERT(EQ(BASE(-(right_bin, left_dec)), 0d10))
        
        ASSERT(EQ(-(left_dec, right_bin), -0d1))
        ASSERT(EQ(BASE(-(left_dec, right_bin)), 0d10))
        
        ASSERT(EQ(-(wide_hex, left_dec), 0d14))
        ASSERT(EQ(BASE(-(wide_hex, left_dec)), 0d16))
  - name: sub-pointer-writeback
    language: Prefix
    source: |
        INT a1 = 0d5
        INT b1 = 0d3
        -(@a1, b1)
        ASSERT(EQ(a1, 0d2))
        
        FLT f1 = 0d5.5
        FLT g1 = 0d1.25
        -(@f1, g1)
        ASSERT(EQ(f1, 0d4.25))
        
failing:
  - name: add-mixed-types
    language: Prefix
    source: |
        +(0d1, 0d1.0)
        
  - name: div-zero-flt
    language: Prefix
    source: |
        /(0o1.0, 0x0.0)
        
  - name: div-zero-int
    language: Prefix
    source: |
        /(0d1, 0d0)
        
