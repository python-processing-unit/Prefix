passing:
  - name: fadd-pointer-writeback
    language: Prefix
    source: |
        float f1 = 0d10.5
        float g1 = 0d5.25
        f+(@f1, g1)
        assert(eq(f1, 0d15.75))
        
        float f2 = 0d10.5
        float g2 = 0d5.25
        f+(f2, @g2)
        assert(eq(g2, 0d15.75))
        
        float f3 = 0d10.5
        float g3 = 0d5.25
        f+(@f3, @g3)
        assert(eq(f3, 0d15.75))
        assert(eq(g3, 0d15.75))
        
  - name: fadd
    language: Prefix
    source: |
        ! Passing float arithmetic, checking coercion and correct logic
        float result_add = f+(0d10.5, 0d5.25)
        assert(eq(result_add, 0d15.75))
        
  - name: fdiv-pointer-writeback
    language: Prefix
    source: |
        float f1 = 0d6.0
        float g1 = 0d3.0
        f/(@f1, g1)
        assert(eq(f1, 0d2.0))
        
  - name: fdiv
    language: Prefix
    source: |
        int a = i+(0d1, 0d1.0)
        float b = f/(0d1.0, 0d1.0)
        float x = 0d1.0
        float y = 0d0.5
        float result_div = f/(x, y)
        assert(eq(result_div, 0d2.0))
        float c = fpow(-0d1.0, 0d0.5)
        
  - name: fmul-pointer-writeback
    language: Prefix
    source: |
        float f1 = 0d2.5
        float g1 = 0d4.0
        f*(@f1, g1)
        assert(eq(f1, 0d10.0))
        
        float f2 = 0d2.5
        float g2 = 0d4.0
        f*(f2, @g2)
        assert(eq(g2, 0d10.0))
        
        float f3 = 0d2.5
        float g3 = 0d4.0
        f*(@f3, @g3)
        assert(eq(f3, 0d10.0))
        assert(eq(g3, 0d10.0))
        
  - name: fmul
    language: Prefix
    source: |
        ! Passing float arithmetic, checking coercion and correct logic
        float result_mul = f*(0d4.25, 0d2.0)
        assert(eq(result_mul, 0d8.5))
        
  - name: fpow
    language: Prefix
    source: |
        ! Passing float arithmetic, checking coercion and correct logic
        float result_pow = fpow(0d2.5, 0d2.0)
        assert(eq(result_pow, 0d6.25))
        
  - name: fsub-pointer-writeback
    language: Prefix
    source: |
        float f1 = 0d10.5
        float g1 = 0d5.25
        f-(@f1, g1)
        assert(eq(f1, 0d5.25))
        
  - name: fsub
    language: Prefix
    source: |
        ! Passing float arithmetic, checking coercion and correct logic
        float result_sub = f-(0d10.0, 0d2)
        assert(eq(result_sub, 0d8.0))
        
failing:
  - name: fdiv
    language: Prefix
    source: |
        ! Division by zero for f/ must raise a runtime error per specification
        _ = f/(0d1.0, 0d0.0)
        
