passing:
  - name: gcd-flt
    language: Prefix
    source: |
        float left_dec = 0d54.0
        float right_hex = 0x18.0
        float zero_oct = 0o0.0
        float co_prime_left_oct = 0o17.0
        float co_prime_right_dec = 0d13.0
        
        assert(eq(gcd(left_dec, right_hex), 0x6.0))
        assert(eq(gcd(right_hex, left_dec), 0x6.0))
        assert(isfloat(gcd(left_dec, right_hex)))
        assert(eq(BASE(gcd(left_dec, right_hex)), 0d16))
        
        assert(eq(gcd(zero_oct, right_hex), 0x18.0))
        assert(eq(BASE(gcd(zero_oct, right_hex)), 0d16))
        
        assert(eq(gcd(co_prime_left_oct, co_prime_right_dec), 0d1.0))
        assert(eq(BASE(gcd(co_prime_left_oct, co_prime_right_dec)), 0d10))
        
  - name: gcd-int
    language: Prefix
    source: |
        int left_dec = 0d54
        int right_hex = 0x18
        int zero_bin = 0b0
        int co_prime_left_oct = 0o17
        int co_prime_right_dec = 0d13
        
        assert(eq(gcd(left_dec, right_hex), 0x6))
        assert(eq(gcd(right_hex, left_dec), 0x6))
        assert(isint(gcd(left_dec, right_hex)))
        assert(eq(BASE(gcd(left_dec, right_hex)), 0d16))
        
        assert(eq(gcd(zero_bin, right_hex), 0x18))
        assert(eq(BASE(gcd(zero_bin, right_hex)), 0d16))
        
        assert(eq(gcd(co_prime_left_oct, co_prime_right_dec), 0d1))
        assert(eq(BASE(gcd(co_prime_left_oct, co_prime_right_dec)), 0d10))
        
  - name: lcm-flt
    language: Prefix
    source: |
        float left_oct = 0o25.0
        float right_hex = 0x6.0
        float zero_bin = 0b0.0
        float co_prime_left_oct = 0o10.0
        float co_prime_right_dec = 0d9.0
        
        assert(eq(lcm(left_oct, right_hex), 0x2A.0))
        assert(eq(lcm(right_hex, left_oct), 0x2A.0))
        assert(isfloat(lcm(left_oct, right_hex)))
        assert(eq(BASE(lcm(left_oct, right_hex)), 0d16))
        
        assert(eq(lcm(zero_bin, right_hex), 0x0.0))
        assert(eq(BASE(lcm(zero_bin, right_hex)), 0d16))
        
        assert(eq(lcm(co_prime_left_oct, co_prime_right_dec), 0d72.0))
        assert(eq(BASE(lcm(co_prime_left_oct, co_prime_right_dec)), 0d10))
        
  - name: lcm-int
    language: Prefix
    source: |
        int left_oct = 0o25
        int right_hex = 0x6
        int zero_bin = 0b0
        int co_prime_left_oct = 0o10
        int co_prime_right_dec = 0d9
        
        assert(eq(lcm(left_oct, right_hex), 0x2A))
        assert(eq(lcm(right_hex, left_oct), 0x2A))
        assert(isint(lcm(left_oct, right_hex)))
        assert(eq(BASE(lcm(left_oct, right_hex)), 0d16))
        
        assert(eq(lcm(zero_bin, right_hex), 0x0))
        assert(eq(BASE(lcm(zero_bin, right_hex)), 0d16))
        
        assert(eq(lcm(co_prime_left_oct, co_prime_right_dec), 0d72))
        assert(eq(BASE(lcm(co_prime_left_oct, co_prime_right_dec)), 0d10))
        
