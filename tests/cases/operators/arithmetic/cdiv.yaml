passing:
  - name: cdiv-flt
    language: Prefix
    source: |
        float left_oct = 0o1.4
        float right_hex = 0x0.8
        float wide_oct = 0o5.0
        
        ASSERT(EQ(CDIV(left_oct, right_hex), 0x3.0))
        ASSERT(EQ(BASE(CDIV(left_oct, right_hex)), 0d16))
        
        ASSERT(EQ(CDIV(wide_oct, right_hex), 0xA.0))
        ASSERT(EQ(BASE(CDIV(wide_oct, right_hex)), 0d16))
  - name: cdiv-int
    language: Prefix
    source: |
        int left_bin = 0b111
        int right_hex = 0x2
        int wide_dec = 0d9
        
        ASSERT(EQ(CDIV(left_bin, right_hex), 0x4))
        ASSERT(EQ(BASE(CDIV(left_bin, right_hex)), 0d16))
        
        ASSERT(EQ(CDIV(wide_dec, right_hex), 0x5))
        ASSERT(EQ(BASE(CDIV(wide_dec, right_hex)), 0d16))
  - name: cdiv-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d5
        int b1 = 0d2
        CDIV(@a1, b1)
        ASSERT(EQ(a1, 0d3))
        
        int a2 = 0d5
        int b2 = 0d2
        CDIV(a2, @b2)
        ASSERT(EQ(b2, 0d3))
        
        int a3 = 0d5
        int b3 = 0d2
        CDIV(@a3, @b3)
        ASSERT(EQ(a3, 0d3))
        ASSERT(EQ(b3, 0d3))
        
        float f1 = 0d5.0
        float g1 = 0d2.0
        CDIV(@f1, g1)
        ASSERT(EQ(f1, 0d3.0))
        
        float f2 = 0d5.0
        float g2 = 0d2.0
        CDIV(f2, @g2)
        ASSERT(EQ(g2, 0d3.0))
        
        float f3 = 0d5.0
        float g3 = 0d2.0
        CDIV(@f3, @g3)
        ASSERT(EQ(f3, 0d3.0))
        ASSERT(EQ(g3, 0d3.0))
        
