passing:
  - name: cdiv-flt
    language: Prefix
    source: |
        float left_oct = 0o1.4
        float right_hex = 0x0.8
        float wide_oct = 0o5.0
        
        assert(eq(cdiv(left_oct, right_hex), 0x3.0))
        assert(eq(BASE(cdiv(left_oct, right_hex)), 0d16))
        
        assert(eq(cdiv(wide_oct, right_hex), 0xA.0))
        assert(eq(BASE(cdiv(wide_oct, right_hex)), 0d16))
  - name: cdiv-int
    language: Prefix
    source: |
        int left_bin = 0b111
        int right_hex = 0x2
        int wide_dec = 0d9
        
        assert(eq(cdiv(left_bin, right_hex), 0x4))
        assert(eq(BASE(cdiv(left_bin, right_hex)), 0d16))
        
        assert(eq(cdiv(wide_dec, right_hex), 0x5))
        assert(eq(BASE(cdiv(wide_dec, right_hex)), 0d16))
  - name: cdiv-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d5
        int b1 = 0d2
        cdiv(@a1, b1)
        assert(eq(a1, 0d3))
        
        int a2 = 0d5
        int b2 = 0d2
        cdiv(a2, @b2)
        assert(eq(b2, 0d3))
        
        int a3 = 0d5
        int b3 = 0d2
        cdiv(@a3, @b3)
        assert(eq(a3, 0d3))
        assert(eq(b3, 0d3))
        
        float f1 = 0d5.0
        float g1 = 0d2.0
        cdiv(@f1, g1)
        assert(eq(f1, 0d3.0))
        
        float f2 = 0d5.0
        float g2 = 0d2.0
        cdiv(f2, @g2)
        assert(eq(g2, 0d3.0))
        
        float f3 = 0d5.0
        float g3 = 0d2.0
        cdiv(@f3, @g3)
        assert(eq(f3, 0d3.0))
        assert(eq(g3, 0d3.0))
        
failing:
  - name: cdiv-zero-flt
    language: Prefix
    source: 'cdiv(0o1.0, 0x0.0)'
  - name: cdiv-zero-int
    language: Prefix
    source: 'cdiv(0d1, 0d0)'
