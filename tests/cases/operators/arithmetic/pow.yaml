passing:
  - name: pow-flt
    language: Prefix
    source: |
        FLT left_oct = 0o1.4
        FLT right_hex = 0x2.0
        FLT wide_oct = 0o2.0
        
        ASSERT(EQ(POW(left_oct, right_hex), 0x2.4))
        ASSERT(EQ(BASE(POW(left_oct, right_hex)), 0d16))
        
        ASSERT(EQ(POW(wide_oct, 0x3.0), 0x8.0))
        ASSERT(EQ(BASE(POW(wide_oct, 0x3.0)), 0d16))
  - name: pow-int
    language: Prefix
    source: |
        INT two = 0d2
        INT three = 0b11
        INT four_hex = 0x4
        
        ASSERT(EQ(POW(two, three), 0d8))
        ASSERT(EQ(BASE(POW(two, three)), 0d10))
        
        ASSERT(EQ(POW(four_hex, 0d2), 0x10))
        ASSERT(EQ(BASE(POW(four_hex, 0d2)), 0d16))
  - name: pow-pointer-writeback
    language: Prefix
    source: |
        INT a1 = 0d2
        INT b1 = 0d3
        POW(@a1, b1)
        ASSERT(EQ(a1, 0d8))
        
        INT a2 = 0d2
        INT b2 = 0d3
        POW(a2, @b2)
        ASSERT(EQ(b2, 0d3))
        
        INT a3 = 0d2
        INT b3 = 0d3
        POW(@a3, @b3)
        ASSERT(EQ(a3, 0d8))
        ASSERT(EQ(b3, 0d3))
        
        FLT f1 = 0d1.5
        FLT g1 = 0d2.0
        POW(@f1, g1)
        ASSERT(EQ(f1, 0d2.25))
        
        FLT f2 = 0d1.5
        FLT g2 = 0d2.0
        POW(f2, @g2)
        ASSERT(EQ(g2, 0d2.0))
        
        FLT f3 = 0d1.5
        FLT g3 = 0d2.0
        POW(@f3, @g3)
        ASSERT(EQ(f3, 0d2.25))
        ASSERT(EQ(g3, 0d2.0))
        
failing:
  - name: pow-mixed-types
    language: Prefix
    source: 'POW(0d2, 0d3.0)'
