passing:
  - name: pow-flt
    language: Prefix
    source: |
        float left_oct = 0o1.4
        float right_hex = 0x2.0
        float wide_oct = 0o2.0
        
        assert(eq(pow(left_oct, right_hex), 0x2.4))
        assert(eq(BASE(pow(left_oct, right_hex)), 0d16))
        
        assert(eq(pow(wide_oct, 0x3.0), 0x8.0))
        assert(eq(BASE(pow(wide_oct, 0x3.0)), 0d16))
  - name: pow-int
    language: Prefix
    source: |
        int two = 0d2
        int three = 0b11
        int four_hex = 0x4
        
        assert(eq(pow(two, three), 0d8))
        assert(eq(BASE(pow(two, three)), 0d10))
        
        assert(eq(pow(four_hex, 0d2), 0x10))
        assert(eq(BASE(pow(four_hex, 0d2)), 0d16))
  - name: pow-pointer-writeback
    language: Prefix
    source: |
        int a1 = 0d2
        int b1 = 0d3
        pow(@a1, b1)
        assert(eq(a1, 0d8))
        
        int a2 = 0d2
        int b2 = 0d3
        pow(a2, @b2)
        assert(eq(b2, 0d3))
        
        int a3 = 0d2
        int b3 = 0d3
        pow(@a3, @b3)
        assert(eq(a3, 0d8))
        assert(eq(b3, 0d3))
        
        float f1 = 0d1.5
        float g1 = 0d2.0
        pow(@f1, g1)
        assert(eq(f1, 0d2.25))
        
        float f2 = 0d1.5
        float g2 = 0d2.0
        pow(f2, @g2)
        assert(eq(g2, 0d2.0))
        
        float f3 = 0d1.5
        float g3 = 0d2.0
        pow(@f3, @g3)
        assert(eq(f3, 0d2.25))
        assert(eq(g3, 0d2.0))
        
failing:
  - name: pow-mixed-types
    language: Prefix
    source: 'pow(0d2, 0d3.0)'
