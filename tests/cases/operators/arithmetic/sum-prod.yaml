passing:
  - name: fprod-base
    language: Prefix
    source: |
        ! fproduct result uses the highest numeric base present among operands
        float result = fproduct(0d2, 0x3.0)
        
        assert(eq(result, 0x6.0))
        assert(eq(BASE(result), 0d16))
  - name: fprod-inf
    language: Prefix
    source: |
        ! fproduct preserves INF under float arithmetic
        float result = fproduct(INF, 0d2.0)
        assert(eq(result, INF))
  - name: fprod-mixed
    language: Prefix
    source: |
        ! fproduct coerces mixed numeric inputs to float before multiplying
        float result = fproduct(0d2, 0d3.5, 0d4)
        assert(eq(result, 0d28.0))
  - name: fprod-single-int
    language: Prefix
    source: |
        ! fproduct coerces a single int argument to float
        float result = fproduct(0d3)
        assert(eq(result, 0d3.0))
  - name: fsum-inf
    language: Prefix
    source: |
        ! fsum preserves INF under float arithmetic
        float result = fsum(INF, 0d1.0)
        assert(eq(result, INF))
        
  - name: fsum
    language: Prefix
    source: |
        ! fsum coerces mixed numeric inputs to float
        float result = fsum(0d1, 0d2.5, 0d3)
        assert(eq(result, 0d6.5))
        
  - name: iprod
    language: Prefix
    source: |
        ! iproduct coerces inputs to int before multiplying
        int result = iproduct(0d2.9, 0d3.1)
        assert(eq(result, 0d6))
        
  - name: isum-trunc
    language: Prefix
    source: |
        ! isum truncates floating-point inputs toward zero
        int result = isum(0d1.9, 0d2.1, -0d0.9)
        assert(eq(result, 0d3))
        
  - name: prod-flt
    language: Prefix
    source: |
        ! product with two float arguments
        float result = product(0d1.5, 0d2.0)
        assert(eq(result, 0d3.0))
        
  - name: prod-int
    language: Prefix
    source: |
        ! product with three int arguments
        int result = product(0d2, 0d3, 0d1)
        assert(eq(result, 0d6))
        
  - name: sum-flt
    language: Prefix
    source: |
        ! sum with two float arguments
        float result = sum(0d1.5, 0d2.5)
        assert(eq(result, 0d4.0))
        
  - name: sum-int
    language: Prefix
    source: |
        ! sum with three int arguments
        int result = sum(0d1, 0d2, 0d3)
        assert(eq(result, 0d6))
        
failing:
  - name: fprod-arity-zero
    language: Prefix
    source: fproduct()
  - name: fprod-bool
    language: Prefix
    source: 'fproduct(true, 0d1)'
  - name: fprod-str
    language: Prefix
    source: 'fproduct("1.0", 0d1)'
  - name: fsum-str
    language: Prefix
    source: |
        fsum('1.0', 0d1)
        
  - name: prod-mixed
    language: Prefix
    source: |
        product(0d2, 0d2.0)
        
  - name: sum-mixed
    language: Prefix
    source: |
        sum(0d1, 0d2.0)
        
  - name: sum-str
    language: Prefix
    source: |
        sum('1', 0d1)
        
