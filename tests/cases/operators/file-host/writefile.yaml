passing:
  - name: writefile-ansi
    language: Prefix
    source: |
        import("path")
        
        str p = path.temp_file("prefix-writefile-ansi.txt")
        
        assert(write_file("Prefix", p, coding = "ANSI"))
        assert(eq(read_file(p, coding = "ANSI"), "Prefix"))
        
  - name: writefile-bin-alias
    language: Prefix
    source: |
        import("path")
        
        str p = path.temp_file("prefix-writefile-bin.bin")
        
        assert(write_file("0100000101111010", p, coding = "bin"))
        assert(eq(read_file(p, coding = "bin"), "0100000101111010"))
        assert(eq(read_file(p), "Az"))
        
  - name: writefile-binary
    language: Prefix
    source: |
        import("path")
        
        str p = path.temp_file("prefix-writefile-binary.bin")
        
        assert(write_file("0100000101111010", p, coding = "binary"))
        assert(eq(read_file(p, coding = "binary"), "0100000101111010"))
        assert(eq(read_file(p), "Az"))
        
  - name: writefile-fail-dir
    language: Prefix
    source: |
        import("path")
        
        str d = path.temp_file("prefix-writefile-fail-dir")
        
        if(eq(os(),"win")){
            assert(eq(cl(join("powershell -NoProfile -NonInteractive -Command \"New-Item -ItemType Directory -Force -Path '", path.windows_path(d), "'\"")), 0d0))
        } else {
            assert(eq(cl(join("mkdir -p ", d)), 0d0))
        }
        
        refute(write_file("x", d))
        
  - name: writefile-hex
    language: Prefix
    source: |
        import("path")
        
        str p = path.temp_file("prefix-writefile-hex.bin")
        
        assert(write_file("507265666978", p, coding = "hex"))
        assert(eq(read_file(p), "Prefix"))
        assert(eq(read_file(p, coding = "hexadecimal"), "507265666978"))
        
