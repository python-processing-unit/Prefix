passing:
  - name: argv-elements-str
    language: Prefix
    source: |
        tensor args = argv()
        
        for(i, len_dim(args, 0d1)){
            assert(isstr(args[i]))
        }
  - name: argv-order-program-arg-last
    language: Prefix
    source: |
        ! ARGV_LAST_ARG_SELF_FILE_MARKER
        str source = replace(read_file(argv()[-0d1]), "\r", "")
        
        assert(in("! ARGV_LAST_ARG_SELF_FILE_MARKER", split(source, "\n")))
  - name: argv-rank-1
    language: Prefix
    source: |
        assert(eq(type(shape(argv())), "tensor"))
        assert(eq(len_dim(shape(argv()), 0d1), 0d1))
  - name: argv-return-type
    language: Prefix
    source: 'assert(eq(type(argv()), "tensor"))'
failing:
  - name: argv-arity-one
    language: Prefix
    source: argv("extra")
