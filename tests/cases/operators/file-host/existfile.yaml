passing:
  - name: existfile
    language: Prefix
    source: |
        import("path")
        
        assert(exist_file(join(path.script_dir, "/plain.txt")))
        refute(exist_file(join(path.script_dir, "/nonexistent.txt")))
failing:
  - name: existfile-arity-two
    language: Prefix
    source: |
        import("path")
        
        exist_file(path.script_dir, "/plain.txt")
  - name: existfile-arity-zero
    language: Prefix
    source: exist_file()
  - name: existfile-bool
    language: Prefix
    source: exist_file(true)
  - name: existfile-flt
    language: Prefix
    source: exist_file(0d1.0)
  - name: existfile-func
    language: Prefix
    source: 'exist_file(LAMBDA bool: (){})'
  - name: existfile-int
    language: Prefix
    source: exist_file(0d1)
  - name: existfile-map
    language: Prefix
    source: exist_file(<>)
  - name: existfile-thr
    language: Prefix
    source: exist_file(async{})
  - name: existfile-tns
    language: Prefix
    source: exist_file([0d1])
