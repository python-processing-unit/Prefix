passing:
  - name: keyin-basic
    language: Prefix
    source: |
        map m = <"a" = 0d1, "b" = 0d2>
        
        assert(key_in("a", m))
        assert(not(key_in("missing", m)))
        assert(eq(type(key_in("a", m)), "bool"))
        
  - name: keyin-key-types
    language: Prefix
    source: |
        map m = <0d1 = "int", 0d2.5 = "flt", "three" = "str">
        
        assert(key_in(0d1, m))
        assert(key_in(0d2.5, m))
        assert(key_in("three", m))
        refute(key_in(0d1.0, m))
        refute(key_in("0d1", m))
        
  - name: valuein-any-type
    language: Prefix
    source: |
        map bool_map = <"t" = true, "f" = false>
        map int_map = <"i" = 0d7>
        map flt_map = <"p" = 0d2.5>
        map str_map = <"s" = "text">
        map tns_map = <"vec" = [0d1, 0d2]>
        
        assert(VALUEIN(true, bool_map))
        assert(VALUEIN(0d7, int_map))
        assert(VALUEIN(0d2.5, flt_map))
        assert(VALUEIN("text", str_map))
        assert(VALUEIN([0d1, 0d2], tns_map))
        refute(VALUEIN([0d2, 0d1], tns_map))
        
  - name: valuein-basic
    language: Prefix
    source: |
        map m = <"x" = "cat", "y" = "dog">
        
        assert(VALUEIN("cat", m))
        refute(VALUEIN("bird", m))
        assert(eq(type(VALUEIN("cat", m)), "bool"))
        
