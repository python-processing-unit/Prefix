passing:
  - name: keyin-basic
    language: Prefix
    source: |
        MAP m = <"a" = 0d1, "b" = 0d2>
        
        ASSERT(KEYIN("a", m))
        ASSERT(NOT(KEYIN("missing", m)))
        ASSERT(EQ(TYPE(KEYIN("a", m)), "BOOL"))
        
  - name: keyin-key-types
    language: Prefix
    source: |
        MAP m = <0d1 = "int", 0d2.5 = "flt", "three" = "str">
        
        ASSERT(KEYIN(0d1, m))
        ASSERT(KEYIN(0d2.5, m))
        ASSERT(KEYIN("three", m))
        REFUTE(KEYIN(0d1.0, m))
        REFUTE(KEYIN("0d1", m))
        
  - name: valuein-any-type
    language: Prefix
    source: |
        MAP bool_map = <"t" = TRUE, "f" = FALSE>
        MAP int_map = <"i" = 0d7>
        MAP flt_map = <"p" = 0d2.5>
        MAP str_map = <"s" = "text">
        MAP tns_map = <"vec" = [0d1, 0d2]>
        
        ASSERT(VALUEIN(TRUE, bool_map))
        ASSERT(VALUEIN(0d7, int_map))
        ASSERT(VALUEIN(0d2.5, flt_map))
        ASSERT(VALUEIN("text", str_map))
        ASSERT(VALUEIN([0d1, 0d2], tns_map))
        REFUTE(VALUEIN([0d2, 0d1], tns_map))
        
  - name: valuein-basic
    language: Prefix
    source: |
        MAP m = <"x" = "cat", "y" = "dog">
        
        ASSERT(VALUEIN("cat", m))
        REFUTE(VALUEIN("bird", m))
        ASSERT(EQ(TYPE(VALUEIN("cat", m)), "BOOL"))
        
