passing:
  - name: match-basic
    language: Prefix
    source: |
        map candidate = <"alpha" = 0d1, "beta" = "dog">
        
        ASSERT(MATCH(candidate, <>))
        ASSERT(MATCH(candidate, <"alpha" = 0d99>))
        ASSERT(MATCH(candidate, <"alpha" = "ignored", "beta" = 0d0>))
        REFUTE(MATCH(candidate, <"gamma" = 0d0>))
        ASSERT(EQ(TYPE(MATCH(candidate, <"alpha" = 0d0>)), "bool"))
        
  - name: match-metadata
    language: Prefix
    source: |
        map typed_candidate = <"value" = 0d1, "other" = "text">
        map typed_schema = <"match" = <"typing" = 0d1>, "value" = 0d1>
        map typed_mismatch_schema = <"match" = <"typing" = 0d1>, "value" = "ignored">
        
        map missing_candidate = <"outer" = <"present" = 0d1>>
        map missing_schema = <"match" = <"recurse" = 0d1>, "outer" = <"missing" = 0d1>>
        
        map shape_candidate = <"tensor" = [[0d1, 0d2], [0d3, 0d4]]>
        map shape_schema = <"match" = <"shape" = 0d1>, "tensor" = [0d9, 0d8, 0d7, 0d6]>
        
        map explicit_typing_candidate = <"value" = 0d1>
        map explicit_typing_schema = <"match" = <"typing" = 0d1>, "value" = "ignored">
        
        map explicit_recurse_candidate = <"outer" = <"present" = 0d1>>
        map explicit_recurse_schema = <"match" = <"recurse" = 0d1>, "outer" = <"missing" = 0d1>>
        
        map explicit_shape_candidate = <"tensor" = [[0d1, 0d2], [0d3, 0d4]]>
        map explicit_shape_schema = <"match" = <"shape" = 0d1>, "tensor" = [0d9, 0d8, 0d7, 0d6]>
        
        map nested_candidate = <"outer" = <"value" = 0d1>>
        map nested_schema = <"outer" = <"match" = <"typing" = 0d1>, "value" = 0d1>>
        map nested_mismatch_schema = <"outer" = <"match" = <"typing" = 0d1>, "value" = "ignored">>
        
        map normal_match_candidate = <"match" = "same", "other" = 0d1>
        map normal_match_schema = <"match" = "same">
        
        ASSERT(MATCH(typed_candidate, typed_schema))
        REFUTE(MATCH(typed_candidate, typed_mismatch_schema))
        ASSERT(MATCH(typed_candidate, <"match" = <"typing" = 0d0>, "value" = "ignored">))
        REFUTE(MATCH(missing_candidate, missing_schema))
        REFUTE(MATCH(shape_candidate, shape_schema))
        
        ASSERT(MATCH(explicit_typing_candidate, explicit_typing_schema, typing = 0d0))
        REFUTE(MATCH(explicit_typing_candidate, explicit_typing_schema, typing = 0d1))
        ASSERT(MATCH(explicit_recurse_candidate, explicit_recurse_schema, recurse = 0d0))
        REFUTE(MATCH(explicit_recurse_candidate, explicit_recurse_schema, recurse = 0d1))
        ASSERT(MATCH(explicit_shape_candidate, explicit_shape_schema, shape = 0d0))
        REFUTE(MATCH(explicit_shape_candidate, explicit_shape_schema, shape = 0d1))
        
        ASSERT(MATCH(nested_candidate, nested_schema, recurse = 0d1))
        REFUTE(MATCH(nested_candidate, nested_mismatch_schema, recurse = 0d1))
        ASSERT(MATCH(nested_candidate, nested_mismatch_schema, recurse = 0d1, typing = 0d0))
        ASSERT(MATCH(nested_candidate, nested_mismatch_schema, recurse = 0d0))
        
        ASSERT(MATCH(normal_match_candidate, normal_match_schema))
        REFUTE(MATCH(<"other" = 0d1>, normal_match_schema))
        
        REFUTE(MATCH(<>, <"match" = "not metadata">))
        REFUTE(MATCH(<>, <"match" = <"typing" = "bad">>))
        REFUTE(MATCH(<>, <"match" = <"unknown" = 0d1>>))
        ASSERT(MATCH(<>, <"match" = <"typing" = -0d1>>))
        ASSERT(MATCH(<>, <"match" = <>>))
        
  - name: match-recurse
    language: Prefix
    source: |
        map missing_candidate = <"outer" = <"present" = 0d1>>
        map missing_schema = <"outer" = <"missing" = 0d1>>
        
        map type_candidate = <"outer" = <"value" = 0d1>>
        map type_schema = <"outer" = <"value" = "x">>
        
        map shape_candidate = <"outer" = <"tensor" = [[0d1, 0d2], [0d3, 0d4]]>>
        map shape_schema = <"outer" = <"tensor" = [0d9, 0d8, 0d7, 0d6]>>
        
        ASSERT(MATCH(missing_candidate, missing_schema))
        REFUTE(MATCH(missing_candidate, missing_schema, recurse = 0d1))
        
        ASSERT(MATCH(type_candidate, type_schema, typing = 0d1))
        ASSERT(MATCH(type_candidate, type_schema, recurse = 0d1))
        REFUTE(MATCH(type_candidate, type_schema, typing = 0d1, recurse = -0d1))
        
        ASSERT(MATCH(shape_candidate, shape_schema, shape = 0d1))
        ASSERT(MATCH(shape_candidate, shape_schema, recurse = 0d1))
        REFUTE(MATCH(shape_candidate, shape_schema, shape = 0d1, recurse = 0d1))
        
  - name: match-shape
    language: Prefix
    source: |
        map candidate = <"tensor" = [[0d1, 0d2], [0d3, 0d4]], "scalar" = 0d1>
        
        ASSERT(MATCH(candidate, <"tensor" = [0d9, 0d8, 0d7, 0d6]>))
        ASSERT(MATCH(candidate, <"tensor" = [[0d9, 0d8], [0d7, 0d6]]>, shape = 0d1))
        REFUTE(MATCH(candidate, <"tensor" = [0d9, 0d8, 0d7, 0d6]>, shape = -0d1))
        ASSERT(MATCH(candidate, <"scalar" = "different type">, shape = 0d1))
        
  - name: match-typing
    language: Prefix
    source: |
        map candidate = <"value" = 0d1, "other" = "text">
        
        ASSERT(MATCH(candidate, <"value" = "1">))
        ASSERT(MATCH(candidate, <"value" = 0d99>, typing = 0d1))
        ASSERT(MATCH(candidate, <"other" = "different">, typing = 0d7))
        REFUTE(MATCH(candidate, <"value" = "1">, typing = -0d1))
        
