passing:
  - name: keys-insertion-order
    language: Prefix
    source: |
        map m = <"alpha" = 0d1, "beta" = 0d2, "gamma" = 0d3>
        
        ASSERT(EQ(KEYS(m), ["alpha", "beta", "gamma"]))
        
  - name: keys-mixed-key-types
    language: Prefix
    source: |
        map m = <0d1 = "one", 0d2.5 = "two_point_five", "three" = "three">
        
        ASSERT(EQ(KEYS(m), [0d1, 0d2.5, "three"]))
        
  - name: keys-result-is-1d
    language: Prefix
    source: |
        map m = <"x" = 0d1, "y" = 0d2>
        
        tensor k = KEYS(m)
        ASSERT(EQ(TYPE(k), "tensor"))
        ASSERT(EQ(SHAPE(k), [0d2]))
        
  - name: values-insertion-order
    language: Prefix
    source: |
        map m = <"alpha" = "first", "beta" = "second", "gamma" = "third">
        
        ASSERT(EQ(VALUES(m), ["first", "second", "third"]))
        
  - name: values-result-is-1d
    language: Prefix
    source: |
        map m = <0d1 = 0d10, 0d2 = 0d20, 0d3 = 0d30>
        
        ASSERT(EQ(VALUES(m), [0d10, 0d20, 0d30]))
        
