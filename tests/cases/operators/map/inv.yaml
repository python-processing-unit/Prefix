passing:
  - name: inv-basic
    language: Prefix
    source: 'assert(eq(invert(<"alpha" = "x", "beta" = "y">), <"x" = "alpha", "y" = "beta">))'
  - name: inv-empty
    language: Prefix
    source: 'assert(eq(invert(<>), <>))'
  - name: inv-pointer-writeback
    language: Prefix
    source: |
        map src = <"left" = "x", "right" = "y">
        
        invert(@src)
        
        assert(eq(src, <"x" = "left", "y" = "right">))
  - name: inv-return-type
    language: Prefix
    source: |
        assert(eq(type(invert(<"one" = 0d1>)), "map"))
        map m = <"a" = "x">
        assert(eq(type(invert(m)), "map"))
        
  - name: inv-source-unchanged
    language: Prefix
    source: |
        map src = <"left" = "x", "right" = "y">
        
        invert(src)
        
        assert(eq(src, <"left" = "x", "right" = "y">))
  - name: inv-value-flt
    language: Prefix
    source: 'assert(eq(invert(<"pi" = 0d3.5>), <0d3.5 = "pi">))'
  - name: inv-value-int
    language: Prefix
    source: 'assert(eq(invert(<"one" = 0d1>), <0d1 = "one">))'
  - name: inv-value-str
    language: Prefix
    source: 'assert(eq(invert(<"left" = "x">), <"x" = "left">))'
failing:
  - name: inv-arity-two
    language: Prefix
    source: 'invert(<"a" = "x">, <"b" = "y">)'
  - name: inv-arity-zero
    language: Prefix
    source: invert()
  - name: inv-bool
    language: Prefix
    source: invert(true)
  - name: inv-duplicate-values
    language: Prefix
    source: 'invert(<"a" = "dup", "b" = "dup">)'
  - name: inv-flt
    language: Prefix
    source: invert(0d1.5)
  - name: inv-func
    language: Prefix
    source: 'invert(LAMBDA int: (){})'
  - name: inv-int
    language: Prefix
    source: invert(0d1)
  - name: inv-str
    language: Prefix
    source: invert("map")
  - name: inv-thr
    language: Prefix
    source: invert(async{})
  - name: inv-tns
    language: Prefix
    source: invert([0d1])
  - name: inv-value-bool
    language: Prefix
    source: 'invert(<"a" = true>)'
  - name: inv-value-func
    language: Prefix
    source: 'invert(<"a" = LAMBDA int: (){}>)'
  - name: inv-value-map
    language: Prefix
    source: 'invert(<"a" = <"x" = 0d1>>)'
  - name: inv-value-thr
    language: Prefix
    source: 'invert(<"a" = async{}>)'
  - name: inv-value-tns
    language: Prefix
    source: 'invert(<"a" = [0d1]>)'
