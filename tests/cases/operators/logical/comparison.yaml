passing:
  - name: op-gt
    language: Prefix
    source: |
        assert(isbool(gt(0d2, 0d1)))
        assert(gt(0d2, 0d1))
        refute(gt(0d1, 0d1))
        assert(gt(0d1.5, 0d1.4))
        refute(gt(0d1.4, 0d1.5))
  - name: op-gte
    language: Prefix
    source: |
        assert(isbool(gte(0d2, 0d1)))
        assert(gte(0d2, 0d1))
        assert(gte(0d1, 0d1))
        refute(gte(0d1, 0d2))
        assert(gte(0d1.5, 0d1.4))
        assert(gte(0d1.4, 0d1.4))
        refute(gte(0d1.4, 0d1.5))
  - name: op-lt
    language: Prefix
    source: |
        assert(isbool(lt(0d1, 0d2)))
        assert(lt(0d1, 0d2))
        refute(lt(0d1, 0d1))
        assert(lt(0d1.4, 0d1.5))
        refute(lt(0d1.5, 0d1.4))
  - name: op-lte
    language: Prefix
    source: |
        assert(isbool(lte(0d1, 0d2)))
        assert(lte(0d1, 0d2))
        assert(lte(0d1, 0d1))
        refute(lte(0d2, 0d1))
        assert(lte(0d1.4, 0d1.5))
        assert(lte(0d1.4, 0d1.4))
        refute(lte(0d1.5, 0d1.4))
failing:
  - name: op-gt-mixed-type
    language: Prefix
    source: 'gt(0d2, 0d1.0)'
  - name: op-gte-mixed-type
    language: Prefix
    source: 'gte(0d2, 0d1.0)'
  - name: op-lt-mixed-type
    language: Prefix
    source: 'lt(0d1.0, 0d2)'
  - name: op-lte-mixed-type
    language: Prefix
    source: 'lte(0d1.0, 0d2)'
