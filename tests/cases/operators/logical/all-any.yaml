passing:
  - name: all
    language: Prefix
    source: |
        ASSERT(ALL(true, true))
        REFUTE(ALL(true, false))
        ASSERT(ALL(true, true, true))
        REFUTE(ALL(true, true, false))
        
  - name: any
    language: Prefix
    source: |
        ASSERT(NOT(ANY(false, false)))
        ASSERT(ANY(false, true))
        ASSERT(ANY(false, false, true))
        ASSERT(NOT(ANY(false, false, false)))
        
failing:
  - name: all-arity-zero
    language: Prefix
    source: ALL()
  - name: any-arity-zero
    language: Prefix
    source: ANY()
