passing:
  - name: band
    language: Prefix
    source: |
        assert(eq(band(0b1101, 0b1011), 0b1001))
        assert(eq(BASE(band(0b1101, 0b1011)), 0d2))
  - name: bnot
    language: Prefix
    source: |
        assert(eq(band(0b1010, BNOT(0b1010)), 0b0))
        assert(eq(BASE(BNOT(0b1010)), 0d2))
  - name: bor
    language: Prefix
    source: |
        assert(eq(bor(0b1100, 0b0011), 0b1111))
        assert(eq(BASE(bor(0b1100, 0b0011)), 0d2))
  - name: bxor
    language: Prefix
    source: |
        assert(eq(bxor(0b1100, 0b1010), 0b0110))
        assert(eq(BASE(bxor(0b1100, 0b1010)), 0d2))
  - name: shl
    language: Prefix
    source: |
        assert(eq(SHL(0b101, 0b10), 0b10100))
        assert(eq(BASE(SHL(0b101, 0b10)), 0d2))
  - name: shr
    language: Prefix
    source: |
        assert(eq(SHR(0b10100, 0b10), 0b101))
        assert(eq(BASE(SHR(0b10100, 0b10)), 0d2))
failing:
  - name: band-radix
    language: Prefix
    source: 'band(0b1, 0d1)'
  - name: bnot-radix
    language: Prefix
    source: BNOT(0o1)
  - name: bor-radix
    language: Prefix
    source: 'bor(0d1, 0b1)'
  - name: bxor-radix
    language: Prefix
    source: 'bxor(0b1, 0x1)'
  - name: shl-radix
    language: Prefix
    source: 'SHL(0b1, 0d1)'
  - name: shr-radix
    language: Prefix
    source: 'SHR(0x1, 0b1)'
