passing:
  - name: and
    language: Prefix
    source: |
        ASSERT(AND(true, true))
        REFUTE(AND(true, false))
        
  - name: or
    language: Prefix
    source: |
        REFUTE(OR(false, false))
        ASSERT(OR(false, true))
        
  - name: xor
    language: Prefix
    source: |
        REFUTE(XOR(false, false))
        ASSERT(XOR(true, false))
        
failing:
  - name: and-arity-three
    language: Prefix
    source: |
        AND(true, true, true)
        
  - name: and-arity-zero
    language: Prefix
    source: AND()
  - name: or-arity-three
    language: Prefix
    source: |
        OR(true, true, true)
        
  - name: or-arity-zero
    language: Prefix
    source: OR()
  - name: xor-arity-three
    language: Prefix
    source: |
        XOR(true, true, true)
        
  - name: xor-arity-zero
    language: Prefix
    source: XOR()
