passing:
  - name: and
    language: Prefix
    source: |
        assert(and(true, true))
        refute(and(true, false))
        
  - name: or
    language: Prefix
    source: |
        refute(or(false, false))
        assert(or(false, true))
        
  - name: xor
    language: Prefix
    source: |
        refute(xor(false, false))
        assert(xor(true, false))
        
failing:
  - name: and-arity-three
    language: Prefix
    source: |
        and(true, true, true)
        
  - name: and-arity-zero
    language: Prefix
    source: and()
  - name: or-arity-three
    language: Prefix
    source: |
        or(true, true, true)
        
  - name: or-arity-zero
    language: Prefix
    source: or()
  - name: xor-arity-three
    language: Prefix
    source: |
        xor(true, true, true)
        
  - name: xor-arity-zero
    language: Prefix
    source: xor()
