  - name: eq-structured
    language: Prefix
    source: |
        tensor tensor = [[0d1, 0d2], [0d3, 0d4]]
        tensor tensor_copy = tensor
        
        map map_value = <"alpha" = 0d1, "beta" = [0d2, 0d3]>
        map map_copy = map_value
        
        func int identity(int value){
            return(value)
        }
        func identity_alias = identity
        
        thread(worker){}
        
        assert(isbool(eq(tensor_copy, tensor)))
        assert(eq(tensor_copy, tensor))
        refute(eq(tensor, [[0d1, 0d2], [0d3, 0d5]]))
        
        assert(eq(map_copy, map_value))
        refute(eq(map_value, <"alpha" = 0d1, "beta" = [0d2, 0d4]>))
        
        assert(eq(identity_alias, identity))
        assert(eq(worker, worker))
  - name: neq-scalars
    language: Prefix
    source: |
        assert(isbool(neq(true, false)))
        assert(neq(true, false))
        refute(neq(true, true))
        
        assert(neq(0d42, 0d43))
        refute(neq(0d42, 0d42))
        
        assert(neq(0d1.5, 0d1.25))
        assert(neq(NaN, NaN))
        
        assert(neq("prefix", "Prefix"))
        refute(neq("prefix", "prefix"))
  - name: neq-structured
    language: Prefix
    source: |
        tensor tensor = [[0d1, 0d2], [0d3, 0d4]]
        tensor different_tensor = [[0d1, 0d2], [0d3, 0d5]]
        
        map map_value = <"alpha" = 0d1, "beta" = [0d2, 0d3]>
        map different_map = <"alpha" = 0d1, "beta" = [0d2, 0d4]>
        
        func int identity(int value){
            return(value)
        }
        func identity_alias = identity
        
        thread(worker){}
        thread(other){}
        
        assert(isbool(neq(tensor, different_tensor)))
        assert(neq(tensor, different_tensor))
        refute(neq(tensor, tensor))
        
        assert(neq(map_value, different_map))
        refute(neq(map_value, map_value))
        
        refute(neq(identity_alias, identity))
        refute(neq(worker, worker))
        assert(neq(worker, other))
