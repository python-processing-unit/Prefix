passing:
  - name: async-error-not-caught
    language: Prefix
    source: |
        bool caught = FALSE
        
        TRY{
            thread worker = ASYNC{
                FREEZE("not_declared")
            }
        } CATCH {
            caught = TRUE
        }
        
        REFUTE(caught)
        
        
        ! Also ensure awaiting the failed thread does not synchronously raise
        bool caught_await = FALSE
        
        thread worker2 = ASYNC{
            FREEZE("not_declared")
        }
        
        TRY{
            AWAIT(worker2)
        } CATCH {
            caught_await = TRUE
        }
        
        REFUTE(caught_await)
        
