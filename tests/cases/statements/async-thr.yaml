passing:
  - name: async-error-not-caught
    language: Prefix
    source: |
        bool caught = FALSE
        
        try{
            thread worker = async{
                FREEZE("not_declared")
            }
        } catch {
            caught = TRUE
        }
        
        REFUTE(caught)
        
        
        ! Also ensure awaiting the failed thread does not synchronously raise
        bool caught_await = FALSE
        
        thread worker2 = async{
            FREEZE("not_declared")
        }
        
        try{
            AWAIT(worker2)
        } catch {
            caught_await = TRUE
        }
        
        REFUTE(caught_await)
        
