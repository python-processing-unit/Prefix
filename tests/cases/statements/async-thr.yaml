passing:
  - name: async-error-not-caught
    language: Prefix
    source: |
        bool caught = false
        
        try{
            thread worker = async{
                lock("not_declared")
            }
        } catch {
            caught = true
        }
        
        refute(caught)
        
        
        ! Also ensure awaiting the failed thread does not synchronously raise
        bool caught_await = false
        
        thread worker2 = async{
            lock("not_declared")
        }
        
        try{
            await(worker2)
        } catch {
            caught_await = true
        }
        
        refute(caught_await)
        
