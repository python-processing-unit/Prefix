passing:
  - name: func-arguments
    language: Prefix
    source: |
        int order_trace = 0d0
        
        func int mark(int step){
            order_trace = +(*(order_trace, 0d10), step)
            RETURN(step)
        }
        
        func int place(int first, int second = 0d0){
            RETURN(+(*(first, 0d10), second))
        }
        
        order_trace = 0d0
        ASSERT(EQ(place(mark(0d1), second = mark(0d2)), 0d12))
        ASSERT(EQ(order_trace, 0d12))
        
        int outer_bonus = 0d1
        func int add_bonus(int value, int bonus = outer_bonus){
            RETURN(+(value, bonus))
        }
        
        ASSERT(EQ(add_bonus(0d2), 0d3))
        outer_bonus = 0d4
        ASSERT(EQ(add_bonus(0d2), 0d6))
        
        func int double_self(int value, int second = value){
            RETURN(+(value, second))
        }
        
        ASSERT(EQ(double_self(0d3), 0d6))
        ASSERT(EQ(double_self(0d3, second = 0d1), 0d4))
        
        func int accept_int(int value){
            RETURN(value)
        }
        
        func int coerce_int(~int value){
            RETURN(value)
        }
        
        ASSERT(EQ(coerce_int("0d11"), 0d11))
        
  - name: func-basics
    language: Prefix
    source: |
        func int add(int left, int right){
            RETURN(+(left, right))
        }
        
        ASSERT(EQ(add(0d2, 0d3), 0d5))
        
        func add_alias = add
        ASSERT(EQ(add_alias(0d4, 0d5), 0d9))
        
        func bool bool_default(){}
        func int int_default(){}
        func float flt_default(){}
        func str str_default(){}
        
        ASSERT(EQ(bool_default(), FALSE))
        ASSERT(EQ(int_default(), 0d0))
        ASSERT(EQ(flt_default(), 0d0.0))
        ASSERT(EQ(str_default(), ""))
        
        bool func_truthy = FALSE
        IF(add_alias){
            func_truthy = TRUE
        }
        ASSERT(func_truthy)
        
        int stop_flag = 0d0
        func int early_return(){
            RETURN(0d7)
            stop_flag = 0d1
        }
        
        ASSERT(EQ(early_return(), 0d7))
        ASSERT(EQ(stop_flag, 0d0))
        
  - name: func-call-errors
    language: Prefix
    source: |
        int runtime_errors = 0d0
        
        func int accept_int(int value){
            RETURN(value)
        }
        
        func int coerce_int(~int value){
            RETURN(value)
        }
        
        func int keyword_only(int left, int right = 0d0){
            RETURN(+(left, right))
        }
        
        TRY{
            accept_int("0d1")
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        TRY{
            keyword_only("0d1", "0d2", "0d3")
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        TRY{
            keyword_only("0d1", suffix = "!")
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        TRY{
            keyword_only("0d1", right = "0d2", right = "0d3")
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        ASSERT(EQ(runtime_errors, 0d4))
        
  - name: func-closures
    language: Prefix
    source: |
        int captured = 0d2
        
        func int read_captured(){
            RETURN(captured)
        }
        
        func add_captured = LAMBDA int (int delta){
            RETURN(+(captured, delta))
        }
        
        ASSERT(EQ(read_captured(), 0d2))
        ASSERT(EQ(add_captured(0d1), 0d3))
        captured = 0d5
        ASSERT(EQ(read_captured(), 0d5))
        ASSERT(EQ(add_captured(0d1), 0d6))
        
        func greeter = LAMBDA str (str name, str prefix = "Hi"){
            RETURN(JOIN(" ", prefix, name))
        }
        
        ASSERT(EQ(greeter("Prefix"), "Hi Prefix"))
        ASSERT(EQ(greeter("Prefix", prefix = "Hello"), "Hello Prefix"))
        
        ASSERT(EQ((LAMBDA int (int x){ RETURN(+(x, 0d1)) })(0d2), 0d3))
        
        func int invoke(func callable, int arg){
            RETURN(callable(arg))
        }
        
        ASSERT(EQ(invoke(add_captured, 0d2), 0d7))
        
        func func make_reader(int seed){
            RETURN(LAMBDA int (){
                RETURN(seed)
            })
        }
        
        func reader = make_reader(0d9)
        ASSERT(EQ(reader(), 0d9))
        
  - name: func-containers
    language: Prefix
    source: |
        tensor func_slots = [LAMBDA int (int left, int right){ RETURN(+(left, right)) }]
        ASSERT(EQ(func_slots[0d1](0d2, 0d3), 0d5))
        
        map func_map = <"sum" = func_slots[0d1]>
        ASSERT(EQ(func_map<"sum">(0d3, 0d4), 0d7))
        
        map method_map = < ^
            "install" = LAMBDA func (){ ^
                SELF<"tag"> = LAMBDA int (){ RETURN(0d7) } ^
                RETURN(SELF<"tag">) ^
            }, ^
            "seed" = LAMBDA int (){ RETURN(0d1) } ^
        >
        map method_copy = method_map
        map method_alias = @method_map
        
        ASSERT(EQ(method_copy<"install">()(), 0d7))
        bool copy_did_not_mutate_source = FALSE
        TRY{
            method_map<"tag">()
        } CATCH(err){
            copy_did_not_mutate_source = TRUE
        }
        ASSERT(copy_did_not_mutate_source)
        
        ASSERT(EQ(method_alias<"install">()(), 0d7))
        ASSERT(EQ(method_map<"tag">(), 0d7))
        
  - name: func-pop
    language: Prefix
    source: |
        int pop_target = 0d8
        
        func int take_and_delete(){
            POP("pop_target")
        }
        
        ASSERT(EQ(take_and_delete(), 0d8))
        bool pop_deleted = FALSE
        TRY{
            pop_target
        } CATCH(err){
            pop_deleted = TRUE
        }
        ASSERT(pop_deleted)
        
  - name: func-return-errors
    language: Prefix
    source: |
        int runtime_errors = 0d0
        
        func int wrong_return(){
            RETURN("bad")
        }
        
        TRY{
            wrong_return()
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        func tensor missing_tns_return(){}
        TRY{
            missing_tns_return()
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        func map missing_map_return(){}
        TRY{
            missing_map_return()
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        func func missing_func_return(){}
        TRY{
            missing_func_return()
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        func thread missing_thr_return(){}
        TRY{
            missing_thr_return()
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        func missing_lambda_return = LAMBDA func (){}
        TRY{
            missing_lambda_return()
        } CATCH(err){
            runtime_errors = +(runtime_errors, 0d1)
        }
        
        ASSERT(EQ(runtime_errors, 0d6))
        
