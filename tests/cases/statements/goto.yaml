passing:
  - name: goto-backward
    language: Prefix
    source: |
        int i = 0d0
        int hits = 0d0
        gotopoint('loop')
        +(@hits, 0d1)
        if(lt(i, 0d2)){
            +(@i, 0d1)
            goto('loop')
        }
        assert(eq(i, 0d2))
        assert(eq(hits, 0d3))
        
  - name: goto-cross-block
    language: Prefix
    source: |
        int test = 0d0
        if(true){
            goto('target')
            assert(false)
        }
        assert(false)
        gotopoint('target')
        assert(eq(test, 0d0))
        
  - name: goto-errors
    language: Prefix
    source: |
        int errors_caught = 0d0
        
        try {
            gotopoint(true)
        } catch(err) {
            assert(eq(err, 'gotopoint requires int or str argument'))
             +(@errors_caught, 0d1)
        }
        
        try {
            goto(true)
        } catch(err) {
            assert(eq(err, 'goto requires int or str argument'))
             +(@errors_caught, 0d1)
        }
        
        try {
            gotopoint(-0d1)
        } catch(err) {
            assert(eq(err, 'Negative gotopoint identifier is not allowed'))
             +(@errors_caught, 0d1)
        }
        
        try {
            goto(-0d1)
        } catch(err) {
            assert(eq(err, 'Negative goto target is not allowed'))
             +(@errors_caught, 0d1)
        }
        
        try {
            goto('unregistered')
        } catch(err) {
            assert(eq(err, 'Unregistered goto target'))
             +(@errors_caught, 0d1)
        }
        
        assert(eq(errors_caught, 0d5))
        
  - name: goto-forward
    language: Prefix
    source: |
        int value = 0d0
        goto(0d1)
        assert(false)
        gotopoint(0d1)
        +(@value, 0d1)
        assert(eq(value, 0d1))
        
failing:
  - name: goto-no-parens
    language: Prefix
    source: |
        gotopoint(0d1)
        goto 0d1
        
  - name: gotopoint-no-parens
    language: Prefix
    source: |
        gotopoint 0d1
        
