passing:
  - name: goto-backward
    language: Prefix
    source: |
        int i = 0d0
        int hits = 0d0
        gotopoint('loop')
        +(@hits, 0d1)
        if(LT(i, 0d2)){
            +(@i, 0d1)
            goto('loop')
        }
        ASSERT(EQ(i, 0d2))
        ASSERT(EQ(hits, 0d3))
        
  - name: goto-cross-block
    language: Prefix
    source: |
        int test = 0d0
        if(TRUE){
            goto('target')
            ASSERT(FALSE)
        }
        ASSERT(FALSE)
        gotopoint('target')
        ASSERT(EQ(test, 0d0))
        
  - name: goto-errors
    language: Prefix
    source: |
        int errors_caught = 0d0
        
        try {
            gotopoint(TRUE)
        } catch(err) {
            ASSERT(EQ(err, 'gotopoint requires int or str argument'))
             +(@errors_caught, 0d1)
        }
        
        try {
            goto(TRUE)
        } catch(err) {
            ASSERT(EQ(err, 'goto requires int or str argument'))
             +(@errors_caught, 0d1)
        }
        
        try {
            gotopoint(-0d1)
        } catch(err) {
            ASSERT(EQ(err, 'Negative gotopoint identifier is not allowed'))
             +(@errors_caught, 0d1)
        }
        
        try {
            goto(-0d1)
        } catch(err) {
            ASSERT(EQ(err, 'Negative goto target is not allowed'))
             +(@errors_caught, 0d1)
        }
        
        try {
            goto('unregistered')
        } catch(err) {
            ASSERT(EQ(err, 'Unregistered goto target'))
             +(@errors_caught, 0d1)
        }
        
        ASSERT(EQ(errors_caught, 0d5))
        
  - name: goto-forward
    language: Prefix
    source: |
        int value = 0d0
        goto(0d1)
        ASSERT(FALSE)
        gotopoint(0d1)
        +(@value, 0d1)
        ASSERT(EQ(value, 0d1))
        
failing:
  - name: goto-no-parens
    language: Prefix
    source: |
        gotopoint(0d1)
        goto 0d1
        
  - name: gotopoint-no-parens
    language: Prefix
    source: |
        gotopoint 0d1
        
