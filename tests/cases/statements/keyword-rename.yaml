passing:
  - name: lowercase-if-elseif-else
    language: Prefix
    source: |
        if(false){
            PRINT("a")
        } elseif(true){
            PRINT("b")
        } else {
            PRINT("c")
        }

  - name: lowercase-while
    language: Prefix
    source: |
        int c = 0d0
        while(LT(c, 0d3)){
            c = +(c, 0d1)
        }

  - name: lowercase-for
    language: Prefix
    source: |
        int s = 0d0
        for(i, 0d4){
            +(@s, i)
        }

  - name: lowercase-parfor
    language: Prefix
    source: |
        int s = 0d0
        parfor(k, 0d4){
            +(@s, k)
        }

  - name: lowercase-try-catch
    language: Prefix
    source: |
        try {
            x = 0d1 / 0d0
        } catch(e) {
            int ok = 0d1
        }

  - name: lowercase-return-in-func
    language: Prefix
    source: |
        func int f(){ return(0d7) }
        int r = f()

  - name: lowercase-break-continue
    language: Prefix
    source: |
        int s = 0d0
        for(i, 0d10){
            if(EQ(i, 0d3)){ continue() }
            if(EQ(i, 0d6)){ break(0d1) }
            +(@s, i)
        }

  - name: lowercase-goto-gotopoint
    language: Prefix
    source: |
        int c = 0d0
        gotopoint("loop")
        c = +(c, 0d1)
        if(LT(c, 0d3)){ goto("loop") }

  - name: lowercase-async
    language: Prefix
    source: |
        thread t = async{
            int x = 0d1
        }

  - name: lowercase-pop-in-func
    language: Prefix
    source: |
        func int demo(){
            int secret = 0d1
            pop("secret")
            return(0d0)
        }
        demo()

  - name: lowercase-mixed-control-flow
    language: Prefix
    source: |
        int total = 0d0
        for(i, 0d5){
            if(EQ(i, 0d2)){ continue() }
            +(@total, i)
        }
        while(GT(total, 0d0)){
            total = -(total, 0d1)
        }
        try {
            x = 0d1 / 0d0
        } catch(e) {
            int handled = 0d1
        }

