passing:
  - name: break-nested
    language: Prefix
    source: |
        INT outer = 0d0
        INT inner = 0d0
        FOR(i, 0d3){
            +(@outer, 0d1)
            FOR(j, 0d3){
                +(@inner, 0d1)
                BREAK(0d2)
                ASSERT(FALSE)
            }
            ASSERT(FALSE)
        }
        ASSERT(EQ(outer, 0d1))
        ASSERT(EQ(inner, 0d1))
        REFUTE(EXIST("i"))
        REFUTE(EXIST("j"))
        
  - name: break
    language: Prefix
    source: |
        INT c = 0d0
        WHILE(TRUE){
            +(@c, 0d1)
            BREAK(0d1)
            ASSERT(FALSE)
        }
        ASSERT(EQ(c, 0d1))
        
  - name: continue-for
    language: Prefix
    source: |
        INT total = 0d0
        FOR(i, 0d4){
            IF(EQ(i, 0d2)){
                CONTINUE()
            }
                +(@total, i)
        }
        ASSERT(EQ(total, 0d8))
        
  - name: continue-while
    language: Prefix
    source: |
        INT c = 0d0
        INT seen = 0d0
        WHILE(LT(c, 0d5)){
            +(@c, 0d1)
            IF(LT(c, 0d5)){
                CONTINUE()
            }
            +(@seen, 0d1)
        }
        ASSERT(EQ(c, 0d5))
        ASSERT(EQ(seen, 0d1))
        
failing:
  - name: break-no-argument
    language: Prefix
    source: |
        WHILE(TRUE){
            BREAK()
        }
        
  - name: break-outside-loop
    language: Prefix
    source: |
        BREAK(0d1)
        
  - name: break-target-not-int
    language: Prefix
    source: |
        WHILE(TRUE){
            BREAK(TRUE)
        }
        
  - name: break-too-deep
    language: Prefix
    source: |
        WHILE(TRUE){
            BREAK(0d2)
        }
        
  - name: break-zero
    language: Prefix
    source: |
        WHILE(TRUE){
            BREAK(0d0)
        }
        
  - name: continue-no-parens
    language: Prefix
    source: |
        WHILE(TRUE){
            CONTINUE
        }
        
  - name: continue-outside-loop
    language: Prefix
    source: |
        CONTINUE()
        
  - name: continue-with-argument
    language: Prefix
    source: |
        WHILE(TRUE){
            CONTINUE(0d1)
        }
        
