passing:
  - name: break-nested
    language: Prefix
    source: |
        int outer = 0d0
        int inner = 0d0
        for(i, 0d3){
            +(@outer, 0d1)
            for(j, 0d3){
                +(@inner, 0d1)
                break(0d2)
                assert(false)
            }
            assert(false)
        }
        assert(eq(outer, 0d1))
        assert(eq(inner, 0d1))
        refute(exist("i"))
        refute(exist("j"))
        
  - name: break
    language: Prefix
    source: |
        int c = 0d0
        while(true){
            +(@c, 0d1)
            break(0d1)
            assert(false)
        }
        assert(eq(c, 0d1))
        
  - name: continue-for
    language: Prefix
    source: |
        int total = 0d0
        for(i, 0d4){
            if(eq(i, 0d2)){
                continue()
            }
                +(@total, i)
        }
        assert(eq(total, 0d8))
        
  - name: continue-while
    language: Prefix
    source: |
        int c = 0d0
        int seen = 0d0
        while(lt(c, 0d5)){
            +(@c, 0d1)
            if(lt(c, 0d5)){
                continue()
            }
            +(@seen, 0d1)
        }
        assert(eq(c, 0d5))
        assert(eq(seen, 0d1))
        
failing:
  - name: break-no-argument
    language: Prefix
    source: |
        while(true){
            break()
        }
        
  - name: break-outside-loop
    language: Prefix
    source: |
        break(0d1)
        
  - name: break-target-not-int
    language: Prefix
    source: |
        while(true){
            break(true)
        }
        
  - name: break-too-deep
    language: Prefix
    source: |
        while(true){
            break(0d2)
        }
        
  - name: break-zero
    language: Prefix
    source: |
        while(true){
            break(0d0)
        }
        
  - name: continue-no-parens
    language: Prefix
    source: |
        while(true){
            continue
        }
        
  - name: continue-outside-loop
    language: Prefix
    source: |
        continue()
        
  - name: continue-with-argument
    language: Prefix
    source: |
        while(true){
            continue(0d1)
        }
        
