passing:
  - name: break-nested
    language: Prefix
    source: |
        int outer = 0d0
        int inner = 0d0
        for(i, 0d3){
            +(@outer, 0d1)
            for(j, 0d3){
                +(@inner, 0d1)
                break(0d2)
                ASSERT(FALSE)
            }
            ASSERT(FALSE)
        }
        ASSERT(EQ(outer, 0d1))
        ASSERT(EQ(inner, 0d1))
        REFUTE(EXIST("i"))
        REFUTE(EXIST("j"))
        
  - name: break
    language: Prefix
    source: |
        int c = 0d0
        while(TRUE){
            +(@c, 0d1)
            break(0d1)
            ASSERT(FALSE)
        }
        ASSERT(EQ(c, 0d1))
        
  - name: continue-for
    language: Prefix
    source: |
        int total = 0d0
        for(i, 0d4){
            if(EQ(i, 0d2)){
                continue()
            }
                +(@total, i)
        }
        ASSERT(EQ(total, 0d8))
        
  - name: continue-while
    language: Prefix
    source: |
        int c = 0d0
        int seen = 0d0
        while(LT(c, 0d5)){
            +(@c, 0d1)
            if(LT(c, 0d5)){
                continue()
            }
            +(@seen, 0d1)
        }
        ASSERT(EQ(c, 0d5))
        ASSERT(EQ(seen, 0d1))
        
failing:
  - name: break-no-argument
    language: Prefix
    source: |
        while(TRUE){
            break()
        }
        
  - name: break-outside-loop
    language: Prefix
    source: |
        break(0d1)
        
  - name: break-target-not-int
    language: Prefix
    source: |
        while(TRUE){
            break(TRUE)
        }
        
  - name: break-too-deep
    language: Prefix
    source: |
        while(TRUE){
            break(0d2)
        }
        
  - name: break-zero
    language: Prefix
    source: |
        while(TRUE){
            break(0d0)
        }
        
  - name: continue-no-parens
    language: Prefix
    source: |
        while(TRUE){
            continue
        }
        
  - name: continue-outside-loop
    language: Prefix
    source: |
        continue()
        
  - name: continue-with-argument
    language: Prefix
    source: |
        while(TRUE){
            continue(0d1)
        }
        
