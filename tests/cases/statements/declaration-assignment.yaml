passing:
  - name: assign-map-index
    language: Prefix
    source: |
        map m = <"a" = 0d1>
        assert(eq(assign(m<"b">, 0d2), 0d2))
        assert(eq(m<"b">, 0d2))
        
  - name: assign-nested-map-auto-create
    language: Prefix
    source: |
        map m
        
        assert(eq(assign(m<"a", "b">, 0d5), 0d5))
        assert(eq(m<"a", "b">, 0d5))
        assert(eq(m, <"a" = <"b" = 0d5>>))
        
  - name: assign-tns-index
    language: Prefix
    source: |
        tensor vec = [0d1, 0d2, 0d3]
        assert(eq(assign(vec[0d2], 0d9), 0d9))
        assert(eq(vec[0d2], 0d9))
        
  - name: assign
    language: Prefix
    source: |
        assign(bool x, true)
        assert(exist("x"))
        
  - name: later-assign-no-type
    language: Prefix
    source: |
        assign(bool x, true)
        assign(x, false)
        
  - name: later-decl-no-type
    language: Prefix
    source: |
        bool x = true
        x = false
        
  - name: multi-assign-type
    language: Prefix
    source: |
        assign(bool x, true)
        assign(bool x, false)
        
  - name: multi-decl-type
    language: Prefix
    source: |
        bool x = true
        bool x = false
        
  - name: tns-slice-assign-1d
    language: Prefix
    source: |
        tensor vec = [0d1, 0d2, 0d3]
        
        assert(eq(assign(vec[0d1:0d2], [0d9, 0d10]), [0d9, 0d10]))
        assert(eq(vec, [0d9, 0d10, 0d3]))
        
  - name: tns-slice-assign-2d
    language: Prefix
    source: |
        tensor matrix = [[0d1, 0d2], [0d3, 0d4]]
        
        assert(eq(assign(matrix[# , 0d2], [0d9, 0d10]), [0d9, 0d10]))
        assert(eq(matrix, [[0d1, 0d9], [0d3, 0d10]]))
        
  - name: type-then-decl-type
    language: Prefix
    source: |
        bool x
        bool x = true
        
  - name: type-then-decl
    language: Prefix
    source: |
        bool x
        x = true
        
