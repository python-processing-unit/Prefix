passing:
  - name: assign-map-index
    language: Prefix
    source: |
        MAP m = <"a" = 0d1>
        ASSERT(EQ(ASSIGN(m<"b">, 0d2), 0d2))
        ASSERT(EQ(m<"b">, 0d2))
        
  - name: assign-nested-map-auto-create
    language: Prefix
    source: |
        MAP m
        
        ASSERT(EQ(ASSIGN(m<"a", "b">, 0d5), 0d5))
        ASSERT(EQ(m<"a", "b">, 0d5))
        ASSERT(EQ(m, <"a" = <"b" = 0d5>>))
        
  - name: assign-tns-index
    language: Prefix
    source: |
        TNS vec = [0d1, 0d2, 0d3]
        ASSERT(EQ(ASSIGN(vec[0d2], 0d9), 0d9))
        ASSERT(EQ(vec[0d2], 0d9))
        
  - name: assign
    language: Prefix
    source: |
        ASSIGN(BOOL x, TRUE)
        ASSERT(EXIST("x"))
        
  - name: later-assign-no-type
    language: Prefix
    source: |
        ASSIGN(BOOL x, TRUE)
        ASSIGN(x, FALSE)
        
  - name: later-decl-no-type
    language: Prefix
    source: |
        BOOL x = TRUE
        x = FALSE
        
  - name: multi-assign-type
    language: Prefix
    source: |
        ASSIGN(BOOL x, TRUE)
        ASSIGN(BOOL x, FALSE)
        
  - name: multi-decl-type
    language: Prefix
    source: |
        BOOL x = TRUE
        BOOL x = FALSE
        
  - name: tns-slice-assign-1d
    language: Prefix
    source: |
        TNS vec = [0d1, 0d2, 0d3]
        
        ASSERT(EQ(ASSIGN(vec[0d1:0d2], [0d9, 0d10]), [0d9, 0d10]))
        ASSERT(EQ(vec, [0d9, 0d10, 0d3]))
        
  - name: tns-slice-assign-2d
    language: Prefix
    source: |
        TNS matrix = [[0d1, 0d2], [0d3, 0d4]]
        
        ASSERT(EQ(ASSIGN(matrix[# , 0d2], [0d9, 0d10]), [0d9, 0d10]))
        ASSERT(EQ(matrix, [[0d1, 0d9], [0d3, 0d10]]))
        
  - name: type-then-decl-type
    language: Prefix
    source: |
        BOOL x
        BOOL x = TRUE
        
  - name: type-then-decl
    language: Prefix
    source: |
        BOOL x
        x = TRUE
        
failing:
  - name: assign-map-index-on-bool
    language: Prefix
    source: |
        BOOL b = TRUE
        ASSIGN(b<"k">, 0d1)
        
  - name: assign-map-index-on-flt
    language: Prefix
    source: |
        FLT f = 0d1.5
        ASSIGN(f<0d1>, 0d1)
        
  - name: assign-map-index-on-func
    language: Prefix
    source: |
        FUNC fn = GET_FIVE
        ASSIGN(fn<"k">, 0d1)
        
  - name: assign-map-index-on-int
    language: Prefix
    source: |
        INT i = 0d1
        ASSIGN(i<0d1>, 0d1)
        
  - name: assign-map-index-on-str
    language: Prefix
    source: |
        STR s = "x"
        ASSIGN(s<"k">, 0d1)
        
  - name: assign-map-index-on-thr
    language: Prefix
    source: |
        THR t = ASYNC{}
        ASSIGN(t<"k">, 0d1)
        
  - name: assign-map-index-on-tns
    language: Prefix
    source: |
        TNS vec = [0d1, 0d2]
        ASSIGN(vec<"a">, 0d1)
        
  - name: assign-tns-index-on-bool
    language: Prefix
    source: |
        BOOL b = TRUE
        ASSIGN(b[0d1], 0d1)
        
  - name: assign-tns-index-on-flt
    language: Prefix
    source: |
        FLT f = 0d1.5
        ASSIGN(f[0d1], 0d1)
        
  - name: assign-tns-index-on-func
    language: Prefix
    source: |
        FUNC fn = GET_FIVE
        ASSIGN(fn[0d1], 0d1)
        
  - name: assign-tns-index-on-int
    language: Prefix
    source: |
        INT i = 0d1
        ASSIGN(i[0d1], 0d2)
        
  - name: assign-tns-index-on-map
    language: Prefix
    source: |
        MAP m = <"a" = 0d1>
