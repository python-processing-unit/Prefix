  - name: decl-conflicting-type
    language: Prefix
    source: |
        INT n = 0d0
        BOOL n
        
  - name: first-assign-no-type
    language: Prefix
    source: |
        ASSIGN(x, TRUE)
        
  - name: first-decl-no-type
    language: Prefix
    source: |
        x = TRUE
        
  - name: tns-slice-dim-mismatch
    language: Prefix
    source: |
        TNS matrix = [[0d1, 0d2], [0d3, 0d4]]
        ASSIGN(matrix[# , 0d2], [[0d9], [0d10]])
        
  - name: tns-slice-element-type-mismatch
    language: Prefix
    source: |
        TNS vec = [0d1, 0d2]
        ASSIGN(vec[0d1-0d2], [0d1.5, 0d2.5])
        
  - name: tns-slice-rhs-not-tns
    language: Prefix
    source: |
        TNS vec = [0d1, 0d2]
        ASSIGN(vec[0d1-0d2], 0d9)
        
  - name: tns-slice-shape-mismatch
    language: Prefix
    source: |
        TNS matrix = [[0d1, 0d2], [0d3, 0d4]]
        ASSIGN(matrix[# , #], [[0d9, 0d10, 0d11], [0d12, 0d13, 0d14]])
        
