passing:
  - name: try-catch-err
    language: Prefix
    source: |
        try{
            assert(false)
        } catch(err) {
            assert(exist("err"))
        }
        refute(exist("err"))
        
  - name: try-catch
    language: Prefix
    source: |
        try{
            assert(true)
        } catch {
            assert(false)
        }
        try{
            assert(false)
        } catch {
            assert(true)
        }
        
failing:
  - name: catch-no-try
    language: Prefix
    source: |
        catch{}
        
  - name: try-catch-err-pseudotype
    language: Prefix
    source: |
        try{
            assert(false)
        } catch(SYMBOL: err) {
            assert(exist("err"))
        }
        
  - name: try-catch-seperated
    language: Prefix
    source: |
        try{
            assert(false)
        }
        catch {
            assert(true)
        }
        
  - name: try-no-catch
    language: Prefix
    source: |
        try{}
        
