passing:
  - name: try-catch-err
    language: Prefix
    source: |
        try{
            ASSERT(FALSE)
        } catch(err) {
            ASSERT(EXIST("err"))
        }
        REFUTE(EXIST("err"))
        
  - name: try-catch
    language: Prefix
    source: |
        try{
            ASSERT(TRUE)
        } catch {
            ASSERT(FALSE)
        }
        try{
            ASSERT(FALSE)
        } catch {
            ASSERT(TRUE)
        }
        
failing:
  - name: catch-no-try
    language: Prefix
    source: |
        catch{}
        
  - name: try-catch-err-pseudotype
    language: Prefix
    source: |
        try{
            ASSERT(FALSE)
        } catch(SYMBOL: err) {
            ASSERT(EXIST("err"))
        }
        
  - name: try-catch-seperated
    language: Prefix
    source: |
        try{
            ASSERT(FALSE)
        }
        catch {
            ASSERT(TRUE)
        }
        
  - name: try-no-catch
    language: Prefix
    source: |
        try{}
        
