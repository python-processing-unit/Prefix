passing:
  - name: for-zero-and-restore-counter
    language: Prefix
    source: |
        str i = "foo"
        for(i, 0d10){}
        assert(eq(i, "foo"))
  - name: for
    language: Prefix
    source: |
        int sum = 0d0
        for(i, 0d4){
            +(@sum, i)
        }
        assert(eq(sum, 0d10))
        refute(exist("i"))
        
failing:
  - name: for-no-block
    language: Prefix
    source: |
        for(i, 0d1)
        
  - name: for-no-target
    language: Prefix
    source: |
        for(i, ){}
        
  - name: for-target-not-int
    language: Prefix
    source: 'for(i, true){}'
