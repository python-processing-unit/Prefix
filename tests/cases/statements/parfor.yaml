passing:
  - name: parfor-break-nested
    language: Prefix
    source: |
        int outer = 0d0
        
        for(j, 0d3){
            +(@outer, 0d1)
            parfor(i, 0d5){
                break(0d2)
            }
            assert(false)
        }
        
        assert(eq(outer, 0d1))
        refute(exist("i"))
        refute(exist("j"))
        
  - name: parfor-break
    language: Prefix
    source: |
        int outer = 0d0
        int after = 0d0
        
        for(j, 0d3){
            +(@outer, 0d1)
            parfor(i, 0d5){
                break(0d1)
            }
            +(@after, 0d1)
        }
        
        assert(eq(outer, 0d3))
        assert(eq(after, 0d3))
        refute(exist("i"))
        refute(exist("j"))
        
  - name: parfor-continue
    language: Prefix
    source: |
        tensor seen = [0d0, 0d0, 0d0, 0d0]
        parfor(i, 0d4){
            if(eq(i, 0d2)){
                continue()
            }
            seen[i] = i
        }
        assert(eq(seen, [0d1, 0d0, 0d3, 0d4]))
        refute(exist("i"))
        
  - name: parfor-error-join
    language: Prefix
    source: |
        tensor seen = [0d0, 0d0, 0d0]
        bool caught = false
        
        try{
            parfor(i, 0d3){
                seen[i] = i
                if(eq(i, 0d2)){
                    assert(false)
                }
            }
            assert(false)
        } catch {
            caught = true
        }
        
        assert(caught)
        assert(eq(seen, [0d1, 0d2, 0d3]))
        
  - name: parfor-merge-symbol
    language: Prefix
    source: |
        parfor(i, 0d3){
            if(eq(i, 0d2)){
                int merged = 0d7
            }
        }
        assert(exist("merged"))
        assert(eq(merged, 0d7))
        refute(exist("i"))
        
  - name: parfor-target-once
    language: Prefix
    source: |
        int target_calls = 0d0
        
        func int get_target(){
            +(@target_calls, 0d1)
            return(0d3)
        }
        
        tensor seen = [0d0, 0d0, 0d0]
        parfor(i, get_target()){
            seen[i] = i
        }
        assert(eq(target_calls, 0d1))
        assert(eq(seen, [0d1, 0d2, 0d3]))
        refute(exist("i"))
        
  - name: parfor-zero-and-restore-counter
    language: Prefix
    source: |
        bool i = true
        int runs = 0d0
        parfor(i, 0d5){
            +(@runs, 0d1)
        }
        assert(eq(runs, 0d0))
        assert(i)
        
  - name: parfor
    language: Prefix
    source: |
        tensor seen = [0d0, 0d0, 0d0, 0d0]
        parfor(i, 0d4){
            seen[i] = i
        }
        assert(eq(seen, [0d1, 0d2, 0d3, 0d4]))
        refute(exist("i"))
        
failing:
  - name: parfor-no-block
    language: Prefix
    source: |
        parfor(i, 0d1)
        
  - name: parfor-no-target
    language: Prefix
    source: |
        parfor(i, ){}
        
  - name: parfor-target-not-int
    language: Prefix
    source: |
        parfor(i, true){}
        
