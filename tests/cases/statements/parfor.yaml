passing:
  - name: parfor-break-nested
    language: Prefix
    source: |
        int outer = 0d0
        
        for(j, 0d3){
            +(@outer, 0d1)
            parfor(i, 0d5){
                break(0d2)
            }
            ASSERT(FALSE)
        }
        
        ASSERT(EQ(outer, 0d1))
        REFUTE(EXIST("i"))
        REFUTE(EXIST("j"))
        
  - name: parfor-break
    language: Prefix
    source: |
        int outer = 0d0
        int after = 0d0
        
        for(j, 0d3){
            +(@outer, 0d1)
            parfor(i, 0d5){
                break(0d1)
            }
            +(@after, 0d1)
        }
        
        ASSERT(EQ(outer, 0d3))
        ASSERT(EQ(after, 0d3))
        REFUTE(EXIST("i"))
        REFUTE(EXIST("j"))
        
  - name: parfor-continue
    language: Prefix
    source: |
        tensor seen = [0d0, 0d0, 0d0, 0d0]
        parfor(i, 0d4){
            if(EQ(i, 0d2)){
                continue()
            }
            seen[i] = i
        }
        ASSERT(EQ(seen, [0d1, 0d0, 0d3, 0d4]))
        REFUTE(EXIST("i"))
        
  - name: parfor-error-join
    language: Prefix
    source: |
        tensor seen = [0d0, 0d0, 0d0]
        bool caught = FALSE
        
        try{
            parfor(i, 0d3){
                seen[i] = i
                if(EQ(i, 0d2)){
                    ASSERT(FALSE)
                }
            }
            ASSERT(FALSE)
        } catch {
            caught = TRUE
        }
        
        ASSERT(caught)
        ASSERT(EQ(seen, [0d1, 0d2, 0d3]))
        
  - name: parfor-merge-symbol
    language: Prefix
    source: |
        parfor(i, 0d3){
            if(EQ(i, 0d2)){
                int merged = 0d7
            }
        }
        ASSERT(EXIST("merged"))
        ASSERT(EQ(merged, 0d7))
        REFUTE(EXIST("i"))
        
  - name: parfor-target-once
    language: Prefix
    source: |
        int target_calls = 0d0
        
        func int get_target(){
            +(@target_calls, 0d1)
            return(0d3)
        }
        
        tensor seen = [0d0, 0d0, 0d0]
        parfor(i, get_target()){
            seen[i] = i
        }
        ASSERT(EQ(target_calls, 0d1))
        ASSERT(EQ(seen, [0d1, 0d2, 0d3]))
        REFUTE(EXIST("i"))
        
  - name: parfor-zero-and-restore-counter
    language: Prefix
    source: |
        bool i = TRUE
        int runs = 0d0
        parfor(i, 0d5){
            +(@runs, 0d1)
        }
        ASSERT(EQ(runs, 0d0))
        ASSERT(i)
        
  - name: parfor
    language: Prefix
    source: |
        tensor seen = [0d0, 0d0, 0d0, 0d0]
        parfor(i, 0d4){
            seen[i] = i
        }
        ASSERT(EQ(seen, [0d1, 0d2, 0d3, 0d4]))
        REFUTE(EXIST("i"))
        
