passing:
  - name: caret-before-comment
    language: Prefix
    source: |
        bool ^! comment
        x = TRUE
        
  - name: comment
    language: Prefix
    source: |
        bool x = TRUE ! foo
        
  - name: statement-using-caret
    language: Prefix
    source: |
        bool ^
        x = TRUE
        
  - name: statements-semicolon-delimiter
    language: Prefix
    source: |
        bool x = TRUE ; bool y = FALSE
        
  - name: whitespace
    language: Prefix
    source: |
        bool x = TRUE
        bool x = TRUE
        bool x = TRUE
        bool x = TRUE
        bool x= TRUE
        bool x =TRUE
        bool x=TRUE
        
failing:
  - name: statement-with-caret
    language: Prefix
    source: |
        bool x ^ = TRUE
        
  - name: statement-with-delimiter
    language: Prefix
    source: |
        bool 
         x = TRUE
        
  - name: statement-with-semicolon
    language: Prefix
    source: |
        bool ; x = TRUE
        
  - name: statements-no-delimiter
    language: Prefix
    source: |
        bool x = TRUE bool y = FALSE
        
