passing:
  - name: caret-before-comment
    language: Prefix
    source: |
        bool ^! comment
        x = true
        
  - name: comment
    language: Prefix
    source: |
        bool x = true ! foo
        
  - name: statement-using-caret
    language: Prefix
    source: |
        bool ^
        x = true
        
  - name: statements-semicolon-delimiter
    language: Prefix
    source: |
        bool x = true ; bool y = false
        
  - name: whitespace
    language: Prefix
    source: |
        bool x = true
        bool x = true
        bool x = true
        bool x = true
        bool x= true
        bool x =true
        bool x=true
        
failing:
  - name: statement-with-caret
    language: Prefix
    source: |
        bool x ^ = true
        
  - name: statement-with-delimiter
    language: Prefix
    source: |
        bool 
         x = true
        
  - name: statement-with-semicolon
    language: Prefix
    source: |
        bool ; x = true
        
  - name: statements-no-delimiter
    language: Prefix
    source: |
        bool x = true bool y = false
        
