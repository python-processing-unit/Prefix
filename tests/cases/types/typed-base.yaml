passing:
  - name: typed-base-coerce
    language: Prefix
    source: |
        func int{0d2} add(~int{0d2} a, ~int{0d2} b) {
            return(+(a, b))
        }
        assert(eq(add(0d5, 0d6), 0b1011))
        assert(eq(add(0xA, 0xB), 0b10101))
        assert(eq(add(0o3, 0o4), 0b111))
        assert(eq(BASE(add(0d1, 0d1)), 0d2))
        
        func float{0d16} scale(~float{0d16} x) {
            return(*(x, 0x2.0))
        }
        assert(eq(scale(0d3.0), 0x6.0))
        assert(eq(BASE(scale(0d1.0)), 0d16))
        
  - name: typed-base-func-return
    language: Prefix
    source: |
        func int{0d2} make_binary(int x) {
            return(switch_base(x, 0d2))
        }
        assert(eq(make_binary(0d5), 0b101))
        assert(eq(BASE(make_binary(0d5)), 0d2))
        
        func float{0d16} make_hex(float x) {
            return(switch_base(x, 0d16))
        }
        assert(eq(make_hex(0d3.0), 0x3.0))
        assert(eq(BASE(make_hex(0d3.0)), 0d16))
        
  - name: typed-base-lambda
    language: Prefix
    source: |
        func add_binary = LAMBDA int{0d2} (int{0d2} a, int{0d2} b) {
            return(+(a, b))
        }
        assert(eq(add_binary(0b101, 0b110), 0b1011))
        assert(eq(signature(add_binary), "int{0d2} add_binary(int{0d2} a, int{0d2} b)"))
        
        func scale_hex = LAMBDA float{0d16} (~float{0d16} x) {
            return(*(x, 0x2.0))
        }
        assert(eq(scale_hex(0d2.5), 0x5.0))
        assert(eq(BASE(scale_hex(0d2.5)), 0d16))
        
  - name: typed-base-signature
    language: Prefix
    source: |
        func int{0d2} add(int{0d2} a, int{0d2} b) {
            return(+(a, b))
        }
        assert(eq(signature(add), "int{0d2} add(int{0d2} a, int{0d2} b)"))
        
        func float{0d16} scale(float{0d16} x) {
            return(*(x, 0x2.0))
        }
        assert(eq(signature(scale), "float{0d16} scale(float{0d16} x)"))
        
        int{0d8} octal = 0o77
        assert(eq(signature(octal), "int{0d8} octal"))
        
        float{0d32} flt_named = 0t1.5
        assert(eq(signature(flt_named), "float{0d32} flt_named"))
        
  - name: typed-flt-base-parent
    language: Prefix
    source: |
        float a = 0b10.1
        assert(eq(a, 0b10.1))
        assert(eq(BASE(a), 0d2))
        
        a = 0x1.A
        assert(eq(a, 0x1.A))
        assert(eq(BASE(a), 0d16))
        
        a = 0d3.14
        assert(eq(a, 0d3.14))
        assert(eq(BASE(a), 0d10))
        
  - name: typed-flt-base
    language: Prefix
    source: |
        float{0d2} a = 0b10.1
        assert(eq(a, 0b10.1))
        assert(eq(BASE(a), 0d2))
        
        float{0d16} b = 0x1.A
        assert(eq(b, 0x1.A))
        assert(eq(BASE(b), 0d16))
        
        float{0d10} c = 0d3.14
        assert(eq(c, 0d3.14))
        assert(eq(BASE(c), 0d10))
        
        float{0d64} d = 0s0.5
        assert(eq(d, 0s0.5))
        assert(eq(BASE(d), 0d64))
        
  - name: typed-int-base-parent
    language: Prefix
    source: |
        int a = 0b1010
        assert(eq(a, 0b1010))
        assert(eq(BASE(a), 0d2))
        
        a = 0x2A
        assert(eq(a, 0x2A))
        assert(eq(BASE(a), 0d16))
        
        a = 0d42
        assert(eq(a, 0d42))
        assert(eq(BASE(a), 0d10))
        
  - name: typed-int-base
    language: Prefix
    source: |
        int{0d2} a = 0b1010
        assert(eq(a, 0b1010))
        assert(eq(BASE(a), 0d2))
        
        int{0d16} b = 0x2A
        assert(eq(b, 0x2A))
        assert(eq(BASE(b), 0d16))
        
        int{0d10} c = 0d42
        assert(eq(c, 0d42))
        assert(eq(BASE(c), 0d10))
        
        int{0d64} d = 0s6
        assert(eq(d, 0s6))
        assert(eq(BASE(d), 0d64))
        
