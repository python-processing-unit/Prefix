passing:
  - name: typed-base-coerce
    language: Prefix
    source: |
        FUNC INT{0d2} add(~INT{0d2} a, ~INT{0d2} b) {
            RETURN(+(a, b))
        }
        ASSERT(EQ(add(0d5, 0d6), 0b1011))
        ASSERT(EQ(add(0xA, 0xB), 0b10101))
        ASSERT(EQ(add(0o3, 0o4), 0b111))
        ASSERT(EQ(BASE(add(0d1, 0d1)), 0d2))
        
        FUNC FLT{0d16} scale(~FLT{0d16} x) {
            RETURN(*(x, 0x2.0))
        }
        ASSERT(EQ(scale(0d3.0), 0x6.0))
        ASSERT(EQ(BASE(scale(0d1.0)), 0d16))
        
  - name: typed-base-func-return
    language: Prefix
    source: |
        FUNC INT{0d2} make_binary(INT x) {
            RETURN(CONVERT(x, 0d2))
        }
        ASSERT(EQ(make_binary(0d5), 0b101))
        ASSERT(EQ(BASE(make_binary(0d5)), 0d2))
        
        FUNC FLT{0d16} make_hex(FLT x) {
            RETURN(CONVERT(x, 0d16))
        }
        ASSERT(EQ(make_hex(0d3.0), 0x3.0))
        ASSERT(EQ(BASE(make_hex(0d3.0)), 0d16))
        
  - name: typed-base-lambda
    language: Prefix
    source: |
        FUNC add_binary = LAMBDA INT{0d2} (INT{0d2} a, INT{0d2} b) {
            RETURN(+(a, b))
        }
        ASSERT(EQ(add_binary(0b101, 0b110), 0b1011))
        ASSERT(EQ(SIGNATURE(add_binary), "INT{0d2} add_binary(INT{0d2} a, INT{0d2} b)"))
        
        FUNC scale_hex = LAMBDA FLT{0d16} (~FLT{0d16} x) {
            RETURN(*(x, 0x2.0))
        }
        ASSERT(EQ(scale_hex(0d2.5), 0x5.0))
        ASSERT(EQ(BASE(scale_hex(0d2.5)), 0d16))
        
  - name: typed-base-signature
    language: Prefix
    source: |
        FUNC INT{0d2} add(INT{0d2} a, INT{0d2} b) {
            RETURN(+(a, b))
        }
        ASSERT(EQ(SIGNATURE(add), "INT{0d2} add(INT{0d2} a, INT{0d2} b)"))
        
        FUNC FLT{0d16} scale(FLT{0d16} x) {
            RETURN(*(x, 0x2.0))
        }
        ASSERT(EQ(SIGNATURE(scale), "FLT{0d16} scale(FLT{0d16} x)"))
        
        INT{0d8} octal = 0o77
        ASSERT(EQ(SIGNATURE(octal), "INT{0d8} octal"))
        
        FLT{0d32} flt_named = 0t1.5
        ASSERT(EQ(SIGNATURE(flt_named), "FLT{0d32} flt_named"))
        
  - name: typed-flt-base-parent
    language: Prefix
    source: |
        FLT a = 0b10.1
        ASSERT(EQ(a, 0b10.1))
        ASSERT(EQ(BASE(a), 0d2))
        
        a = 0x1.A
        ASSERT(EQ(a, 0x1.A))
        ASSERT(EQ(BASE(a), 0d16))
        
        a = 0d3.14
        ASSERT(EQ(a, 0d3.14))
        ASSERT(EQ(BASE(a), 0d10))
        
  - name: typed-flt-base
    language: Prefix
    source: |
        FLT{0d2} a = 0b10.1
        ASSERT(EQ(a, 0b10.1))
        ASSERT(EQ(BASE(a), 0d2))
        
        FLT{0d16} b = 0x1.A
        ASSERT(EQ(b, 0x1.A))
        ASSERT(EQ(BASE(b), 0d16))
        
        FLT{0d10} c = 0d3.14
        ASSERT(EQ(c, 0d3.14))
        ASSERT(EQ(BASE(c), 0d10))
        
        FLT{0d64} d = 0s0.5
        ASSERT(EQ(d, 0s0.5))
        ASSERT(EQ(BASE(d), 0d64))
        
  - name: typed-int-base-parent
    language: Prefix
    source: |
        INT a = 0b1010
        ASSERT(EQ(a, 0b1010))
        ASSERT(EQ(BASE(a), 0d2))
        
        a = 0x2A
        ASSERT(EQ(a, 0x2A))
        ASSERT(EQ(BASE(a), 0d16))
        
        a = 0d42
        ASSERT(EQ(a, 0d42))
        ASSERT(EQ(BASE(a), 0d10))
        
  - name: typed-int-base
    language: Prefix
    source: |
        INT{0d2} a = 0b1010
        ASSERT(EQ(a, 0b1010))
        ASSERT(EQ(BASE(a), 0d2))
        
        INT{0d16} b = 0x2A
        ASSERT(EQ(b, 0x2A))
        ASSERT(EQ(BASE(b), 0d16))
        
        INT{0d10} c = 0d42
        ASSERT(EQ(c, 0d42))
        ASSERT(EQ(BASE(c), 0d10))
        
        INT{0d64} d = 0s6
        ASSERT(EQ(d, 0s6))
        ASSERT(EQ(BASE(d), 0d64))
        
