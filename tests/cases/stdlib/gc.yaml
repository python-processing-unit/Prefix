  - name: gc-ignore-safety
    language: Prefix
    source: |
        import("gc")

        assign(gc.track_new_symbols, false)
        int protected = 0d7
        int dead = 0d8
        assert(gc.track("protected"))
        assert(gc.track("dead"))
        assert(gc.ignore("protected"))
