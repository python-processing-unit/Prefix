        assert(gc.track("protected"))
        refute(exist("dead"))

  - name: gc-default-tracking-and-initialized-collection
    language: Prefix
    source: |
        import("gc")

        assign(gc.track_new_symbols, true)
        int automatic_dead = 0d1
        int future_value = 0d2
        assert(gc.collect())
        assert(eq(future_value, 0d2))
        refute(exist("automatic_dead"))

  - name: gc-loop-without-ignore
    language: Prefix
    source: |
        import("gc")

        func int sum_with_checkpoints(){
            int index = 0d1
            int total = 0d0
            while(lte(index, 0d4)){
                assign(total, +(total, index))
                if(eq(mod(index, 0d2), 0d0)){
                    gc.collect()
                }
                +(@index, 0d1)
            }
            return(total)
        }

        assert(eq(sum_with_checkpoints(), 0d10))

  - name: gc-collection-correctness
    language: Prefix
    source: |
        import("gc")

        int disposable = 0d17
        int captured = 0d23
        func int read_captured(){
            return(captured)
        }

        gc.collect()
        refute(exist("disposable"))
        assert(eq(read_captured(), 0d23))

  - name: gc-import-references
    language: Prefix
    source: |
        import("gc")
        import("path")
        str root = path.directory_name(path.directory_name(path.script_dir))
        str module_path = join(root, "/helpers/gc_import_target.pre")
        import_path(module_path, "helper")
        assign(gc.track_new_symbols, false)
        assert(gc.track_all())
        assert(gc.collect())
        assert(eq(helper.read_live(), 0d7))
        refute(exist("helper.module_dead"))

  - name: gc-importing-module-references
    language: Prefix
    source: |
        import("gc")
        import("path")
        str root = path.directory_name(path.directory_name(path.script_dir))
        str module_path = join(root, "/helpers/gc_importing_target.pre")
        import_path(module_path, "importer")
        assign(gc.track_new_symbols, false)
        assert(gc.track_all())
        assert(gc.collect())
        assert(eq(importer.read_imported_live(), 0d7))
        refute(importer.imported_dead_exists())
        refute(exist("gc_imported_target.internal_dead"))

