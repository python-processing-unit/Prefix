passing:
  - name: gc-aggressive-future-references
    language: Prefix
    source: |
        import("gc")

        assign(gc.track_new_symbols, false)
        int dead = 0d1
        int live = 0d2
        assert(gc.track("dead"))
        assert(gc.track("live"))
        assert(gc.collect())
        assert(eq(live, 0d2))
        refute(exist("dead"))

