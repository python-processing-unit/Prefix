passing:
  - name: path-module-values
    language: Prefix
    source: |
        import("path")
        assert(eq(type(path.interpreter), "str"))
        assert(eq(type(path.interpreter_dir), "str"))
        assert(eq(type(path.script), "str"))
        assert(eq(type(path.script_dir), "str"))

  - name: path-normalize-path
    language: Prefix
    source: |
        import("path")
        assert(eq(path.normalize_path(""), ""))
        assert(eq(path.normalize_path("file.txt"), "file.txt"))
        assert(eq(path.normalize_path("dir\\file.txt"), "dir/file.txt"))
        assert(eq(path.normalize_path("dir\\sub/file.txt"), "dir/sub/file.txt"))
        assert(eq(path.normalize_path("\\\\server\\share\\file.txt"), "//server/share/file.txt"))
        assert(eq(path.normalize_path("////dir\\\\file"), "////dir//file"))
        assert(eq(path.normalize_path("./dir/../file"), "./dir/../file"))
        assert(eq(type(path.normalize_path("x")), "str"))

  - name: path-windows-path
    language: Prefix
    source: |
        import("path")
        assert(eq(path.windows_path(""), ""))
        assert(eq(path.windows_path("file.txt"), "file.txt"))
        assert(eq(path.windows_path("dir/file.txt"), "dir\\file.txt"))
        assert(eq(path.windows_path("dir\\sub/file.txt"), "dir\\sub\\file.txt"))
        assert(eq(path.windows_path("//server/share/file.txt"), "\\\\server\\share\\file.txt"))
        assert(eq(path.windows_path("////dir//file"), "\\\\\\\\dir\\\\file"))
        assert(eq(path.windows_path("./dir/../file"), ".\\dir\\..\\file"))
        assert(eq(type(path.windows_path("x")), "str"))

  - name: path-directory-name
    language: Prefix
    source: |
        import("path")
        assert(eq(path.directory_name(""), ""))
        assert(eq(path.directory_name("file.txt"), ""))
        assert(eq(path.directory_name("dir/file.txt"), "dir"))
        assert(eq(path.directory_name("dir/sub/file.txt"), "dir/sub"))
        assert(eq(path.directory_name("dir\\sub\\file.txt"), "dir/sub"))
        assert(eq(path.directory_name("/file.txt"), ""))
        assert(eq(path.directory_name("/dir/file.txt"), "/dir"))
        assert(eq(path.directory_name("C:/dir/file.txt"), "C:/dir"))
        assert(eq(path.directory_name("dir/"), ""))
        assert(eq(path.directory_name("/"), ""))
        assert(eq(type(path.directory_name("x")), "str"))

  - name: path-file-name
    language: Prefix
    source: |
        import("path")
        assert(eq(path.file_name(""), ""))
        assert(eq(path.file_name("file.txt"), "file.txt"))
        assert(eq(path.file_name("dir/file.txt"), "file.txt"))
        assert(eq(path.file_name("dir\\sub\\file.txt"), "file.txt"))
        assert(eq(path.file_name("/file.txt"), "file.txt"))
        assert(eq(path.file_name("dir/"), ""))
        assert(eq(path.file_name("."), "."))
        assert(eq(path.file_name(".."), ".."))
        assert(eq(path.file_name(".hidden"), ".hidden"))
        assert(eq(type(path.file_name("x")), "str"))

  - name: path-split-extension
    language: Prefix
    source: |
        import("path")
        assert(eq(type(path.split_extension("file.txt")), "tensor"))
        assert(eq(path.split_extension("file.txt")[0d1], "file"))
        assert(eq(path.split_extension("file.txt")[0d2], "txt"))
        assert(eq(path.split_extension("dir/file.txt")[0d1], "dir/file"))
        assert(eq(path.split_extension("dir/file.txt")[0d2], "txt"))
        assert(eq(path.split_extension("archive.tar.gz")[0d1], "archive.tar"))
        assert(eq(path.split_extension("archive.tar.gz")[0d2], "gz"))
        assert(eq(path.split_extension(".profile")[0d1], ""))
        assert(eq(path.split_extension(".profile")[0d2], "profile"))
        assert(eq(path.split_extension("file.")[0d1], "file"))
        assert(eq(path.split_extension("file.")[0d2], ""))
        assert(eq(path.split_extension("file")[0d1], "file"))
        assert(eq(path.split_extension("file")[0d2], ""))
        assert(eq(path.split_extension("dir\\file.tar")[0d1], "dir/file"))
        assert(eq(path.split_extension("dir\\file.tar")[0d2], "tar"))

  - name: path-extension-name
    language: Prefix
    source: |
        import("path")
        assert(eq(path.extension_name("file.txt"), "txt"))
        assert(eq(path.extension_name("archive.tar.gz"), "gz"))
        assert(eq(path.extension_name(".profile"), "profile"))
        assert(eq(path.extension_name("file."), ""))
        assert(eq(path.extension_name("file"), ""))
        assert(eq(path.extension_name("dir\\file.TXT"), "TXT"))
        assert(eq(type(path.extension_name("x")), "str"))

  - name: path-strip-extension
    language: Prefix
    source: |
        import("path")
        assert(eq(path.strip_extension("file.txt"), "file"))
        assert(eq(path.strip_extension("archive.tar.gz"), "archive.tar"))
        assert(eq(path.strip_extension(".profile"), ""))
        assert(eq(path.strip_extension("file."), "file"))
        assert(eq(path.strip_extension("file"), "file"))
        assert(eq(path.strip_extension("dir\\file.txt"), "dir/file"))
        assert(eq(type(path.strip_extension("x")), "str"))

  - name: path-temp-file
    language: Prefix
    source: |
        import("path")
        str result = path.temp_file("file.txt")
        assert(eq(type(result), "str"))
        if(eq(os(), "win")){
            assert(eq(result, "C:/Windows/Temp/file.txt"))
            assert(eq(path.temp_file("dir/sub/file.txt"), "C:/Windows/Temp/dir/sub/file.txt"))
            assert(eq(path.temp_file("dir\\file.txt"), "C:/Windows/Temp/dir\\file.txt"))
        } elseif(eq(os(), "mac")){
            assert(false)
        } else {
            assert(eq(result, "/tmp/file.txt"))
            assert(eq(path.temp_file("dir/sub/file.txt"), "/tmp/dir/sub/file.txt"))
            assert(eq(path.temp_file("dir\\file.txt"), "/tmp/dir\\file.txt"))
        }
        if(eq(os(), "win")){
            assert(eq(path.temp_file(""), "C:/Windows/Temp/"))
        } elseif(eq(os(), "mac")){
            assert(false)
        } else {
            assert(eq(path.temp_file(""), "/tmp/"))
        }

